<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Readix Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --elevated:#FFFFFF;
  --ink:#0D1220; --ink-soft:#4A5468; --ink-faint:#8992A6;
  --line:#E3E7EF; --line-strong:#D2D8E4;
  --brand:#4F46E5; --brand-2:#6D5CF5; --brand-ink:#3A2FD6; --brand-soft:#ECEBFF; --brand-glow:rgba(79,70,229,.22);
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444; --danger-soft:#FEECEC;
  --field:#3B82F6; --field-bg:rgba(59,130,246,.14);
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(13,18,32,.06),0 1px 3px rgba(13,18,32,.05);
  --shadow:0 4px 12px rgba(13,18,32,.07),0 14px 34px rgba(13,18,32,.10);
  --shadow-lg:0 18px 40px rgba(13,18,32,.16),0 40px 80px rgba(13,18,32,.20);
  --ease:cubic-bezier(.2,.7,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(13,18,32,.08);
  --topbar:54px; --menubar:46px; --tabbar:40px;
}
:root[data-theme="dark"]{
  --bg:#0B0E16; --surface:#141926; --surface-2:#1B2130; --elevated:#1B2130;
  --ink:#EAEEF7; --ink-soft:#AAB3C6; --ink-faint:#6C7590;
  --line:#252C3C; --line-strong:#333B4E;
  --brand:#7C6DFF; --brand-2:#9385FF; --brand-ink:#A99EFF; --brand-soft:#20223A; --brand-glow:rgba(124,109,255,.30);
  --glass:rgba(20,25,38,.72); --glass-line:rgba(255,255,255,.07);
  --field:#5B9BFF; --field-bg:rgba(91,155,255,.16);
  --shadow:0 4px 12px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.grad-text{background:linear-gradient(120deg,var(--brand-2),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:content-box}
/* ===== Barre supérieure ===== */
.topbar{height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line);position:relative;z-index:60}
.brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;cursor:pointer;user-select:none}
.brand .logo{width:30px;height:30px;filter:drop-shadow(0 4px 10px var(--brand-glow))}
.brand .thin{color:var(--ink-faint);font-weight:500}
.ico{width:34px;height:34px;border:none;background:none;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft);transition:background .15s,color .15s}
.ico:hover{background:var(--surface-2);color:var(--ink)}
.ico:disabled{opacity:.35;cursor:default}
.ico svg{width:19px;height:19px}
.nav-arrows{display:flex;gap:2px}
.spring{flex:1}
.docname{font-size:13px;font-weight:600;color:var(--ink-soft);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-dot{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:5px}
.save-dot .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-dot.dirty .d{background:var(--warn)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;font-family:'Space Grotesk',sans-serif;border:none}
.btn{height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px var(--brand-glow);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{border-color:var(--brand);filter:none}
.btn.sm{height:32px;padding:0 13px;font-size:12.5px}
.btn svg{width:15px;height:15px}
/* menu créer */
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);min-width:210px;background:var(--elevated);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:80}
.menu.open{display:block;animation:pop .16s var(--ease-out)}
.menu.right{right:0}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:16px;height:16px;color:var(--ink-soft)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .um-head{padding:9px 11px 4px}
.um-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.um-email{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-badge{display:inline-block;margin:2px 11px 6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink)}
/* ===== Barre de menu (niveau 2) ===== */
.menubar{height:var(--menubar);display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:50}
.mtabs{display:flex;gap:2px}
.mtab{height:34px;padding:0 13px;border:none;background:none;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.mtab:hover{background:var(--surface-2);color:var(--ink)}
.mtab.on{background:var(--brand-soft);color:var(--brand-ink)}
.mtab svg{width:16px;height:16px}
.search{position:relative;flex:1;max-width:440px;margin:0 8px}
.search input{width:100%;height:34px;padding:0 12px 0 35px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);font-size:13px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-glow)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
.search .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px}
/* ===== Barre d'onglets ===== */
.tabbar{height:var(--tabbar);display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-x:auto}
.wtab{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;max-width:210px;flex:none}
.wtab.on{color:var(--ink);border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-glow)}
.wtab .nm{overflow:hidden;text-overflow:ellipsis}
.wtab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink-faint);font-size:13px}
.wtab .x:hover{background:var(--surface-2);color:var(--ink)}
.tab-new{width:30px;height:30px;border:1px dashed var(--line-strong);background:none;border-radius:9px;color:var(--ink-soft);display:grid;place-items:center;flex:none}
.tab-new:hover{border-color:var(--brand);color:var(--brand)}
/* ===== Corps : rails + document ===== */
.body{display:flex;height:calc(100vh - var(--topbar) - var(--menubar) - var(--tabbar));position:relative;overflow:hidden}
.lrail{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s var(--ease)}
.lrail-head{display:flex;align-items:center;padding:14px 16px 6px}
.lrail-head h2{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}
.lrail-head .ico{margin-left:auto;width:28px;height:28px}
.lrail-scroll{flex:1;overflow-y:auto;padding:2px 10px 12px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:12px 10px 5px}
.tool{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:none;background:none;border-radius:10px;text-align:left;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .14s}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.tool .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.tool.on .ic{background:var(--surface)}
.tool .ic svg{width:17px;height:17px;color:var(--brand)}
.tool .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrail.mini{width:62px}
.lrail.mini .lb,.lrail.mini .grp,.lrail.mini h2{display:none}
.lrail.mini .tool{justify-content:center;padding:8px 0}
/* zone document */
.stage{flex:1;min-width:0;position:relative;overflow:auto;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 82%, #000 4%))}
.stage.empty{display:grid;place-items:center}
.opener{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:20px;padding:48px 44px;text-align:center;max-width:460px;cursor:pointer;transition:.2s}
.opener:hover{border-color:var(--brand);background:var(--brand-soft)}
.opener .big{width:52px;height:52px;color:var(--brand);margin-bottom:16px}
.opener h3{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-bottom:7px}
.opener p{font-size:14px;color:var(--ink-soft);margin-bottom:20px;max-width:340px}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
.page{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:3px}
.page canvas{display:block;border-radius:3px;pointer-events:none}
/* couche champs (Remplir & Signer) */
.flayer{position:absolute;inset:0;pointer-events:none}
.field{position:absolute;box-sizing:border-box;border:1px solid var(--field);background:var(--field-bg);border-radius:2px;font-family:inherit;color:#0A2540;padding:0 3px;pointer-events:auto;outline:none;transition:background .12s}
.field:hover{background:color-mix(in srgb,var(--field) 30%, transparent)}
.field:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-glow);z-index:5}
textarea.field{resize:none;overflow:hidden;line-height:1.15}
.fcheck{position:absolute;box-sizing:border-box;pointer-events:auto;margin:0;accent-color:var(--brand);cursor:pointer;z-index:3}
/* barre d'action d'outil */
.actionbar{position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:14px auto 0;max-width:900px;box-shadow:var(--shadow-sm)}
.actionbar .info{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.actionbar .sp{flex:1}
/* ===== Rail droit ===== */
.rrail{width:52px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rrail .ico{width:38px;height:38px}
.rrail .ico.on{background:var(--brand-soft);color:var(--brand-ink)}
.rrail .ai{width:38px;height:38px;border:none;border-radius:11px;background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px var(--brand-glow);margin-bottom:4px}
.rrail .spring{flex:1}
.rzoom{display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.rzoom button{width:34px;height:30px;border:none;background:none;color:var(--ink-soft);font-size:16px}
.rzoom button:hover{background:var(--surface);color:var(--ink)}
.rzoom .z{font-size:10px;color:var(--ink-faint);font-weight:600;padding:2px 0}
/* panneau droit */
.rpanel{position:absolute;right:52px;top:0;bottom:0;width:246px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(13,18,32,.06);z-index:40;display:none;flex-direction:column}
.rpanel.open{display:flex;animation:pop .18s var(--ease-out)}
.rpanel-head{display:flex;align-items:center;padding:14px 14px 8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.rpanel-head .ico{margin-left:auto;width:28px;height:28px}
.rpanel-body{flex:1;overflow-y:auto;padding:8px 12px 16px}
.rp-empty{color:var(--ink-faint);font-size:13px;padding:20px 6px;text-align:center}
.thumb{position:relative;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff}
.thumb:hover{border-color:var(--brand)}
.thumb canvas{width:100%;display:block}
.thumb .n{position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;opacity:.85}
.rp-input{width:100%;height:34px;padding:0 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);font-size:13px;color:var(--ink);margin-bottom:10px}
.rp-input:focus{outline:none;border-color:var(--brand)}
.rp-res{padding:9px 11px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.rp-res:hover{background:var(--surface-2);color:var(--ink)}
/* ===== toasts + modales ===== */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:300}
.toast{background:var(--elevated);border:1px solid var(--line-strong);border-left:3px solid var(--brand);border-radius:11px;box-shadow:var(--shadow-lg);padding:12px 15px;font-size:13.5px;min-width:220px;max-width:340px;animation:slidein .2s var(--ease-out)}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(13,18,32,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:250;padding:20px}
.overlay.open{display:grid}
.dialog{background:var(--elevated);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px;max-width:420px;width:100%;animation:pop .2s var(--ease-out)}
.dialog h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--ink-soft);line-height:1.55;margin-bottom:20px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.spin{width:14px;height:14px;border:2px solid var(--brand-glow);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.floatsig{position:fixed;right:18px;bottom:86px;width:190px;background:var(--elevated);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;display:none}
.floatsig.show{display:block}
.floatsig h4{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:11px 12px 6px}
.floatsig .list{max-height:220px;overflow-y:auto;padding:0 10px}
.sigitem{position:relative;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;cursor:grab}
.sigitem img{width:100%;display:block;border-radius:9px}
.sigitem .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:12px}
.floatsig .add{margin:6px 10px 12px;width:calc(100% - 20px)}
/* éléments déplaçables (signature, édition) */
.movEl{position:absolute;box-sizing:border-box}
.movEl.selEl{outline:2px solid var(--brand);outline-offset:1px}
/* Phase 7/8 — assistant compact : ne recouvre pas le rail de zoom */
.cbot-fab{position:fixed;right:64px;bottom:142px;width:34px;height:34px;border:none;border-radius:10px;background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px var(--brand-glow);z-index:180;cursor:pointer}
.cbot-fab svg{width:18px;height:18px}.cbot{position:fixed;right:60px;bottom:184px;width:300px;max-width:calc(100vw - 80px);background:var(--elevated);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lg);z-index:190;display:none;overflow:hidden}.cbot.open{display:flex;flex-direction:column}.cbot-head{display:flex;align-items:center;gap:8px;padding:10px 11px;background:var(--surface-2);border-bottom:1px solid var(--line)}.cbot-name{font-weight:700;font-size:13px}.cbot-sub{font-size:10px;color:var(--ink-faint)}.cbot-close{margin-left:auto;border:0;background:none;color:var(--ink-soft);cursor:pointer}.cbot-body{max-height:300px;overflow:auto;padding:10px}.cbot-msg{font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:10px;margin-bottom:7px}.cbot-msg.bot{background:var(--surface-2);color:var(--ink)}.cbot-msg.user{background:var(--brand-soft);color:var(--ink);margin-left:20px}.cbot-inputrow{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.cbot-input{flex:1;min-width:0;height:32px;border:1px solid var(--line-strong);border-radius:8px;padding:0 9px;background:var(--surface);color:var(--ink)}.cbot-send{height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}.cbot-chips{display:flex;flex-wrap:wrap;gap:5px}.cbot-chips button{font-size:10.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:5px 8px;cursor:pointer}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.price-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface-2)}.price-card h4{font-size:14px;margin-bottom:4px}.price-card .price{font-size:22px;font-weight:800;font-family:'Space Grotesk',sans-serif}.price-card p{font-size:11.5px;color:var(--ink-soft);min-height:34px;margin:4px 0 10px}.price-card button{width:100%}
@media(max-width:860px){.cbot-fab{right:64px;bottom:80px}.cbot{right:58px;bottom:120px}.price-grid{grid-template-columns:1fr 1fr}}

.movH{position:absolute;width:12px;height:12px;background:var(--brand);border:2px solid #fff;border-radius:50%;pointer-events:auto;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.3);display:none}
.movEl.selEl .movH{display:block}
.movDel{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border:2px solid #fff;background:var(--danger);color:#fff;border-radius:50%;font-size:11px;display:none;place-items:center;pointer-events:auto;z-index:11}
.movEl.selEl .movDel{display:grid}
.edtext{cursor:move;user-select:none;min-width:40px;min-height:18px}
.edtext[contenteditable="true"]{cursor:text;user-select:text}
.edtext:empty::before{content:attr(data-ph);opacity:.42;pointer-events:none}
.edtext:focus::before{content:""}
/* barre d'édition (Modifier) */
.edbar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:14px auto 0;max-width:940px;box-shadow:var(--shadow-sm)}

ound:#fff2a8;border-bottom:2px solid #d6b500;cursor:help}.doc-change{background:#e8f5e9;text-decoration:underline;text-decoration-color:#2e7d32;text-decoration-thickness:1.5px}.doc-reviewbar{display:none;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid #e6e8eb;background:#fafafa;color:#5f6368;font-size:10.5px}.doc-reviewbar.open{display:flex}.doc-reviewbar button{font:inherit;border:1px solid #dadce0;background:#fff;border-radius:4px;padding:5px 8px;cursor:pointer;color:#3c4043}.doc-reviewbar button:hover{background:#f1f3f4}

/* ---------- IndexedDB (autosave) ---------- */

});}

function newTabObj(name){return {id:"t"+Date.now()+Math.floor(Math.random()*1e3),name:name||"Nouvel onglet",bytes:null,pdf:null,tool:"home",page:1,zoom:1,fields:[],sigs:[],dirty:false,doc:null,docMeta:{margin:78,paper:"A4"},nav:{stack:[{tool:"home",page:1}],index:0}};}

/* ---------- onglets ---------- */
function renderTabs(){
  const bar=$("#tabbar");bar.innerHTML="";

    const w=el("div","wtab"+(t.id===APP.active?" on":""));

}
function createTab(name){const t=newTabObj(name);APP.tabs.push(t);switchTab(t.id,true);return t;}
function switchTab(id,push){
  APP.active=id;const t=activeTab();if(!t)return;
  APP.tool=t.tool||"home";
  renderTabs();renderTools();renderView();updateHeader();updateNavBtns();
  if(push!==false)pushHist();
}
async function closeTab(id){
  const t=APP.tabs.find(x=>x.id===id);if(!t)return;
  if(t.dirty){const a=await confirmSave();if(a==="cancel")return;if(a==="yes"){APP.active=id;await doSave();}}
  await idbDel(id);
  const i=APP.tabs.findIndex(x=>x.id===id);APP.tabs.splice(i,1);
  if(APP.active===id){APP.active=APP.tabs.length?APP.tabs[Math.max(0,i-1)].id:null;}
  if(!APP.tabs.length){createTab();}else{switchTab(APP.active);}
}
function markDirty(){const t=activeTab();if(!t)return;t.dirty=true;updateSaveDot();scheduleAutosave();}

/* ---------- autosave ---------- */
let _asTimer=null;

async function autosave(){
  const t=activeTab();if(!t)return;
  if(t.tool==="docstudio"){if(t.doc){await idbSave(t.id,{name:t.name,tool:"docstudio",doc:t.doc,docMeta:t.docMeta||{margin:78,paper:"A4"},dirty:false});t.dirty=false;updateDocStudioStatus(t,false);}return;}
  if(!t.bytes)return;
  const fieldVals=t.fields?t.fields.map(f=>({name:f.name,type:f.type,val:f.el?(f.el.type==="checkbox"||f.el.type==="radio"?f.el.checked:f.el.value):null,ex:f.ex})):[];
  await idbSave(t.id,{name:t.name,tool:t.tool,page:t.page,zoom:t.zoom,bytes:Array.from(u8(t.bytes)),fieldVals});
  const dot=$("#saveDot");if(dot)$(".t",dot).textContent="Enregistré";
}
async function offerResume(){
  const all=await idbAll();if(!all.length)return;
  const dl=dialog(`<h3>Reprendre votre travail ?</h3><p>${all.length} document(s) de votre dernière session ont été retrouvés. Voulez-vous les rouvrir ?</p><div class="row"><button class="btn ghost sm" data-a="no">Ignorer</button><button class="btn sm" data-a="yes">Reprendre</button></div>`);
  dl.root.onclick=async e=>{const a=e.target.closest("[data-a]");if(!a)return;dl.close();
    if(a.dataset.a==="no"){for(const s of all)await idbDel(s.id);return;}
    for(const s of all){ try{
      const t=newTabObj(s.name);t.id=s.id;t.bytes=new Uint8Array(s.bytes);t.tool=s.tool||"home";t.doc=s.doc||null;
      t._resumeFields=s.fieldVals||[];
      APP.tabs.push(t);
    }catch(e){} }
    if(APP.tabs.length){switchTab(APP.tabs[APP.tabs.length-1].id);}
  };
}

/* ---------- historique interne par onglet ---------- */
function pushHist(state){const t=activeTab();if(!t)return;const nav=t.nav||(t.nav={stack:[{tool:t.tool||"home",page:t.page||1}],index:0});const next=state||{tool:t.tool||"home",page:t.page||1};const cur=nav.stack[nav.index];if(cur&&cur.tool===next.tool&&cur.page===next.page){updateNavBtns();return;}nav.stack=nav.stack.slice(0,nav.index+1);nav.stack.push(next);nav.index=nav.stack.length-1;updateNavBtns();}
function updateNavBtns(){const t=activeTab(),nav=t&&t.nav;const back=!!(nav&&nav.index>0),fwd=!!(nav&&nav.index<nav.stack.length-1);$("#navBack").disabled=!back;$("#navFwd").disabled=!fwd;$("#navBack").classList.toggle("on",back);$("#navFwd").classList.toggle("on",fwd);}
function navigateTab(delta){const t=activeTab();if(!t||!t.nav)return;const ni=t.nav.index+delta;if(ni<0||ni>=t.nav.stack.length)return;t.nav.index=ni;const st=t.nav.stack[ni];t.tool=st.tool||"home";t.page=st.page||t.page||1;APP.tool=t.tool;renderTabs();renderTools();renderView();updateHeader();updateNavBtns();}
$("#navBack").onclick=()=>navigateTab(-1);

/* ---------- enregistrement (pipeline unique) ---------- */
async function saveBytes(bytes,suggestedName){
  try{
    if(window.showSaveFilePicker){
      const h=await window.showSaveFilePicker({suggestedName,types:[{description:"PDF",accept:{"application/pdf":[".pdf"]}}]});
      const w=await h.createWritable();await w.write(bytes);await w.close();return true;
    }
  }catch(e){if(e&&e.name==="AbortError")return false;}
  const name=(prompt("Nom du fichier :",suggestedName)||suggestedName);
  const blob=new Blob([bytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name.endsWith(".pdf")?name:name+".pdf";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
async function doSave(){
  const t=activeTab();if(!t||!t.bytes){toast("Aucun document à enregistrer.","warn");return;}
  if(t.tool==="editpdf"){return doSaveEdit(t);}
  if(t.tool==="docstudio"){return saveDocStudio(t,"docx");}
  let out=u8(t.bytes);
  try{ if(t.tool==="fillsign") out=await fillsignExport(t); }catch(e){}
  const ok=await saveBytes(out,(t.name||"document").replace(/\.pdf$/i,"")+"-readix.pdf");
  if(ok){t.dirty=false;updateSaveDot();toast("Document enregistré.","ok");}
}
/* ---------- rendu net (haute résolution) ---------- */
async function renderPageTo(page,scale,container,cls){
  const dpr=Math.max(2,window.devicePixelRatio||1);
  const vp=page.getViewport({scale});
  const wrap=el("div",cls||"page");wrap.style.width=vp.width+"px";wrap.style.height=vp.height+"px";wrap.dataset.page=page.pageNumber;
  const cv=el("canvas");cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);cv.style.width=vp.width+"px";cv.style.height=vp.height+"px";
  const ctx=cv.getContext("2d",{alpha:false});ctx.scale(dpr,dpr);
  wrap.appendChild(cv);container.appendChild(wrap);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return {wrap,vp};
}

/* ---------- ouvrir un PDF dans l'onglet actif ---------- */
async function openPdfBytes(bytes,name){
  let t=activeTab();
  if(!t){t=createTab(name);} 
  t.bytes=u8(bytes);t.name=name||t.name;
  try{ t.pdf=await pdfjsLib.getDocument({data:u8(bytes).slice(0)}).promise; }catch(e){toast("PDF illisible.","err");return;}
  if(t.tool==="home"){t.tool="view";APP.tool="view";pushHist({tool:"view",page:t.page||1});}else APP.tool=t.tool;
  renderTabs();renderTools();renderView();updateHeader();updateNavBtns();
  scheduleAutosave();
}
$("#hiddenFile").onchange=async e=>{const f=e.target.files[0];if(f){await openPdfBytes(await readAB(f),f.name);}e.target.value="";};


/* ---------- Phase 11 : Readix Document Studio ---------- */
function defaultDocHTML(){return '<h1>Nouveau document</h1><p>Commencez à écrire votre document ici…</p><p></p>';}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\'/g,'&apos;');}
function xmlText(s){return escXml(s).replace(/\n/g,'<w:br/>');}
function docBlocksFromHTML(html){const box=document.createElement('div');box.innerHTML=html;const blocks=[];const walk=node=>{if(node.nodeType===Node.TEXT_NODE){if(node.textContent.trim())blocks.push({type:'p',text:node.textContent});return;}if(node.nodeType!==Node.ELEMENT_NODE)return;const tag=node.tagName.toLowerCase();if(/^h[1-3]$/.test(tag)){blocks.push({type:'h',level:+tag[1],text:node.innerText||''});return;}if(tag==='p'||tag==='blockquote'){blocks.push({type:tag,text:node.innerText||''});return;}if(tag==='ul'||tag==='ol'){[...node.children].forEach(li=>blocks.push({type:'li',text:li.innerText||'',ordered:tag==='ol'}));return;}if(tag==='table'){blocks.push({type:'table',html:node.outerHTML});return;}[...node.childNodes].forEach(walk);};[...box.childNodes].forEach(walk);return blocks.length?blocks:[{type:'p',text:''}];}
function docxXmlFromHTML(html,title){const blocks=docBlocksFromHTML(html);let body='';for(const b of blocks){if(b.type==='table'){const tb=document.createElement('div');tb.innerHTML=b.html;const rows=[...tb.querySelectorAll('tr')];body+='<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single" w:sz="4"/><w:left w:val="single" w:sz="4"/><w:bottom w:val="single" w:sz="4"/><w:right w:val="single" w:sz="4"/><w:insideH w:val="single" w:sz="4"/><w:insideV w:val="single" w:sz="4"/></w:tblBorders></w:tblPr>';for(const r of rows){body+='<w:tr>';for(const c of [...r.children])body+='<w:tc><w:p><w:r><w:t xml:space="preserve">'+xmlText(c.innerText||'')+'</w:t></w:r></w:p></w:tc>';body+='</w:tr>';}body+='</w:tbl>';continue;}let ppr='';if(b.type==='h')ppr='<w:pPr><w:pStyle w:val="Heading'+b.level+'"/></w:pPr>';if(b.type==='li')ppr='<w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="'+(b.ordered?2:1)+'"/></w:numPr></w:pPr>';if(b.type==='blockquote')ppr='<w:pPr><w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="6352FF"/></w:pBdr></w:pPr>';body+='<w:p>'+ppr+'<w:r><w:t xml:space="preserve">'+xmlText(b.text||'')+'</w:t></w:r></w:p>';}
const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>';
return {documentXml,title:title||'Nouveau document'};}
async function buildDocxBlob(html,title){const zip=new JSZip();const o=docxXmlFromHTML(html,title);zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');zip.folder('_rels').file('.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');const wf=zip.folder('word');wf.file('document.xml',o.documentXml);wf.file('styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:rPr><w:b/><w:sz w:val="26"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:rPr><w:b/><w:sz w:val="22"/></w:rPr></w:style></w:styles>');return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
async function saveDocStudio(t,format){const ed=document.querySelector('.doceditor');if(ed)t.doc=ed.innerHTML;t.dirty=false;const title=(t.name||'Nouveau document').replace(/\.(docx?|pdf)$/i,'')||'Nouveau document';if(format==='docx'){const blob=await buildDocxBlob(t.doc||defaultDocHTML(),title);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Document Word exporté.','ok');updateDocStudioStatus(t,false);return true;}return false;}
async function importDocxFile(file,t){try{const zip=await JSZip.loadAsync(file);const xml=await zip.file('word/document.xml').async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';const paras=[...doc.getElementsByTagNameNS(ns,'p')];let html='';for(const p of paras){const texts=[...p.getElementsByTagNameNS(ns,'t')].map(x=>x.textContent).join('');const style=p.getElementsByTagNameNS(ns,'pStyle')[0]?.getAttributeNS(ns,'val')||'';let tag=style==='Heading1'?'h1':style==='Heading2'?'h2':style==='Heading3'?'h3':'p';html+='<'+tag+'>'+String(texts).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</'+tag+'>';}t.doc=html||defaultDocHTML();t.name=file.name;t.tool='docstudio';APP.tool='docstudio';renderTabs();renderTools();renderView();updateHeader();toast('Document Word importé.','ok');}catch(e){toast('Impossible de lire ce DOCX.','err');}}
function updateDocStudioStatus(t,dirty){const s=document.querySelector('.docstudio-status');if(!s)return;s.textContent=dirty?'Modifications non enregistrées':'Enregistré localement';s.classList.toggle('dirty',dirty);s.classList.toggle('ok',!dirty);}
function docExec(cmd,val){document.execCommand(cmd,false,val);const ed=document.querySelector('.doceditor');if(ed){const t=activeTab();if(t){t.doc=ed.innerHTML;t.dirty=true;updateDocStudioStatus(t,true);scheduleDocSave(t);}}}
let _docSaveTimer=null;function scheduleDocSave(t){clearTimeout(_docSaveTimer);_docSaveTimer=setTimeout(async()=>{try{const db=await idb();const tx=db.transaction('tabs','readwrite');tx.objectStore('tabs').put({id:t.id,name:t.name,tool:'docstudio',doc:t.doc||defaultDocHTML(),docMeta:t.docMeta||{margin:78,paper:'A4'},dirty:false,ts:Date.now()});t.dirty=false;updateDocStudioStatus(t,false);}catch(e){}},700);}
let DOC_ACTIVE_TABLE=null;
function docMarkDirty(){const ed=document.querySelector('.doceditor');const t=activeTab();if(!ed||!t)return;t.doc=ed.innerHTML;t.dirty=true;updateDocStudioStatus(t,true);scheduleDocSave(t);}
function docSelectTable(table){if(DOC_ACTIVE_TABLE&&DOC_ACTIVE_TABLE!==table)DOC_ACTIVE_TABLE.classList.remove('doc-active-table');DOC_ACTIVE_TABLE=table||null;if(DOC_ACTIVE_TABLE)DOC_ACTIVE_TABLE.classList.add('doc-active-table');const bar=document.querySelector('.doctablebar');if(bar)bar.classList.toggle('open',!!DOC_ACTIVE_TABLE);}
function docGetTable(){return DOC_ACTIVE_TABLE&&document.querySelector('.doceditor')?.contains(DOC_ACTIVE_TABLE)?DOC_ACTIVE_TABLE:null;}
function docInsertTable(){const ed=document.querySelector('.doceditor');if(!ed)return;const html='<table><tbody><tr><th>Colonne 1</th><th>Colonne 2</th></tr><tr><td>Texte</td><td>Texte</td></tr></tbody></table><p></p>';ed.focus();docExec('insertHTML',html);const tables=[...ed.querySelectorAll('table')];docSelectTable(tables[tables.length-1]||null);}
function docTableRows(table){return [...table.rows];}
function docTableCols(table){return table.rows.length?Math.max(...[...table.rows].map(r=>r.cells.length)):0;}
function docAddRow(where='after'){const table=docGetTable();if(!table)return;const cols=docTableCols(table);if(!cols)return;const tr=table.insertRow(where==='before'?0:-1);for(let i=0;i<cols;i++){const c=document.createElement('td');c.textContent='Texte';c.contentEditable='true';tr.appendChild(c);}docMarkDirty();}

  const sign=el("button","btn ghost sm","✍ Signature");sign.onclick=()=>{ $("#floatsig").classList.add("show"); openSignaturePad(); };

  const pages=el("div","pages");stage.appendChild(pages);

    const layer=el("div","flayer");wrap.appendChild(layer);

      } else if(a.fieldType==="Btn"){
        const ex=(a.exportValue||a.buttonValue||"Yes");const sz=Math.max(10,Math.min(w,h));

async function fillsignExport(t){
  const {PDFDocument}=PDFLib;const doc=await PDFDocument.load(u8(t.bytes).slice(0));const form=doc.getForm();
  (t.fields||[]).forEach(f=>{try{
    if(f.type==="text")form.getTextField(f.name).setText(f.el.value||"");

    else if(f.type==="radio"){if(f.el.checked)form.getRadioGroup(f.name).select(f.ex);}
    else if(f.type==="choice"){try{form.getDropdown(f.name).select(f.el.value);}catch(e){form.getOptionList(f.name).select(f.el.value);}}
  }catch(e){}});
  // incruster les signatures posées
  for(const s of (t.sigs||[])){try{
    const png=await doc.embedPng(s.url);const pg=doc.getPage(s.page-1);const {height}=pg.getSize();
    pg.drawImage(png,{x:s.xPt,y:height-s.yPt-s.hPt,width:s.wPt,height:s.hPt});
  }catch(e){}}
  return await doc.save();
}

function openSignaturePad(){

  const cv=$("#sigpad",dl.root);const ctx=cv.getContext("2d");ctx.lineWidth=2.5;ctx.lineCap="round";ctx.strokeStyle="#111";let drawing=false,has=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=(e.touches?e.touches[0]:e);return {x:(p.clientX-r.left)*(cv.width/r.width),y:(p.clientY-r.top)*(cv.height/r.height)};};
  cv.onpointerdown=e=>{drawing=true;has=true;const q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);};
  cv.onpointermove=e=>{if(!drawing)return;const q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke();};
  window.addEventListener("pointerup",()=>drawing=false);
  dl.root.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;
    if(a.dataset.a==="clear"){ctx.clearRect(0,0,cv.width,cv.height);has=false;return;}
    if(a.dataset.a==="cancel"){dl.close();return;}
    if(a.dataset.a==="ok"){if(!has){toast("Dessinez d'abord votre signature.","warn");return;}addSig(cv.toDataURL("image/png"));dl.close();}
  };

function parseRanges(str,max){const out=[];(str||"").split(",").forEach(part=>{part=part.trim();if(!part)return;const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b){const z=a;a=b;b=z;}for(let i=a;i<=b;i++)if(i>=1&&i<=max)out.push(i);}else if(/^\d+$/.test(part)){const n=+part;if(n>=1&&n<=max)out.push(n);}});return[...new Set(out)];}

    const layer=el("div","flayer");layer.style.pointerEvents="auto";layer.dataset.page=i;wrap.appendChild(layer);
    layer.addEventListener("pointerdown",e=>{if(e.target!==layer)return;const r=layer.getBoundingClientRect();
      const it=el("div","movEl");it.dataset.type="redact";it.dataset.color="#000000";

    });
  }

    for(const it of $$(".flayer .movEl")){const pn=+it.parentNode.dataset.page;if(!pn)continue;const pg=doc.getPage(pn-1);const {height}=pg.getSize();
      const x=parseFloat(it.style.left)/scale,yt=parseFloat(it.style.top)/scale,w=it.offsetWidth/scale,h=it.offsetHeight/scale;

function renderCompare(t,stage){
  const wrap=el("div");wrap.style.cssText="max-width:940px;margin:20px auto;padding:0 20px";
  wrap.innerHTML='<div class="actionbar"><span class="info">Comparez deux PDF : les différences de texte sont mises en évidence.</span></div>';

  const mk=(lbl)=>{const d=el("div");d.style.cssText="flex:1;min-width:220px;border:1.5px dashed var(--line-strong);border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:var(--surface)";d.innerHTML=`<div style="font-weight:600">${lbl}</div><div style="font-size:12px;color:var(--ink-faint);margin-top:4px">Cliquez pour choisir un PDF</div>`;return d;};
  const dA=mk("Version A"),dB=mk("Version B");drops.append(dA,dB);wrap.appendChild(drops);
  const res=el("div");res.style.cssText="margin-top:16px";wrap.appendChild(res);stage.appendChild(wrap);
  let txtA=null,txtB=null;
  const fi=el("input");fi.type="file";fi.accept="application/pdf";fi.hidden=true;stage.appendChild(fi);let target=null;
  async function pick(which,d){target=which;fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const ab=await readAB(f);const pdf=await pdfjsLib.getDocument({data:u8(ab).slice(0)}).promise;let txt="";for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);txt+=(await p.getTextContent()).items.map(x=>x.str).join(" ")+"\n";}
    if(which==="A"){txtA=txt;d.innerHTML='<div style="font-weight:600;color:var(--ok)">✓ Version A chargée</div>';}else{txtB=txt;d.innerHTML='<div style="font-weight:600;color:var(--ok)">✓ Version B chargée</div>';}
    fi.value="";if(txtA!=null&&txtB!=null)diff();};fi.click();}
  dA.onclick=()=>pick("A",dA);dB.onclick=()=>pick("B",dB);
  function diff(){const a=txtA.split(/\s+/),b=txtB.split(/\s+/);const setB=new Set(b),setA=new Set(a);
    const added=b.filter(w=>!setA.has(w)),removed=a.filter(w=>!setB.has(w));
    res.innerHTML=`<div class="actionbar" style="display:block"><div style="margin-bottom:8px"><b style="color:var(--ok)">Ajouté dans B (${added.length}) :</b> ${added.slice(0,120).join(" ")||"—"}</div><div><b style="color:var(--danger)">Retiré de A (${removed.length}) :</b> ${removed.slice(0,120).join(" ")||"—"}</div></div>`;}
}

  const orig=(u8(t.bytes).length/1024/1024).toFixed(2);
  w.innerHTML=`<div class="actionbar" style="flex-direction:column;align-items:stretch;gap:12px"><div class="info">Compresser «${t.name}» — taille actuelle : ${orig} Mo</div>
    <label style="font-size:12.5px;color:var(--ink-soft)">Qualité <input id="cQ" type="range" min="40" max="90" value="65"> <span id="cQv">65%</span></label>
    <div style="font-size:12px;color:var(--ink-faint)">La compression re-encode chaque page en image (le texte devient non sélectionnable). Idéal pour les documents scannés / volumineux.</div>
    <button class="btn sm" id="cGo" style="align-self:flex-start">Compresser et enregistrer</button><div id="cOut" style="font-size:13px;color:var(--ink-soft)"></div></div>`;
  stage.appendChild(w);
  $("#cQ",w).oninput=e=>$("#cQv",w).textContent=e.target.value+"%";
  $("#cGo",w).onclick=async()=>{try{const btn=$("#cGo",w);btn.disabled=true;btn.textContent="Compression…";
    const {PDFDocument}=PDFLib;const doc=await PDFDocument.create();const q=(+$("#cQ",w).value)/100;
    for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const vp=p.getViewport({scale:1.3});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);await p.render({canvasContext:cx,viewport:vp}).promise;
      const jpg=cv.toDataURL("image/jpeg",q);const emb=await doc.embedJpg(jpg);const pg=doc.addPage([emb.width,emb.height]);pg.drawImage(emb,{x:0,y:0,width:emb.width,height:emb.height});}
    const out=await doc.save();const newMb=(out.length/1024/1024).toFixed(2);
    $("#cOut",w).textContent=`Nouveau : ${newMb} Mo (${Math.max(0,Math.round((1-out.length/u8(t.bytes).length)*100))}% de réduction)`;
    await saveBytes(out,(t.name||"doc").replace(/\.pdf$/i,"")+"-compresse.pdf");toast("PDF compressé.","ok");
  }catch(e){toast("Erreur : "+e.message,"err");}finally{const btn=$("#cGo",w);btn.disabled=false;btn.textContent="Compresser et enregistrer";}};
}
/* ===================== PHASE 6 — COMPTES ===================== */
const API_BASE="";
function getToken(){try{return localStorage.getItem("readix_token");}catch(e){return null;}}
function setToken(t){try{if(t&&t!=="undefined")localStorage.setItem("readix_token",t);}catch(e){}}
function clearToken(){try{localStorage.removeItem("readix_token");}catch(e){}}
async function api(path,body,method){
  const opt={method:method||(body?"POST":"GET"),headers:{"content-type":"application/json"}};
  const t=getToken();if(t)opt.headers.authorization="Bearer "+t;
  if(body)opt.body=JSON.stringify(body);
  const r=await fetch(API_BASE+path,opt);let data={};try{data=await r.json();}catch(e){}
  if(!r.ok)throw new Error((data&&data.error)||("Erreur "+r.status));
  return data;
}
const PLAN_LABEL={free:"Gratuit",standard:"Standard",pro:"Pro",studio:"Studio"};
function updateAccount(){
  const a=$("#acctBtn"),nm=$("#umName"),em=$("#umEmail"),pl=$("#umPlan"),au=$("#umAuth"),lo=$("#umLogout");
  if(APP.user){a.textContent=((APP.user.name||APP.user.email||"U")[0]||"U").toUpperCase();nm.textContent=APP.user.name||APP.user.email;em.textContent=APP.user.email;pl.textContent=PLAN_LABEL[APP.plan]||"Gratuit";au.style.display="none";lo.style.display="block";}
  else{a.textContent="?";nm.textContent="Invité";em.textContent="non connecté";pl.textContent="Gratuit";au.style.display="block";lo.style.display="none";}
}
function openPricing(){
  const dl=dialog(`<h3>Abonnements Readix</h3><p>Choisissez un plan. Le tarif exact est celui configuré dans Stripe. Vous pourrez choisir la périodicité avant le paiement.</p>
  <div style="display:flex;gap:7px;margin:8px 0 12px"><button class="btn ghost sm" id="priceMonth">Mensuel</button><button class="btn ghost sm" id="priceYear">Annuel</button></div>
  <div class="price-grid">
    <div class="price-card"><h4>Gratuit</h4><div class="price">0</div><p>Outils PDF locaux et compte de base.</p><button class="btn ghost sm" disabled>Plan actuel</button></div>
    <div class="price-card"><h4>Standard</h4><div class="price">Selon Stripe</div><p>Fonctions avancées et usage étendu.</p><button class="btn sm" data-plan="standard">Choisir</button></div>
    <div class="price-card"><h4>Pro</h4><div class="price">Selon Stripe</div><p>Fonctions IA avec quota mensuel.</p><button class="btn sm" data-plan="pro">Choisir</button></div>
    <div class="price-card"><h4>Studio</h4><div class="price">Selon Stripe</div><p>Fonctions IA avancées et quota supérieur.</p><button class="btn sm" data-plan="studio">Choisir</button></div>
  </div>`);
  let period='month';
  const setPeriod=p=>{period=p;$('#priceMonth',dl.root).classList.toggle('on',p==='month');$('#priceYear',dl.root).classList.toggle('on',p==='year');};
  $('#priceMonth',dl.root).onclick=()=>setPeriod('month'); $('#priceYear',dl.root).onclick=()=>setPeriod('year'); setPeriod('month');
  $$('.price-card button[data-plan]',dl.root).forEach(b=>b.onclick=async()=>{try{if(!APP.user){dl.close();openAuth('login');return;}b.disabled=true;b.textContent='Ouverture…';const d=await api('/api/billing/checkout',{plan:b.dataset.plan,period});if(d.url)location.href=d.url;else throw new Error(d.error||'Checkout indisponible');}catch(e){b.disabled=false;b.textContent='Choisir';toast(e.message,'err');}});
}
async function restoreSession(){const t=getToken();if(!t)return;try{const d=await api("/api/me");if(d&&d.user){APP.user={name:d.user.name,email:d.user.email};APP.plan=d.user.plan||"free";updateAccount();}}catch(e){clearToken();}}
function openAuth(mode){
  mode=mode||"login";
  const dl=dialog(`<h3>${mode==="signup"?"Créer un compte":"Se connecter"}</h3>
    ${mode==="signup"?'<input id="auName" class="rp-input" placeholder="Nom complet" style="margin-bottom:10px">':''}
    <input id="auEmail" class="rp-input" type="email" placeholder="Adresse e-mail" style="margin-bottom:10px">
    <input id="auPass" class="rp-input" type="password" placeholder="Mot de passe" style="margin-bottom:6px">
    <div id="auErr" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px"></div>
    <div class="row"><button class="btn ghost sm" data-a="switch">${mode==="signup"?"J'ai déjà un compte":"Créer un compte"}</button><button class="btn sm" data-a="go">${mode==="signup"?"Créer mon compte":"Se connecter"}</button></div>`);
  const emailEl=$("#auEmail",dl.root);if(emailEl)setTimeout(()=>emailEl.focus(),50);
  dl.root.addEventListener("keydown",e=>{if(e.key==="Enter"){const g=dl.root.querySelector('[data-a="go"]');if(g)g.click();}});
  dl.root.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;
    if(b.dataset.a==="switch"){dl.close();openAuth(mode==="signup"?"login":"signup");return;}
    if(b.dataset.a==="go"){
      const email=($("#auEmail",dl.root).value||"").trim();const pass=$("#auPass",dl.root).value||"";
      const nameEl=$("#auName",dl.root);const name=nameEl?(nameEl.value||"").trim():"";
      const err=$("#auErr",dl.root);
      if(!email||!pass||(mode==="signup"&&!name)){err.textContent="Veuillez remplir tous les champs.";return;}
      b.disabled=true;err.textContent="";
      try{const path=mode==="signup"?"/api/signup":"/api/login";
        const d=await api(path,mode==="signup"?{name,email,password:pass}:{email,password:pass});
        setToken(d.token);APP.user={name:d.user.name,email:d.user.email};APP.plan=d.user.plan||"free";updateAccount();dl.close();
        toast("Bienvenue "+(d.user.name||d.user.email)+" !","ok");
      }catch(ex){err.textContent=ex.message;b.disabled=false;}
    }
  };
}
function logout(){clearToken();APP.user=null;APP.plan="free";updateAccount();toast("Vous êtes déconnecté.","ok");}
$("#umAuth").onclick=()=>{$("#acctMenu").classList.remove("open");openAuth("login");};
$("#umLogout").onclick=()=>{$("#acctMenu").classList.remove("open");logout();};
/* ---------- en-tête, thème, menus, init ---------- */
function updateHeader(){const t=activeTab();$("#docName").textContent=t&&t.pdf?t.name:"";updateSaveDot();
  $("#floatsig").classList.toggle("show",!!(t&&t.tool==="fillsign"&&t.pdf));}
$("#saveBtn").onclick=doSave;
$("#printBtn").onclick=()=>window.print();
$("#brandHome").onclick=()=>openTool("view");
$("#themeBtn").onclick=()=>{const d=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",d);try{localStorage.setItem("readix_theme",d);}catch(e){}};
try{const th=localStorage.getItem("readix_theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
$("#railMini").onclick=()=>$("#lrail").classList.toggle("mini");
$("#mobMenu").onclick=()=>$("#lrail").classList.toggle("mobopen");
function fixMob(){$("#mobMenu").style.display=window.innerWidth<=860?"grid":"none";}
window.addEventListener("resize",fixMob);fixMob();

/* menus déroulants (Créer, Compte) */
function bindMenu(btn,menu){btn.onclick=e=>{e.stopPropagation();const open=menu.classList.contains("open");$$(".menu.open").forEach(m=>m.classList.remove("open"));if(!open)menu.classList.add("open");};}
bindMenu($("#createBtn"),$("#createMenu"));bindMenu($("#acctBtn"),$("#acctMenu"));
$('#umPricing').onclick=()=>{openPricing();};
$("#cbotFab").onclick=()=>toggleCopilotFloating();
$("#aiFloatClose").onclick=()=>closeAIFloating();
$("#aiFloatMin").onclick=()=>toggleAIMin();
document.addEventListener("click",()=>$$(".menu.open").forEach(m=>m.classList.remove("open")));
document.addEventListener("click",e=>{$$(".ai10-plus-menu.open").forEach(m=>{if(!m.parentElement.contains(e.target))m.classList.remove("open");});});
$("#createMenu").onclick=e=>{const b=e.target.closest("[data-create]");if(!b)return;const a=b.dataset.create;
  if(a==="tab"){createTab();openTool("view");}
  else if(a==="doc"){createTab("Nouveau document.docx");openTool("docstudio");}
  else if(a==="blank"){makeBlank();}
  else if(a==="img2pdf"){createTab("Images → PDF");openTool("tolpdf");}
};
async function makeBlank(){try{const {PDFDocument}=PDFLib;const d=await PDFDocument.create();d.addPage([595,842]);const bytes=await d.save();createTab("Nouveau document.pdf");await openPdfBytes(bytes,"Nouveau document.pdf");openTool("editpdf"in{}?"view":"view");}catch(e){}}

/* compte (Phase 1 : local, le back-end arrive en Phase 6) */
updateAccount();
$("#langSel").onchange=e=>{APP.lang=e.target.value;};

/* palette de commande */
$("#cmdInput").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.toLowerCase();const t=TOOLS.find(x=>x.name.toLowerCase().includes(q));if(t)openTool(t.id);}});
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();$("#cmdInput").focus();}
  else if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();doSave();}
  else if(mod&&e.key.toLowerCase()==="o"){e.preventDefault();$("#hiddenFile").click();}
  else if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();window.print();}
  else if(mod&&!e.shiftKey&&e.key.toLowerCase()==="z"){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editUndo();}}
  else if(mod&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editRedo();}}
});

/* ---------- init ---------- */
$("#rAi").onclick=()=>openAIFloating("__home");
(async function init(){
  createTab();switchTab(APP.active,false);
  try{await restoreSession();}catch(e){}
  try{await offerResume();}catch(e){}
  if(new URLSearchParams(location.search).get("pricing")==="1") setTimeout(openPricing,250);
  updateNavBtns();
  await initCopilotHistory();
})();
</script>
