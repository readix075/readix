/* ---------- Tableaux de calcul et notes ---------- */
const numFr=s=>{const v=parseFloat(String(s).replace(/[\s\u00A0\u202F]/g,'').replace(/[$€%]/g,'').replace(',','.'));return isFinite(v)?v:null;};
const fmtFr=v=>v.toLocaleString('fr-CA',{maximumFractionDigits:2});
function recalcTables(){ed.querySelectorAll('table[data-calc]').forEach(t=>{const rows=[...t.rows];if(rows.length<3)return;const last=rows[rows.length-1];[...last.cells].forEach((c,ci)=>{if(ci===0)return;let s=0,any=false;for(const r of rows.slice(1,-1)){const cell=r.cells[ci];const v=cell&&numFr(cell.textContent);if(v!=null){s+=v;any=true;}}const txt=any?fmtFr(s):'0';if(c.textContent!==txt&&!c.contains(document.activeElement)&&!(rng()&&c.contains(rng().startContainer)))c.textContent=txt;});});}
function renumberNotes(){const refs=[...ed.querySelectorAll('sup.rxw-fnref:not(.rxw-fnref-b)')];const box=ed.querySelector('.rxw-notes');if(!refs.length){if(box&&!box.querySelector('p[data-fn]'))box.remove();return;}if(!box)return;
  const notes=new Map([...box.querySelectorAll('p[data-fn]')].map(p=>[p.dataset.fn,p]));refs.forEach((r,i)=>{const n=String(i+1);if(r.textContent!==n)r.textContent=n;const p=notes.get(r.dataset.fn);if(p){const s=p.querySelector('sup');if(s&&s.textContent!==n)s.textContent=n;box.append(p);notes.delete(r.dataset.fn);}});notes.forEach(p=>p.remove());if(box!==ed.lastElementChild&&![...ed.children].slice([...ed.children].indexOf(box)+1).every(c=>c.classList.contains('rxw-obj')))ed.append(box);}

/* ---------- Objets dessinés ---------- */

function toEd(e){const er=ed.getBoundingClientRect(),zf=zfac();return{x:(e.clientX-er.left)/zf,y:(e.clientY-er.top)/zf};}
function makeObj(kind,x,y,w,hh){const o=h('div','rxw-obj',{contenteditable:'false','data-kind':kind});o.style.left=x+'px';o.style.top=y+'px';o.style.width=Math.max(1,w)+'px';o.style.height=Math.max(1,hh)+'px';
  const d=o.dataset;if(OPEN_KINDS.has(kind)){d.stroke=kind==='ink'?S.pen.color:'#13305F';d.sw=kind==='ink'?String(S.pen.w):'1.5';if(kind==='arrow')d.arrow='end';if(kind==='dblarrow')d.arrow='both';}
  else if(kind==='textbox'){d.fill='#FFFFFF';d.stroke='#13305F';d.sw='0.75';}else{d.fill=S.fill;d.stroke=S.stroke;d.sw=String(S.sw);}d.dash=S.dash;d.rot='0';
  if(AUTO_TEXT.has(kind)){const t=h('div','rxw-obj-text');t.innerHTML='<br>';o.append(t);}return o;}
function renderObj(o){const k=o.dataset.kind;const w=o.offsetWidth||parseFloat(o.style.width)||1,hh=o.offsetHeight||parseFloat(o.style.height)||1;

  const rot=parseFloat(o.dataset.rot)||0,fl=o.dataset.flip||'';o.style.transform=(rot?`rotate(${rot}deg)`:'')+(fl.includes('h')?' scaleX(-1)':'')+(fl.includes('v')?' scaleY(-1)':'')||'';if(!o.style.transform.trim())o.style.removeProperty('transform');

function startShapeDraw(e,p){const k=S.tool;record('Forme : '+(SHAPE_NAMES[k]||k));const o=makeObj(k,p.x,p.y,1,1);ed.append(o);const pts=[[p.x,p.y]];let moved=false;
  drag(e,ev=>{const q=toEd(ev);moved=true;if(k==='freeline'){pts.push([q.x,q.y]);fitPts(o,pts);renderObj(o);return;}

function setLine(o,x1,y1,x2,y2){const L=Math.min(x1,x2),T=Math.min(y1,y2),W=Math.max(1,Math.abs(x2-x1)),HH=Math.max(1,Math.abs(y2-y1));o.style.left=L+'px';o.style.top=T+'px';o.style.width=W+'px';o.style.height=HH+'px';
  const d=o.dataset;d.x1=((x1-L)/W).toFixed(4);d.y1=((y1-T)/HH).toFixed(4);d.x2=((x2-L)/W).toFixed(4);d.y2=((y2-T)/HH).toFixed(4);renderObj(o);}

/* sélection */
function selectObj(o,add){endTextEdit();if(!add){S.selObjs=[];}if(o){const i=S.selObjs.indexOf(o);if(add&&i>=0)S.selObjs.splice(i,1);else if(i<0)S.selObjs.push(o);}if(S.selInline){S.selInline.classList.remove('rxw-imgsel');S.selInline=null;}drawOverlay();scheduleUI();}
function deselectObjs(){endTextEdit();S.selObjs=[];if(S.selInline){S.selInline.classList.remove('rxw-imgsel');S.selInline=null;}overlay.innerHTML='';}
function selectInline(el){deselectObjs();S.selInline=el;el.classList.add('rxw-imgsel');drawOverlay();}
function objBox(o){if(o.dataset.wrap==='inline'||!o.classList.contains('rxw-obj')){const pr=pagesEl.getBoundingClientRect(),r=o.getBoundingClientRect(),zf=zfac();const rot=parseFloat(o.dataset.rot)||0;return{L:(r.left-pr.left)/zf,T:(r.top-pr.top)/zf,W:rot?o.offsetWidth:r.width/zf,H:rot?o.offsetHeight:r.height/zf,rot:0};}
  return{L:edHost.offsetLeft+parseFloat(o.style.left),T:edHost.offsetTop+parseFloat(o.style.top),W:o.offsetWidth,H:o.offsetHeight,rot:parseFloat(o.dataset.rot)||0};}
function drawOverlay(){overlay.innerHTML='';S.selObjs=S.selObjs.filter(o=>o.isConnected);if(S.selInline&&!S.selInline.isConnected)S.selInline=null;const hs=Math.max(7,9/S.zoom);
  const hnd=(box,cls,x,y,cur,fn)=>{const e=h('div','rxw-h '+cls);e.style.cssText=`left:${x}px;top:${y}px;width:${hs}px;height:${hs}px;margin:${-hs/2}px 0 0 ${-hs/2}px;cursor:${cur}`;e.addEventListener('pointerdown',ev=>{ev.stopPropagation();fn(ev);});box.append(e);};
  for(const o of S.selObjs){const b=objBox(o);const box=h('div','rxw-sel');box.style.cssText=`left:${b.L}px;top:${b.T}px;width:${b.W}px;height:${b.H}px;${b.rot?`transform:rotate(${b.rot}deg)`:''};border-width:${1/S.zoom}px`;overlay.append(box);
    if(S.selObjs.length!==1||o.dataset.wrap==='inline'&&false)continue;
    if(OPEN_KINDS.has(o.dataset.kind)&&o.dataset.kind!=='ink'&&o.dataset.kind!=='freeline'){box.style.borderColor='transparent';const d=o.dataset;hnd(box,'',(+d.x1||0)*b.W,(+d.y1||0)*b.H,'move',ev=>dragEnd(ev,o,0));hnd(box,'',(d.x2==null?1:+d.x2)*b.W,(d.y2==null?1:+d.y2)*b.H,'move',ev=>dragEnd(ev,o,1));continue;}
    [['nw',0,0,'nwse-resize'],['n',.5,0,'ns-resize'],['ne',1,0,'nesw-resize'],['e',1,.5,'ew-resize'],['se',1,1,'nwse-resize'],['s',.5,1,'ns-resize'],['sw',0,1,'nesw-resize'],['w',0,.5,'ew-resize']].forEach(([dir,fx,fy,cur])=>hnd(box,'',fx*b.W,fy*b.H,cur,ev=>resizeObj(ev,o,dir)));
    if(o.dataset.wrap!=='inline'){const rt=h('div','rxw-rot',{title:'Faire pivoter (Maj : pas de 15°)'});rt.addEventListener('pointerdown',ev=>{ev.stopPropagation();rotateObj(ev,o);});box.append(rt);}}
  if(S.selInline){const el=S.selInline;const b=objBox(el);const box=h('div','rxw-sel');box.style.cssText=`left:${b.L}px;top:${b.T}px;width:${b.W}px;height:${b.H}px;border-width:${1/S.zoom}px`;overlay.append(box);
    [['nw',0,0,'nwse-resize'],['ne',1,0,'nesw-resize'],['se',1,1,'nwse-resize'],['sw',0,1,'nesw-resize']].forEach(([dir,fx,fy,cur])=>hnd(box,'',fx*b.W,fy*b.H,cur,ev=>resizeInline(ev,el,dir)));}}
function startMove(e){const objs=S.selObjs.filter(o=>o.dataset.wrap!=='inline');if(!objs.length)return;const p0=toEd(e);const orig=objs.map(o=>[o,parseFloat(o.style.left)||0,parseFloat(o.style.top)||0]);let rec=false;
  drag(e,ev=>{const q=toEd(ev);let dx=q.x-p0.x,dy=q.y-p0.y;if(!rec){if(Math.hypot(dx,dy)<2)return;record('Déplacer');rec=true;}if(ev.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;}for(const[o,L,T]of orig){o.style.left=L+dx+'px';o.style.top=Math.max(-meta.mt*CM,T+dy)+'px';}drawOverlay();},()=>{if(rec)changed();});}
function resizeObj(e,o,dir){record('Redimensionner');const p0=toEd(e);const L0=parseFloat(o.style.left)||0,T0=parseFloat(o.style.top)||0,W0=o.offsetWidth,H0=o.offsetHeight,rot=(parseFloat(o.dataset.rot)||0)*Math.PI/180;const inline=o.dataset.wrap==='inline';
  drag(e,ev=>{const q=toEd(ev);let dx=q.x-p0.x,dy=q.y-p0.y;const c=Math.cos(-rot),s=Math.sin(-rot);[dx,dy]=[dx*c-dy*s,dx*s+dy*c];let L=L0,T=T0,W=W0,HH=H0;
    if(dir.includes('e'))W=W0+dx;if(dir.includes('w')){W=W0-dx;L=L0+dx;}if(dir.includes('s'))HH=H0+dy;if(dir.includes('n')){HH=H0-dy;T=T0+dy;}
    if(ev.shiftKey||o.dataset.kind==='circle'||o.dataset.kind==='image'&&!ev.altKey){const r=W0/H0;if(dir==='n'||dir==='s')W=HH*r;else if(dir==='e'||dir==='w')HH=W/r;else{if(W/r>HH)HH=W/r;else W=HH*r;}if(dir.includes('w'))L=L0+W0-W;if(dir.includes('n'))T=T0+H0-HH;}
    W=Math.max(6,W);HH=Math.max(6,HH);if(!inline){o.style.left=L+'px';o.style.top=T+'px';}o.style.width=W+'px';o.style.height=HH+'px';renderObj(o);drawOverlay();},()=>changed());}
function rotateObj(e,o){record('Rotation');const b=objBox(o);const pr=pagesEl.getBoundingClientRect(),zf=zfac();const cx=pr.left+(b.L+b.W/2)*zf,cy=pr.top+(b.T+b.H/2)*zf;
  drag(e,ev=>{let a=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;if(ev.shiftKey)a=Math.round(a/15)*15;a=((Math.round(a)%360)+360)%360;o.dataset.rot=String(a);renderObj(o);drawOverlay();},()=>changed());}
function dragEnd(e,o,i){record('Modifier la ligne');const P=linePts(o);drag(e,ev=>{const q=toEd(ev);const other=P[1-i];let x=q.x,y=q.y;if(ev.shiftKey){const dx=x-other[0],dy=y-other[1],a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),L=Math.hypot(dx,dy);x=other[0]+Math.cos(a)*L;y=other[1]+Math.sin(a)*L;}P[i]=[x,y];setLine(o,P[0][0],P[0][1],P[1][0],P[1][1]);drawOverlay();},()=>changed());}
function resizeInline(e,el,dir){record('Redimensionner');const w0=el.getBoundingClientRect().width/zfac();const p0=toEd(e);const maxW=ed.offsetWidth;
  drag(e,ev=>{const q=toEd(ev);let dx=q.x-p0.x;if(dir.includes('w'))dx=-dx;const w=clamp(w0+dx,16,maxW);if(el.tagName==='FIGURE'){el.style.width=w+'px';const s=el.querySelector('svg');if(s){s.style.width='100%';s.style.height='auto';}}else{el.style.width=w+'px';el.style.height='auto';el.removeAttribute('width');el.removeAttribute('height');}drawOverlay();},()=>afterEdit());}

/* texte dans les formes */
function startTextEdit(o){if(OPEN_KINDS.has(o.dataset.kind)||o.dataset.kind==='image')return;endTextEdit();let t=o.querySelector('.rxw-obj-text');if(!t){t=h('div','rxw-obj-text');t.innerHTML='<br>';o.append(t);}
  t.contentEditable='true';S.editingObj=o;S.selObjs=[o];drawOverlay();t.focus();const r=document.createRange();r.selectNodeContents(t);if(!t.textContent)r.collapse(true);select(r);}
function endTextEdit(){const o=S.editingObj;if(!o)return;S.editingObj=null;const t=o.querySelector('.rxw-obj-text');if(t){t.removeAttribute('contenteditable');if(!t.textContent.trim()&&!AUTO_TEXT.has(o.dataset.kind)&&o.dataset.kind!=='wordart')t.remove();}changed();}
ed.addEventListener('pointerdown',e=>{const o=e.target.closest('.rxw-obj');
  if(o&&inEd(o)){if(S.editingObj===o&&e.target.closest('.rxw-obj-text'))return;e.preventDefault();ed.focus({preventScroll:true});if(S.editingObj)endTextEdit();if(!S.selObjs.includes(o)||e.shiftKey)selectObj(o,e.shiftKey);startMove(e);return;}
  const im=e.target.closest('img,figure.rxw-chart');if(im&&inEd(im)&&!im.closest('.rxw-obj')){selectInline(im);if(im.tagName==='FIGURE')e.preventDefault();return;}
  if(S.selObjs.length||S.selInline||S.editingObj)deselectObjs();
  if(S.ext&&e.button===0&&!e.shiftKey){const p=caretFromPoint(e.clientX,e.clientY);const s=getSelection();if(p&&S.extAnchor){e.preventDefault();s.setBaseAndExtent(S.extAnchor[0],S.extAnchor[1],p.startContainer,p.startOffset);}}
  if(e.ctrlKey||e.metaKey){const a=e.target.closest('a[href]');if(a){e.preventDefault();const href=a.getAttribute('href');if(href[0]==='#'){const t=ed.querySelector(href.replace(/[^#\w\-]/g,''));if(t)goToEl(t);}else window.open(href,'_blank','noopener');}}});
ed.addEventListener('dblclick',e=>{const o=e.target.closest('.rxw-obj');if(o&&inEd(o)){e.preventDefault();if(o.dataset.kind==='wordart'){wordArtDialog(o);return;}startTextEdit(o);return;}const f=e.target.closest('figure.rxw-chart');if(f){chartDialog(f);}});
ed.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(a&&!a.title)a.title=a.getAttribute('href')+' — Ctrl+clic pour suivre le lien';});
function removeSelected(){if(S.selInline){record('Supprimer l’objet');S.selInline.remove();S.selInline=null;overlay.innerHTML='';afterEdit();return true;}if(!S.selObjs.length)return false;record(S.selObjs.length>1?'Supprimer les objets':'Supprimer l’objet');S.selObjs.forEach(o=>o.remove());S.selObjs=[];overlay.innerHTML='';afterEdit();return true;}
function nudge(dx,dy){if(!S.selObjs.length)return;if(H.kind!=='nudge'){record('Déplacer');H.kind='nudge';}S.selObjs.forEach(o=>{if(o.dataset.wrap==='inline')return;o.style.left=(parseFloat(o.style.left)||0)+dx+'px';o.style.top=(parseFloat(o.style.top)||0)+dy+'px';});drawOverlay();changed();}
function duplicateSel(){if(!S.selObjs.length)return;record('Dupliquer');const n=S.selObjs.map(o=>{const c=o.cloneNode(true);if(c.dataset.wrap!=='inline'){c.style.left=(parseFloat(o.style.left)||0)+14+'px';c.style.top=(parseFloat(o.style.top)||0)+14+'px';ed.append(c);}else o.after(c);renderObj(c);return c;});S.selObjs=n;drawOverlay();changed();}
function styleObjs(label,props){const objs=S.selObjs.filter(o=>o.dataset.kind!=='image'&&o.dataset.kind!=='wordart'||props.shadow!=null);
  if(!objs.length){if(props.fill&&props.fill!=='none')S.fill=props.fill;if(props.stroke&&props.stroke!=='none')S.stroke=props.stroke;if(props.sw)S.sw=+props.sw;if(props.dash)S.dash=props.dash;toast('Aucune forme sélectionnée : ce réglage s’appliquera aux prochaines formes tracées.');return;}
  record(label);for(const o of objs){for(const k in props){if(k==='arrow'&&!OPEN_KINDS.has(o.dataset.kind))continue;if(k==='fill'&&OPEN_KINDS.has(o.dataset.kind))continue;o.dataset[k]=props[k];}if(o.dataset.kind==='wordart'&&props.shadow!=null){const t=o.querySelector('.rxw-obj-text');if(t)t.style.filter=props.shadow==='none'?'':props.shadow==='soft'?'drop-shadow(0 4px 6px rgba(0,0,0,.35))':props.shadow==='3d'?'drop-shadow(2px 2px 0 #5d6f88) drop-shadow(2px 2px 0 #5d6f88)':'drop-shadow(3px 3px 2px rgba(0,0,0,.4))';}renderObj(o);}
  if(props.arrow&&!objs.some(o=>OPEN_KINDS.has(o.dataset.kind)))toast('Les pointes de flèche s’appliquent aux lignes : sélectionnez une ligne ou une flèche.');changed();drawOverlay();}
function arrangeSel(kind){const objs=S.selObjs;if(!objs.length&&!S.selInline)return toast('Sélectionnez d’abord un objet dessiné (clic sur la forme).');record({front:'Premier plan',back:'Arrière-plan',fwd:'Avancer',bwd:'Reculer',rotr:'Rotation à droite',rotl:'Rotation à gauche',fliph:'Retourner horizontalement',flipv:'Retourner verticalement',alignL:'Aligner à gauche',alignC:'Centrer',alignR:'Aligner à droite'}[kind]||'Organiser');
  const cw=ed.offsetWidth;for(const o of objs){switch(kind){
    case'front':ed.append(o);break;case'back':ed.insertBefore(o,ed.firstChild);break;
    case'fwd':{let n=o.nextElementSibling;while(n&&!n.classList.contains('rxw-obj'))n=n.nextElementSibling;if(n)n.after(o);break;}
    case'bwd':{let p=o.previousElementSibling;while(p&&!p.classList.contains('rxw-obj'))p=p.previousElementSibling;if(p)p.before(o);break;}
    case'rotr':o.dataset.rot=String(((parseFloat(o.dataset.rot)||0)+90)%360);break;case'rotl':o.dataset.rot=String(((parseFloat(o.dataset.rot)||0)+270)%360);break;
    case'fliph':o.dataset.flip=(o.dataset.flip||'').includes('h')?(o.dataset.flip||'').replace('h',''):(o.dataset.flip||'')+'h';break;case'flipv':o.dataset.flip=(o.dataset.flip||'').includes('v')?(o.dataset.flip||'').replace('v',''):(o.dataset.flip||'')+'v';break;
    case'alignL':o.style.left='0px';break;case'alignC':o.style.left=(cw-o.offsetWidth)/2+'px';break;case'alignR':o.style.left=cw-o.offsetWidth+'px';break;}renderObj(o);}
  changed();drawOverlay();}
function setWrap(mode){const objs=[...S.selObjs];if(S.selInline&&S.selInline.tagName==='IMG'&&mode!=='inline'){objs.push(imgToFloat(S.selInline,true));}if(!objs.length)return toast('Sélectionnez d’abord un objet ou une image.');record('Habillage');
  for(const o of objs){const cur=o.dataset.wrap||'front';if(mode==='inline'&&cur!=='inline'){const top=parseFloat(o.style.top)||0;const blocks=[...ed.children].filter(n=>!n.classList.contains('rxw-obj'));const b=blocks.find(x=>x.offsetTop+x.offsetHeight>top)||blocks[blocks.length-1];const tgt=b&&(b.tagName==='UL'||b.tagName==='OL'||b.tagName==='TABLE')?null:b;o.dataset.wrap='inline';if(tgt)tgt.prepend(o);else{const p=h('p');p.append(o);ed.append(p);}}
    else if(mode!=='inline'&&cur==='inline'){const pr=objBox(o);o.dataset.wrap=mode;o.style.left=pr.L-edHost.offsetLeft+'px';o.style.top=pr.T-edHost.offsetTop+'px';ed.append(o);}
    else o.dataset.wrap=mode;if(mode==='front')o.removeAttribute('data-wrap');renderObj(o);}
  S.selObjs=objs.filter(o=>o.isConnected);S.selInline=null;afterEdit();drawOverlay();}
function imgToFloat(img){const r=img.getBoundingClientRect(),er=ed.getBoundingClientRect(),zf=zfac();const o=makeObj('image',(r.left-er.left)/zf,(r.top-er.top)/zf,r.width/zf,r.height/zf);delete o.dataset.fill;delete o.dataset.stroke;const im=h('img','',{src:img.getAttribute('src'),alt:img.alt||'',style:'width:100%;height:100%;display:block;pointer-events:none'});o.append(im);img.remove();ed.append(o);renderObj(o);return o;}
function objInsertPoint(){const cr=rng()?caretRect(rng()):null;const er=ed.getBoundingClientRect(),zf=zfac();if(cr&&cr.height)return{x:Math.max(0,(cr.left-er.left)/zf),y:(cr.bottom-er.top)/zf+6};const sr=scroll.getBoundingClientRect();return{x:40,y:Math.max(0,(sr.top+sr.height/3-er.top)/zf)};}

/* images en ligne */
function pickImage(){imgInput.value='';imgInput.click();}
imgInput.onchange=async()=>{const f=imgInput.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Ce fichier n’est pas une image.','err');const url=await readFileAs(f,'url');insertImage(url,f.name);};
function insertImage(url,alt){const im=new Image();im.onload=()=>{run('Insérer une image',()=>{const w=Math.min(im.naturalWidth||300,ed.offsetWidth);const el=h('img','',{src:url,alt:alt||'Image',style:`width:${Math.round(w)}px`});insertInlineNode(el);});};im.onerror=()=>toast('Image illisible.','err');im.src=url;}
function insertInlineNode(node){const r=rng();if(!r){ed.append(node);return;}r.deleteContents();r.insertNode(node);const nr=document.createRange();nr.setStartAfter(node);nr.collapse(true);select(nr);}
function insertBlockNode(node,after){const r=rng();let b=r?blockOf(r.startContainer):null;while(b&&b.parentElement!==ed&&b.parentElement)b=b.parentElement.closest('ul,ol,table,blockquote,.rxw-cols')||b.parentElement;if(b&&b.parentElement!==ed)b=null;
  if(b&&!b.textContent.replace(/[\s\u200B]/g,'')&&!b.querySelector('img,.rxw-obj')&&b.tagName==='P')b.replaceWith(node);else if(b)b.after(node);else ed.append(node);
  let nx=node.nextElementSibling;while(nx&&nx.classList.contains('rxw-obj'))nx=nx.nextElementSibling;if(!nx||after){const p=h('p');p.innerHTML='<br>';node.after(p);nx=p;}const nr=document.createRange();nr.selectNodeContents(nx);nr.collapse(true);select(nr);return node;}
function insertClipart(i){run('Image clipart : '+CLIPART[i][0],()=>{const el=h('img','',{src:clipartURI(i),alt:CLIPART[i][0],style:'width:96px'});insertInlineNode(el);});}
ed.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
ed.addEventListener('drop',async e=>{const fs=[...(e.dataTransfer&&e.dataTransfer.files)||[]];if(!fs.length)return;e.preventDefault();const p=caretFromPoint(e.clientX,e.clientY);if(p)select(p);
  for(const f of fs){if(/^image\//.test(f.type))insertImage(await readFileAs(f,'url'),f.name);else if(/\.(docx|txt|html?|md)$/i.test(f.name))openFile(f);}});

/* ---------- Boîtes de dialogue ---------- */
function dlg(title,content,buttons,o={}){const m=h('div','rxw-modal');const d=h('div','rxw-dlg',{role:'dialog','aria-modal':'true','aria-label':title});if(o.width)d.style.width=o.width+'px';
  const hd=h('div','rxw-dlg-h');hd.append(h('span','',{text:title}));const x=h('button','',{type:'button',title:'Fermer (Échap)','aria-label':'Fermer'});x.innerHTML=I.x;hd.append(x);
  const bd=h('div','rxw-dlg-b');if(typeof content==='string')bd.innerHTML=content;else if(content)bd.append(content);const ft=h('div','rxw-dlg-f');d.append(hd,bd);if(buttons&&buttons.length)d.append(ft);
  const close=()=>{m.remove();document.removeEventListener('keydown',kd,true);o.onClose&&o.onClose();};
  const fire=async b=>{let r;try{r=b.a?await b.a(bd):true;}catch(e){console.error(e);toast(e.message||String(e),'err');r=false;}if(r!==false){close();if(!b.keepSel)restoreSel();}};
  const kd=e=>{if(!m.isConnected)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();restoreSel();}else if(e.key==='Enter'&&!e.target.matches('textarea,button,select')){const p=(buttons||[]).find(b=>b.primary);if(p){e.preventDefault();e.stopPropagation();fire(p);}}};
  for(const b of buttons||[]){const bt=h('button','rxw-btn'+(b.primary?' rxw-primary':''),{type:'button',text:b.t});bt.onclick=()=>fire(b);ft.append(bt);}
  x.onclick=()=>{close();restoreSel();};document.addEventListener('keydown',kd,true);m.append(d);root.append(m);
  setTimeout(()=>{const f=bd.querySelector('[data-focus]')||bd.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea');if(f){f.focus();f.select&&f.select();}},0);return{close,body:bd};}
function form(rows){const f=h('div','rxw-form');for(const[l,el]of rows){if(l===null){el.classList&&el.classList.add('rxw-full');f.append(el);continue;}const lb=h('label','',{text:l});f.append(lb,el);}return f;}
const inp=(v,a={})=>h('input','rxw-in',Object.assign({value:v==null?'':v},a));
const sel=(opts,v)=>{const s=h('select');opts.forEach(o=>{const[val,t]=Array.isArray(o)?o:[o,o];const op=h('option','',{value:val,text:t});if(String(val)===String(v))op.selected=true;s.append(op);});return s;};
const chk=(label,on)=>{const l=h('label','rxw-chk');const c=h('input','',{type:'checkbox'});c.checked=!!on;l.append(c,label);l.box=c;return l;};
function confirmDlg(title,text,okLabel,fn){dlg(title,h('div','',{text,style:'max-width:420px'}),[{t:'Annuler'},{t:okLabel,primary:true,a:()=>{fn();}}]);}

async function renderPageCanvas(i,scale){const pw=pageW(),ph=pageH(),SD=stride();const holder=h('div');holder.setAttribute('style',`position:absolute;left:0;top:0;width:${pw}px;height:${ph}px;background:#fff`);

async function pdfBlob(){const L=window.PDFLib;if(!L)throw new Error('Le moteur PDF (pdf-lib) est indisponible.');const doc=await L.PDFDocument.create();doc.setTitle(meta.props.title||baseName(host.getName()));doc.setAuthor(meta.props.author||S.author);doc.setCreator('Readix Document Studio');doc.setProducer('Readix Word Engine');

    if(font)for(const ln of lines){if(ln.page!==i)continue;const size=Math.max(1,ln.size*.75);const f=ln.bold?fontB:font;let str=ln.text.replace(/[^\x00-\xFF]/g,'?');
      try{page.drawText(str,{x:ln.x*.75,y:HH-(ln.baseline)*.75,size,font:f,color:L.rgb(0,0,0),opacity:0});}catch(_){}}}}
  catch(e){console.warn('Rendu fidèle impossible, PDF texte',e);return textPdf();}

function collectTextLines(){const out=[],er=ed.getBoundingClientRect(),zf=zfac(),SD=stride();
  const blocks=ed.querySelectorAll('p,h1,h2,h3,h4,li,blockquote,pre,td,th,.rxw-caption,.rxw-toc-e,.rxw-toc-h,.rxw-idx-e,.rxw-fn,.rxw-obj-text');
  for(const b of blocks){if(b.querySelector('p,li,h1,h2,h3,td'))continue;const cs=getComputedStyle(b);const bold=parseInt(cs.fontWeight)>=600,size=parseFloat(cs.fontSize)||12;
    const lines=new Map();const tw=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);let t;
    while((t=tw.nextNode())){const pe=t.parentElement;if(pe.closest('.rxw-obj')&&!pe.closest('.rxw-obj-text'))continue;const v=t.nodeValue;if(!v.replace(/[\s\u200B]/g,''))continue;
      let i=0;const rr=document.createRange();while(i<v.length){let j=v.indexOf(' ',i);if(j<0)j=v.length;if(j===i){i++;continue;}rr.setStart(t,i);rr.setEnd(t,Math.min(j+1,v.length));const rc=rr.getBoundingClientRect();if(rc.width){const page=Math.floor(((rc.top-er.top)/zf+.5)/SD);const ly=Math.round((rc.top-er.top)/zf);const key=page+':'+ly;let e=lines.get(key);if(!e){e={page,x:(rc.left-er.left)/zf,baseline:(rc.bottom-er.top)/zf-Math.max(1,rc.height*.2)-page*SD,size,bold,text:''};lines.set(key,e);}e.text+=v.slice(i,j)+' ';}i=j+1;}}

async function textPdf(){const L=window.PDFLib;const doc=await L.PDFDocument.create();const F=await doc.embedFont(L.StandardFonts.TimesRoman),FB=await doc.embedFont(L.StandardFonts.TimesRomanBold);const W=pageW()*.75,HH=pageH()*.75,ml=meta.ml*CM*.75,mt=meta.mt*CM*.75,mb=meta.mb*CM*.75,cw=W-ml-meta.mr*CM*.75;
  let page=doc.addPage([W,HH]),y=HH-mt;const safe=s=>s.replace(/[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2018\u2019\u201C\u201D\u2026\u20AC]/g,'?');
  for(const b of ed.querySelectorAll('p,h1,h2,h3,li,blockquote,pre,td,th')){if(b.querySelector('p,li'))continue;const hd=/^H/.test(b.tagName);const size=hd?({H1:20,H2:16,H3:13}[b.tagName]):11.5;const f=hd?FB:F;const words=safe(b.textContent.replace(/\u200B/g,'')).split(/\s+/);let line='';const lines=[];for(const w of words){const t=line?line+' '+w:w;if(f.widthOfTextAtSize(t,size)>cw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);

  return new Blob([await doc.save()],{type:'application/pdf'});}

function plainText(){const out=[];for(const b of ed.querySelectorAll('p,h1,h2,h3,li,blockquote,pre,tr,.rxw-pagebreak')){if(b.closest('.rxw-obj'))continue;if(b.tagName==='TR'){out.push([...b.cells].map(c=>c.textContent.trim()).join('\t'));continue;}if(b.closest('td,th'))continue;if(b.classList.contains('rxw-pagebreak')){out.push('\f');continue;}if(b.querySelector('p,li'))continue;out.push((b.tagName==='LI'?'• ':'')+b.textContent.replace(/\u200B/g,''));}return out.join('\r\n');}

async function cmdPaste(plain){closePops();restoreSel();try{if(!plain&&navigator.clipboard&&navigator.clipboard.read){const items=await navigator.clipboard.read();for(const it of items){const im=it.types.find(t=>t.startsWith('image/'));if(im){const b=await it.getType(im);insertImage(await readFileAs(b,'url'),'Image collée');return;}
      if(it.types.includes('text/html')){pasteHTML(await (await it.getType('text/html')).text());return;}if(it.types.includes('text/plain')){pasteText(await (await it.getType('text/plain')).text());return;}}}
    const t=await navigator.clipboard.readText();if(!t)return toast('Le presse-papiers est vide.');pasteText(t);}catch(e){toast('Le navigateur bloque l’accès direct au presse-papiers : utilisez Ctrl+V (ou Ctrl+Maj+V pour le texte seul).','err');}}

function pasteText(t){run('Coller le texte',()=>{if(S.rev){trackInsert(t);return;}const lines=String(t).replace(/\r/g,'').split('\n');if(lines.length===1)document.execCommand('insertText',false,t);else document.execCommand('insertHTML',false,lines.map(l=>'<p>'+(esc(l)||'<br>')+'</p>').join(''));});}

  if(inShape){record('Coller');document.execCommand('insertText',false,text);return;}if(S.pastePlain||!html){S.pastePlain=false;pasteText(text);}else pasteHTML(html);});

  S.painterSticky=!!sticky;root.classList.add('rxw-painting');toast(sticky?'Pinceau continu : sélectionnez chaque texte à mettre en forme. Échap pour arrêter.':'Pinceau : sélectionnez (ou cliquez) le texte qui doit recevoir cette mise en forme.');scheduleUI();}

function tokenize(html){const d=h('div');d.innerHTML=html;const out=[];const walk=n=>{for(const c of n.childNodes){if(c.nodeType===3){(c.nodeValue.match(/\s+|[^\s]+/g)||[]).forEach(t=>out.push(t));}else if(c.nodeType===1){if(/^(P|H1|H2|H3|H4|LI|BLOCKQUOTE|PRE|TR|DIV|BR|TABLE)$/.test(c.tagName))out.push('\n');walk(c);if(/^(P|H1|H2|H3|H4|LI|BLOCKQUOTE|PRE|TR|DIV|TABLE)$/.test(c.tagName))out.push('\n');}}};walk(d);return out;}
function diffTokens(a,b){const n=a.length,m=b.length;const max=1500;if(n>max||m>max)return simpleDiff(a,b);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push(['=',b[j]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['-',a[i]]);i++;}else{out.push(['+',b[j]]);j++;}}while(i<n)out.push(['-',a[i++]]);while(j<m)out.push(['+',b[j++]]);return out;}
function simpleDiff(a,b){return [['-',a.join('')],['+',b.join('')]];}
function renderDiff(diff){let html='',ins='',del='';const flush=()=>{if(del){html+='<del class="rxw-del" data-author="Comparaison">'+esc(del)+'</del>';del='';}if(ins){html+='<ins class="rxw-ins" data-author="Comparaison">'+esc(ins)+'</ins>';ins='';}};
  for(const[op,tok]of diff){const t=tok==='\n'?'\n':tok;if(op==='='){flush();html+=esc(t);}else if(op==='-')del+=t;else ins+=t;}flush();
  return html.split('\n').map(l=>'<p>'+(l||'<br>')+'</p>').join('').replace(/<p><\/p>/g,'<p><br></p>');}

    d.close();const add=[...document.querySelectorAll('.rxw-editor ins.rxw-ins')].length,rem=[...document.querySelectorAll('.rxw-editor del.rxw-del')].length;toast('Comparaison terminée : '+add+' ajout(s), '+rem+' suppression(s). Utilisez Révision pour accepter ou refuser.');}catch(e){toast('Comparaison impossible : '+(e.message||e),'err');}};fi.click();};

function applyFont(f){f=String(f||'').trim();if(!f)return;run('Police : '+f,()=>applyInline({fontFamily:`'${f.replace(/'/g,'')}'`}));}
function applySize(v){const n=parseNum(v);if(!isFinite(n)||n<1||n>1638){toast('Taille invalide : saisissez un nombre entre 1 et 1638.','err');updateUI();return;}run('Taille : '+fmtNum(n,1),()=>applyInline({fontSize:n+'pt'}));}
function fontList(){const box=h('div');const cur=fontInput.value;FONTS.forEach(f=>{const b=h('button','rxw-mi'+(f===cur?' rxw-checked':''),{type:'button'});b.innerHTML=`<span class="rxw-mi-ic"></span><span class="rxw-mi-tx" style="font-family:'${f}';font-size:15px">${f}</span>`;b.onclick=()=>{closePops();fontInput.value=f;applyFont(f);};box.append(b);});popup(fontCombo,box,{width:260});pops[pops.length-1].anchor=fontCombo;}
function sizeList(){const box=h('div');const cur=parseNum(sizeInput.value);SIZES.forEach(s=>{const b=h('button','rxw-mi'+(s===cur?' rxw-checked':''),{type:'button'});b.innerHTML=`<span class="rxw-mi-ic"></span><span class="rxw-mi-tx">${fmtNum(s,1)}</span>`;b.onclick=()=>{closePops();sizeInput.value=fmtNum(s,1);applySize(s);};box.append(b);});popup(sizeCombo,box,{width:110});pops[pops.length-1].anchor=sizeCombo;}

fontInput.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();const v=FONTS.find(f=>f.toLowerCase()===fontInput.value.trim().toLowerCase())||fontInput.value.trim();fontInput.value=v;applyFont(v);}if(e.key==='Escape'){updateUI();restoreSel();}if(e.key==='ArrowDown'&&!pops.length)fontList();});

/* ---------- Saisie ---------- */
ed.addEventListener('beforeinput',e=>{if(S.busy)return;const t=e.inputType;
  if(t==='historyUndo'){e.preventDefault();undo(1);return;}if(t==='historyRedo'){e.preventDefault();redo(1);return;}
  if(S.reading){e.preventDefault();return;}
  if(S.selObjs.length&&!S.editingObj&&/^(insert|delete)/.test(t)){e.preventDefault();if(/^delete/.test(t))removeSelected();return;}
  if(/^format/.test(t)){record('Mise en forme');return;}
  typingRecord(/^delete/.test(t)?'del':'ins');moveOutOfTab();
  const inShape=!!closestEl(getSelection().anchorNode,'.rxw-obj-text');
  if((t==='insertText'||t==='insertReplacementText')&&e.data!=null&&!inShape){const ac=t==='insertText'?autocorrect(e.data):{data:e.data};if(ac.data!==e.data||ac.del||S.rev||S.overwrite){e.preventDefault();customInsert(ac.data,ac.del);}return;}
  if(S.rev&&!inShape&&/^delete/.test(t)&&t!=='deleteByCut'&&t!=='deleteByDrag'){e.preventDefault();trackDelete(t);return;}});

/* ---------- Clavier ---------- */
function onKey(e){if(S.destroyed)return;if(root.querySelector('.rxw-modal'))return;
  if(pops.length&&menuKey(e)){e.preventDefault();e.stopPropagation();return;}
  const k=e.key,lk=k.length===1?k.toLowerCase():k,mod=e.ctrlKey||e.metaKey,sh=e.shiftKey,alt=e.altKey,tgt=e.target;
  const field=tgt.matches&&tgt.matches('input,textarea,select'),hf=tgt.classList&&tgt.classList.contains('rxw-hf');
  const stop=()=>{e.preventDefault();e.stopPropagation();};const A=fn=>{stop();fn();};
  if(k==='Escape'){if(pops.length){closePops();return stop();}if(hf){tgt.blur();restoreSel();return stop();}if(findBox.classList.contains('rxw-show')){closeFind();return stop();}if(S.painter){stopPainter();return stop();}if(S.tool){setTool(null);return stop();}
    if(S.editingObj){const o=S.editingObj;endTextEdit();selectObj(o);return stop();}if(S.selObjs.length||S.selInline){deselectObjs();restoreSel();return stop();}if(S.ext){setExt(false);return stop();}if(S.reading){setReading(false);return stop();}if(root.classList.contains('rxw-maximized')){setMaximized(false);return stop();}return;}
  if(field||hf){if(mod&&!alt&&(lk==='s'||lk==='p'||lk==='o')){stop();lk==='s'?cmdSave(sh):lk==='p'?cmdPrint():cmdOpen();}else if(mod)e.stopPropagation();return;}
  if((S.selObjs.length||S.selInline)&&!S.editingObj){
    if(k==='Delete'||k==='Backspace')return A(removeSelected);
    const st=sh?10:1;if(S.selObjs.length&&/^Arrow/.test(k))return A(()=>nudge(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,k==='ArrowUp'?-st:k==='ArrowDown'?st:0));
    if(mod&&lk==='d'&&S.selObjs.length)return A(duplicateSel);
    if(mod&&(lk==='c'||lk==='x')&&S.selObjs.length){S.objClip=S.selObjs.map(o=>o.outerHTML);if(lk==='x')removeSelected();else toast('Objet copié : Ctrl+V pour le coller.');return stop();}
    if(k==='Enter'&&S.selObjs.length===1)return A(()=>S.selObjs[0].dataset.kind==='wordart'?wordArtDialog(S.selObjs[0]):startTextEdit(S.selObjs[0]));}
  if(mod&&!sh&&lk==='v'&&S.objClip&&S.objClip.length&&!S.editingObj)return A(()=>{record('Coller l’objet');const n=S.objClip.map(x=>{const d=h('div');d.innerHTML=x;const o=d.firstChild;o.style.left=(parseFloat(o.style.left)||0)+14+'px';o.style.top=(parseFloat(o.style.top)||0)+14+'px';ed.append(o);renderObj(o);return o;});S.objClip=n.map(o=>o.outerHTML);S.selObjs=n;drawOverlay();changed();});
  if(mod&&sh&&lk==='v'){S.pastePlain=true;e.stopPropagation();return;}
  if(!mod&&!alt){if(k==='F1')return A(helpDialog);if(k==='F7')return A(toggleSpell);if(k==='F8')return A(()=>setExt(!S.ext));if(k==='Insert')return A(()=>setOverwrite(!S.overwrite));
    if(k==='Tab'&&inEd(tgt)&&!S.editingObj)return A(()=>handleTab(sh));
    if(k==='Enter'&&!sh&&inEd(tgt)&&!S.editingObj){const r=rng();if(r&&r.collapsed){const bl=blockOf(r.startContainer);
      if(bl&&/^(H1|H2|H3)$/.test(bl.tagName)||bl&&(bl.classList.contains('rxw-s-title')||bl.classList.contains('rxw-s-subtitle'))){const atEnd=offsetOf(r.endContainer,r.endOffset)===offsetOf(bl,bl.childNodes.length);
        if(atEnd&&bl.textContent.replace(/[\s\u200B]/g,'')){A(()=>{record('Nouveau paragraphe');const np=h('p');np.innerHTML='<br>';bl.after(np);const nr=document.createRange();nr.selectNodeContents(np);nr.collapse(true);select(nr);afterEdit();});return;}}}}
    if(S.ext&&inEd(tgt)){const m={ArrowLeft:['backward','character'],ArrowRight:['forward','character'],ArrowUp:['backward','line'],ArrowDown:['forward','line'],Home:['backward','lineboundary'],End:['forward','lineboundary'],PageUp:['backward','paragraph'],PageDown:['forward','paragraph']}[k];if(m)return A(()=>getSelection().modify('extend',m[0],m[1]));}
    return;}
  if(!mod)return;
  if(alt&&!sh){if(lk==='n')return A(cmdNew);if(lk==='m')return A(commentDialog);if(lk==='f')return A(()=>footnoteDialog(false));if(lk==='b')return A(()=>footnoteDialog(true));const hk={'1':'h1','&':'h1','2':'h2','é':'h2','3':'h3','"':'h3'}[k];if(hk)return A(()=>run('Style '+hk.toUpperCase(),()=>applyStyle(hk)));return;}
  switch(lk){
    case 's':return A(()=>cmdSave(sh));case 'o':return A(cmdOpen);case 'p':return A(cmdPrint);
    case 'z':return A(()=>sh?redo(1):undo(1));case 'y':return A(()=>redo(1));
    case 'b':return A(()=>run('Gras',()=>execInline('bold')));case 'i':return A(()=>run('Italique',()=>execInline('italic')));case 'u':return A(()=>run('Souligné',()=>execInline('underline')));

    case 'e':return sh?A(()=>setRev(!S.rev)):A(()=>run('Centrer',()=>setAlign('center')));

function mdToHtml(md){const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>');

  for(const raw of md.replace(/\r/g,'').split('\n')){const l=raw.trimEnd();let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){close();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;}
    else if((m=l.match(/^\s*[-*+]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul';}out+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol';}out+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^>\s?(.*)/))){close();out+='<blockquote>'+inl(m[1])+'</blockquote>';}
    else if(/^(-{3,}|\*{3,})$/.test(l)){close();out+='<hr>';}
    else if(!l.trim()){close();}else{close();out+='<p>'+inl(l)+'</p>';}}

async function closeTab(id){

async function autosave(){

async function saveBytes(bytes,suggestedName){
  try{
    if(window.showSaveFilePicker){
      const h=await window.showSaveFilePicker({suggestedName,types:[{description:"PDF",accept:{"application/pdf":[".pdf"]}}]});
      const w=await h.createWritable();await w.write(bytes);await w.close();return true;
    }
  }catch(e){if(e&&e.name==="AbortError")return false;}
  const name=(prompt("Nom du fichier :",suggestedName)||suggestedName);
  const blob=new Blob([bytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name.endsWith(".pdf")?name:name+".pdf";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
async function doSave(){
  const t=activeTab();if(!t||!t.bytes){toast("Aucun document à enregistrer.","warn");return;}
  if(t.tool==="editpdf"){return doSaveEdit(t);}
  if(t.tool==="docstudio"){return saveDocStudio(t,"docx");}
  let out=u8(t.bytes);
  try{ if(t.tool==="fillsign") out=await fillsignExport(t); }catch(e){}
  const ok=await saveBytes(out,(t.name||"document").replace(/\.pdf$/i,"")+"-readix.pdf");
  if(ok){t.dirty=false;updateSaveDot();toast("Document enregistré.","ok");}
}
/* ---------- rendu net (haute résolution) ---------- */
async function renderPageTo(page,scale,container,cls){
  const dpr=Math.max(2,window.devicePixelRatio||1);
  const vp=page.getViewport({scale});
  const wrap=el("div",cls||"page");wrap.style.width=vp.width+"px";wrap.style.height=vp.height+"px";wrap.dataset.page=page.pageNumber;
  const cv=el("canvas");cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);cv.style.width=vp.width+"px";cv.style.height=vp.height+"px";
  const ctx=cv.getContext("2d",{alpha:false});ctx.scale(dpr,dpr);
  wrap.appendChild(cv);container.appendChild(wrap);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return {wrap,vp};
}

/* ---------- ouvrir un PDF dans l'onglet actif ---------- */
async function openPdfBytes(bytes,name){
  let t=activeTab();
  if(!t){t=createTab(name);} 
  t.bytes=u8(bytes);t.name=name||t.name;
  try{ t.pdf=await pdfjsLib.getDocument({data:u8(bytes).slice(0)}).promise; }catch(e){toast("PDF illisible.","err");return;}

  renderTabs();renderTools();renderView();updateHeader();updateNavBtns();
  scheduleAutosave();
}

async function saveDocStudio(t,format,forceAs=false){

function docFindNext(backward){const bar=document.querySelector('.doc-findbar'),ed=document.querySelector('.doceditor');if(!bar||!ed)return;const q=(bar.querySelector('[data-find]').value||'').trim();if(!q){toast('Entrez un texte à rechercher.','err');return;}ed.focus();const sel=getSelection();const range=document.createRange();const walker=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);const full=nodes.map(x=>x.nodeValue).join('');let pos=0;const map=[];for(const node of nodes){map.push({node,start:pos,end:pos+node.nodeValue.length});pos+=node.nodeValue.length;}const current=sel&&sel.rangeCount?sel.getRangeAt(0).endOffset:0;let idx=backward?full.lastIndexOf(q,Math.max(0,current-q.length-1)):full.indexOf(q,current);if(idx<0)idx=backward?full.lastIndexOf(q):full.indexOf(q);if(idx<0){toast('Aucun résultat trouvé.','err');return;}const start=map.find(m=>idx>=m.start&&idx<m.end),end=map.find(m=>idx+q.length>m.start&&idx+q.length<=m.end);if(!start||!end)return;range.setStart(start.node,idx-start.start);range.setEnd(end.node,idx+q.length-end.start);sel.removeAllRanges();sel.addRange(range);const el=start.node.parentElement;el?.scrollIntoView({block:'center',behavior:'smooth'});}

function escapePrintHTML(v){return String(v??'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<iframe[\s\S]*?<\/iframe>/gi,'');}
function printDocStudio(t){
  const ed=document.querySelector('.doceditor');
  if(ed)t.doc=ed.innerHTML;
  const w=window.open('','_blank','noopener,noreferrer,width=1100,height=850');

  w.document.open();
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title.replace(/[&<>]/g,'')}</title>
  <style>

    .print-header{margin-bottom:12px}.print-footer{position:absolute;left:${margin}px;right:${margin}px;bottom:${Math.max(35,margin/2)}px}
    .print-body{font-size:12pt;line-height:1.45;min-height:100%}
    .print-body p{margin:0 0 8px}.print-body h1{font-size:24pt}.print-body h2{font-size:18pt}.print-body h3{font-size:14pt}
    .print-body img{max-width:100%;height:auto}.print-body table{width:100%;border-collapse:collapse;margin:10px 0;break-inside:avoid}.print-body td,.print-body th{border:1px solid #888;padding:6px;vertical-align:top}
    .print-body .doc-page-break{break-after:page;page-break-after:always;height:0;margin:0;border:0}

  </body></html>`);
  w.document.close();
  return true;
}
async function printPdfDocument(t){
  const w=window.open('','_blank','noopener,noreferrer,width=1100,height=850');
  if(!w){toast('Le navigateur a bloqué la fenêtre d’impression. Autorisez les fenêtres contextuelles pour Readix.','err');return false;}
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Document PDF</title><style>@page{margin:0}html,body{margin:0;padding:0;background:#fff}.pdf-print-page{width:100%;break-after:page;page-break-after:always;display:flex;justify-content:center;align-items:flex-start}.pdf-print-page:last-child{break-after:auto;page-break-after:auto}.pdf-print-page canvas{display:block;width:100%;height:auto}</style></head><body><div id="pages"></div></body></html>');
  w.document.close();
  try{
    if(!window.pdfjsLib)throw new Error('Moteur PDF indisponible.');
    const pdf=await pdfjsLib.getDocument({data:u8(t.bytes).slice(0)}).promise;
    const host=w.document.getElementById('pages');
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);const viewport=page.getViewport({scale:1.6});
      const wrap=w.document.createElement('section');wrap.className='pdf-print-page';
      const canvas=w.document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);wrap.appendChild(canvas);host.appendChild(wrap);
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
    }
    setTimeout(()=>w.print(),250);w.addEventListener('afterprint',()=>setTimeout(()=>w.close(),250));return true;
  }catch(e){try{w.close();}catch(_){}toast('Impossible de préparer le PDF pour l’impression : '+(e?.message||e),'err');return false;}
}
function printActiveReadixDocument(){
  const t=activeTab();
  if(!t){toast('Aucun document ouvert à imprimer.','err');return;}
  if(t.tool==='docstudio'){if(window.ReadixWordEngine&&ReadixWordEngine.active&&ReadixWordEngine.active.isFor(t)){ReadixWordEngine.active.print();return;}printDocStudio(t);return;}
  if(t.pdf&&t.bytes){printPdfDocument(t);return;}
  toast('Ce document ne possède pas encore de moteur d’impression dédié.','err');
}

function renderDocStudio(t,stage){
  /* Phase A.3 — Readix Word Engine A3 : interface fidèle à la maquette, 115 outils fonctionnels */
  stage.innerHTML='';
  if(!window.ReadixWordEngine){stage.innerHTML='<div style="padding:40px;font:14px Inter,sans-serif">Le moteur Readix Word Engine n’a pas pu être chargé.</div>';return;}
  const wrap=el('div','rxw-host');wrap.style.cssText='position:absolute;inset:0';stage.append(wrap);
  t.docMeta=t.docMeta||{};
  if(!t.docSavedAs&&(!t.name||/^(Nouvel onglet|Nouveau document)(\.docx)?$/i.test(t.name))&&!String(t.doc||'').replace(/<[^>]*>/g,'').trim()){t.name='Document1.docx';renderTabs();}
  const openDocIn=(target,html,meta,name)=>{target.tool='docstudio';target.doc=html;target.docMeta=meta||{};target.name=name||'Document1.docx';target.docSavedAs=false;target.dirty=false;APP.tool='docstudio';pushHist({tool:'docstudio',page:1});renderTabs();renderTools();renderView();updateHeader();scheduleAutosave();};
  const docEmpty=x=>!String(x&&x.doc||'').replace(/<[^>]*>/g,'').replace(/[\s\u200B]/g,'')&&!/<(img|table|svg)/i.test(String(x&&x.doc||''));
  ReadixWordEngine.mount(wrap,{
    tab:t,
    getDoc:()=>t.doc||'',setDoc:h=>{t.doc=h;},
    getMeta:()=>t.docMeta||{},setMeta:m=>{t.docMeta=m;},
    getName:()=>t.name||'Document1.docx',setName:n=>{t.name=n;renderTabs();updateHeader();},
    isSavedAs:()=>!!t.docSavedAs,setSavedAs:v=>{t.docSavedAs=!!v;},
    onChange:()=>{t.dirty=true;scheduleDocSave(t);},
    onSaved:()=>{t.dirty=false;renderTabs();updateHeader();},
    toast:(m,k)=>toast(m,k==='err'?'err':'ok'),
    newDocument:()=>{const nt=createTab('Document1.docx');openDocIn(nt,'',{},'Document1.docx');},
    close:()=>closeTab(t.id),
    copilot:typeof toggleCopilotFloating==='function'?()=>toggleCopilotFloating():null,
    listDocs:()=>APP.tabs.filter(x=>x.tool==='docstudio').map(x=>({id:x.id,name:x.name||'Document',active:x.id===t.id})),
    switchDoc:id=>switchTab(id),
    duplicate:(html,meta,name)=>{const nt=createTab(name);openDocIn(nt,html,meta,name);},
    openDocument:(html,meta,name)=>{const target=docEmpty(t)?t:createTab(name);openDocIn(target,html,meta,name);}
  });
}

async function ensurePdf(t){ if(t&&t.bytes&&!t.pdf){ try{ t.pdf=await pdfjsLib.getDocument({data:u8(t.bytes).slice(0)}).promise; }catch(e){} } }
async function renderView(){
  const stage=$("#stage");stage.innerHTML="";stage.classList.remove("empty");
  const t=activeTab();
  if(t&&t.bytes&&!t.pdf){
    stage.classList.add("empty");
    const ld=el("div","opener");ld.style.cursor="default";ld.innerHTML='<div class="spin" style="width:26px;height:26px;border-width:3px"></div><h3 style="margin-top:14px">Chargement…</h3>';
    stage.appendChild(ld);
    await ensurePdf(t);
    stage.innerHTML="";stage.classList.remove("empty");
  }
  if(t&&t.tool==="cvbuilder"){ return renderCvBuilder(t,stage); }
  if(t&&t.tool==="bookstudio"){ return renderBookStudio(t,stage); }
  if(t&&t.tool==="engstudio"){ return renderEngStudio(t,stage); }
  if(t&&t.tool==="docstudio"){ return renderDocStudio(t,stage); }
  if(t&&t.tool==="merge"){ return renderMerge(t,stage); }
  if(t&&t.tool==="tolpdf"){ return renderToLpdf(t,stage); }
  if(t&&t.tool==="compare"){ return renderCompare(t,stage); }
  if(!t||!t.pdf){
    // Tableau de bord projet quand un projet est actif ; sinon écran d'accueil standard (inchangé).
    if((typeof activeProject==="function")&&activeProject()&&(!t||(!t.doc&&(t.tool==="home"||!t.tool)))){return renderProjectHome(stage);}
    if(t&&t.doc&&(t.tool==="home"||!t.tool)){t.tool="docstudio";return renderDocStudio(t,stage);}
    if(!t||t.tool==="home"||!t.tool){return renderHomeLanding(stage);}
    stage.classList.add("empty");
    const op=el("div","opener");
    const _p=(typeof activeProject==="function")?activeProject():null;const _sk=(typeof activeSkill==="function")?activeSkill():null;
    const _ctx=_p?`<div class="opener-proj"><span class="op-badge">Projet</span><b>${String(_p.name).replace(/[&<>]/g,"")}</b>${_sk?`<span>${_sk.hint}</span>`:(_p.domain?`<span>${String(_p.domain).replace(/[&<>]/g,"")}</span>`:"")}</div>`:"";
    op.innerHTML=_ctx+`<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><h3>Ouvrez un document</h3><p>Glissez un PDF ici, ou cliquez pour le choisir. Tout se passe dans votre navigateur.</p><button class="btn">Ouvrir un PDF</button>`;
    op.onclick=()=>$("#hiddenFile").click();
    stage.appendChild(op);
    stage.ondragover=e=>e.preventDefault();
    stage.ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type==="application/pdf")await openPdfBytes(await readAB(f),f.name);};
    return;
  }
  if(t.tool==="fillsign"){ return renderFillSign(t,stage); }
  if(t.tool==="editpdf"){ return renderEditPdf(t,stage); }
  if(t.tool==="organize"){ return renderOrganize(t,stage); }
  if(t.tool==="split"){ return renderSplit(t,stage); }
  if(t.tool==="redact"){ return renderRedact(t,stage); }
  if(t.tool==="text"){ return renderExtract(t,stage); }
  if(t.tool==="watermark"){ return renderWatermark(t,stage); }
  if(t.tool==="numbers"){ return renderNumbers(t,stage); }
  if(t.tool==="topng"){ return renderToPng(t,stage); }
  if(t.tool==="shield"){ return renderShield(t,stage); }
  if(t.tool==="meta"){ return renderMeta(t,stage); }
  if(t.tool==="compress"){ return renderCompress(t,stage); }
  renderReader(t,stage); // Lecteur par défaut
}

async function renderReader(t,stage){
  const pages=el("div","pages");stage.appendChild(pages);
  const scale=1.4*(t.zoom||1);
  for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);await renderPageTo(p,scale,pages);}

async function bookImportManuscript(book,rerender,btn){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/pdf";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;const lab=btn.textContent;btn.disabled=true;btn.textContent="Lecture du PDF…";
    try{
      const text=await readPdfText(f);
      if(!text.trim())throw new Error("Ce PDF ne contient pas de texte (scanné ?).");
      let chapters=[];
      // 1) découpage déterministe par « Chapitre N » (fiable, toute longueur)
      const parts=text.split(/(?=chapitre\s+[\dIVXLCM]+)/i).map(s=>s.trim()).filter(Boolean);
      if(parts.length>=2){
        chapters=parts.map((p,i)=>{const t=p.slice(0,80).replace(/\s+/g," ").trim();return {title:(t||("Chapitre "+(i+1))).slice(0,120),content:p};});
      } else {

        const arr=parseJsonLoose(out);
        chapters=Array.isArray(arr)?arr.map((x,i)=>({title:String(x.title||("Chapitre "+(i+1))).slice(0,140),content:String(x.content||"")})):[{title:"Chapitre 1",content:text.slice(0,20000)}];
      }
      if(!chapters.length)throw new Error("Impossible de structurer le manuscrit.");
      book.chapters=chapters.slice(0,50);rerender();toast(`Manuscrit importé ✓ — ${book.chapters.length} chapitre(s).`,"ok");
    }catch(e){toast(e.message||"Échec de l’import.","err");}
    finally{btn.disabled=false;btn.textContent=lab;}
  };

function engDefault(){return {title:"",client:"",description:"",items:[],notes:""};}
function engNum(v){const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0;}
function engLineTotal(it){return engNum(it.qty)*engNum(it.price);}
function engGrand(eng){return (eng.items||[]).reduce((s,it)=>s+engLineTotal(it),0);}
function engFmt(n){try{return Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});}catch(e){return (Math.round(n*100)/100).toFixed(2);}}
function engToTable(eng){return {title:(eng.title||"Chiffrage").slice(0,28),columns:["Désignation","Quantité","Unité","Prix unitaire","Total"],rows:(eng.items||[]).map(it=>[it.label||"",String(it.qty||""),it.unit||"",String(it.price||""),engFmt(engLineTotal(it))]).concat([["TOTAL","","","",engFmt(engGrand(eng))]])};}
function engToHtml(eng){
  const esc=cvEsc;let h=`<h1>${esc(eng.title||"Chiffrage / Métré")}</h1>`;
  if(eng.client)h+=`<p><b>Client :</b> ${esc(eng.client)}</p>`;
  if(eng.description)h+=`<p>${esc(eng.description)}</p>`;
  h+=`<h2>Détail estimatif</h2><table><tr><th>Désignation</th><th>Qté</th><th>Unité</th><th>P.U.</th><th>Total</th></tr>`;
  (eng.items||[]).forEach(it=>{h+=`<tr><td>${esc(it.label)}</td><td>${esc(it.qty)}</td><td>${esc(it.unit)}</td><td>${esc(it.price)}</td><td>${engFmt(engLineTotal(it))}</td></tr>`;});
  h+=`<tr><td><b>TOTAL</b></td><td></td><td></td><td></td><td><b>${engFmt(engGrand(eng))}</b></td></tr></table>`;
  if(eng.notes)h+=`<h2>Notes & hypothèses</h2><p>${esc(eng.notes)}</p>`;
  h+=`<p><i>Estimation indicative — les quantités, prix et hypothèses doivent être validés par un professionnel. Document non certifié.</i></p>`;
  return h;
}

function bookCover(id){return BOOK_COVERS.find(c=>c.id===id)||BOOK_COVERS[0];}

function bookToHtml(book){
  const esc=cvEsc;let h=`<h1>${esc(book.title||"Titre du livre")}</h1>`;
  if(book.subtitle)h+=`<p><b>${esc(book.subtitle)}</b></p>`;
  if(book.author)h+=`<p>${esc(book.author)}</p>`;
  (book.chapters||[]).forEach((c,i)=>{h+=`<h2>${esc((i+1)+". "+(c.title||"Chapitre"))}</h2>`;String(c.content||"").split(/\n{2,}/).forEach(p=>{if(p.trim())h+=`<p>${esc(p.trim())}</p>`;});});

function _hexRgb(PDFLib,h){h=String(h||"#000").replace("#","");return PDFLib.rgb(parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255);}
function _bookClean(t){return String(t||"").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...").replace(/[^\x20-\x7E\u00C0-\u00FF\n]/g," ");}
async function drawBookCoverPage(doc,book,font,bold){
  const W=432,H=648,cov=bookCover(book.cover);const p=doc.addPage([W,H]);
  p.drawRectangle({x:0,y:0,width:W,height:H,color:_hexRgb(PDFLib,cov.bg)});
  p.drawRectangle({x:54,y:H-150,width:70,height:6,color:_hexRgb(PDFLib,cov.accent)});
  const cw=(text,size,fnt,y)=>{const maxW=W-108;const words=_bookClean(text).split(/\s+/).filter(Boolean);let line="",lines=[];for(const w of words){const t=line?line+" "+w:w;if(fnt.widthOfTextAtSize(t,size)>maxW){if(line)lines.push(line);line=w;}else line=t;}if(line)lines.push(line);lines.forEach(ln=>{const tw=fnt.widthOfTextAtSize(ln,size);p.drawText(ln,{x:(W-tw)/2,y,size,font:fnt,color:_hexRgb(PDFLib,cov.fg)});y-=size*1.2;});return y;};
  let y=H-210;y=cw(book.title||"Titre du livre",30,bold,y);
  if(book.subtitle){y-=14;y=cw(book.subtitle,15,font,y);}
  if(book.author){const a=_bookClean(book.author);const aw=font.widthOfTextAtSize(a,13);p.drawText(a,{x:(W-aw)/2,y:90,size:13,font,color:_hexRgb(PDFLib,cov.fg)});}
}
async function buildCoverPdf(book){const {PDFDocument,StandardFonts}=PDFLib;const doc=await PDFDocument.create();const font=await doc.embedFont(StandardFonts.Helvetica);const bold=await doc.embedFont(StandardFonts.HelveticaBold);await drawBookCoverPage(doc,book,font,bold);return await doc.save();}
async function buildBookPdf(book){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;const doc=await PDFDocument.create();
  const font=await doc.embedFont(StandardFonts.Helvetica);const bold=await doc.embedFont(StandardFonts.HelveticaBold);
  await drawBookCoverPage(doc,book,font,bold);
  const W=432,H=648,margin=54,bodySize=11,lineH=bodySize*1.5;
  (book.chapters||[]).forEach((c,ci)=>{
    let p=doc.addPage([W,H]);let y=H-margin;
    p.drawText(_bookClean((ci+1)+". "+(c.title||"Chapitre")),{x:margin,y,size:17,font:bold,color:rgb(.12,.14,.18)});y-=30;
    String(c.content||"").split(/\n{2,}/).forEach(par=>{
      const words=_bookClean(par).split(/\s+/).filter(Boolean);let line="";const maxW=W-margin*2;
      const flush=ln=>{if(y<margin+lineH){p=doc.addPage([W,H]);y=H-margin;}p.drawText(ln,{x:margin,y,size:bodySize,font,color:rgb(.15,.17,.2)});y-=lineH;};
      for(const w of words){const t=line?line+" "+w:w;if(font.widthOfTextAtSize(t,bodySize)>maxW){flush(line);line=w;}else line=t;}
      if(line)flush(line);y-=lineH*0.6;
    });
  });
  return await doc.save();
}

async function bookAiPlan(book,rerender,btn){
  const topic=[book.title,book.subtitle].filter(Boolean).join(" — ");

  const lab=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="L’IA réfléchit…";}
  try{
    const txt=await aiGenerate(`Propose un plan de livre pour : "${topic}". Réponds UNIQUEMENT avec un tableau JSON de 6 à 12 titres de chapitres, sans aucun texte autour. Exemple : ["Introduction","Les fondations", "..."]`,"Tu es un éditeur expert. Réponds uniquement avec le JSON demandé.",700);
    let titles=[];try{const m=txt.match(/\[[\s\S]*\]/);titles=JSON.parse(m?m[0]:txt);}catch(e){titles=txt.split(/\n+/).map(s=>s.replace(/^[-*\d.\)\s]+/,"").trim()).filter(Boolean);}

  finally{if(btn){btn.disabled=false;btn.textContent=lab;}}
}

function stepIconHTML(status){

function buildPlanPanel(steps,multi){
  const root=el("div","ai19-plan");
  const head=el("div","ai19-plan-head",multi?"Je vais effectuer ces étapes":"Action en cours");
  root.appendChild(head);
  const rows=steps.map((s,i)=>{
    const row=el("div","ai19-step pending");
    row.innerHTML=`<span class="ai19-step-ic">${stepIconHTML("pending")}</span>`+
      `<span class="lbl"><b>${String(s.label||"Étape").replace(/[&<>]/g,"")}</b>${s.title?`<small>${String(s.title).replace(/[&<>]/g,"")}</small>`:""}</span>`;
    root.appendChild(row);

  });
  function setStatus(i,status,detail){
    if(!rows[i])return;steps[i].status=status;
    rows[i].className="ai19-step "+status;
    const ic=rows[i].querySelector(".ai19-step-ic");if(ic)ic.innerHTML=stepIconHTML(status);
    if(detail){const lbl=rows[i].querySelector(".lbl");let sm=lbl.querySelector("small");if(!sm){sm=document.createElement("small");lbl.appendChild(sm);}sm.textContent=detail;}
  }
  function confirm(i,a){
    return new Promise(resolve=>{
      setStatus(i,"confirm");
      const pages=Array.isArray(a.pages)?a.pages.join(", "):"";
      const lbl=rows[i].querySelector(".lbl");
      const bar=document.createElement("div");bar.className="ai19-confirm-row";
      bar.innerHTML=`<span style="flex:1;font-size:11px;color:#8c3030">Opération définitive${pages?` (pages ${pages})`:""}. Confirmer ?</span>`+
        `<button data-c="no">Annuler</button><button data-c="yes" class="danger">Confirmer</button>`;
      lbl.appendChild(bar);
      bar.querySelector('[data-c="yes"]').onclick=()=>{bar.remove();resolve(true);};
      bar.querySelector('[data-c="no"]').onclick=()=>{bar.remove();resolve(false);};
    });
  }
  return {root,setStatus,confirm};
}

function _median(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
// PDF → HTML structuré : regroupe les items par ligne, détecte titres (grande police), listes et paragraphes.
async function extractPdfStructured(pdf){
  if(!pdf)return "";
  const sizes=[];const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim());
    const lines=[];
    for(const it of items){
      const y=Math.round(it.transform[5]);const size=Math.abs(it.transform[0])||it.height||10;
      let ln=lines.find(l=>Math.abs(l.y-y)<=3);
      if(!ln){ln={y,size,parts:[]};lines.push(ln);}
      ln.parts.push(it.str);ln.size=Math.max(ln.size,size);
    }
    lines.sort((a,b)=>b.y-a.y);
    const norm=lines.map(l=>({text:l.parts.join(" ").replace(/\s+/g," ").trim(),size:l.size,y:l.y})).filter(l=>l.text);
    norm.forEach(l=>sizes.push(l.size));pages.push(norm);
  }
  const body=_median(sizes)||10;
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const blocks=[];
  for(const norm of pages){
    let buf=[];const flush=()=>{if(buf.length){blocks.push({t:"p",text:buf.join(" ")});buf=[];}};
    for(let k=0;k<norm.length;k++){
      const l=norm[k];const ratio=l.size/body;
      const isHead=ratio>=1.25&&l.text.length<=90&&!/[.:;,]$/.test(l.text);
      const isBullet=/^([•\-\*\u2022\u25AA\u25CF]|\d+[.)])\s+/.test(l.text);
      if(isHead){flush();blocks.push({t:ratio>=1.6?"h1":"h2",text:l.text});continue;}
      if(isBullet){flush();blocks.push({t:"li",text:l.text.replace(/^([•\-\*\u2022\u25AA\u25CF]|\d+[.)])\s+/,"")});continue;}
      buf.push(l.text);
      const next=norm[k+1];if(next&&(l.y-next.y)>l.size*1.8)flush();
    }
    flush();
  }
  let html="",inList=false;
  for(const b of blocks){
    if(b.t==="li"){if(!inList){html+="<ul>";inList=true;}html+="<li>"+esc(b.text)+"</li>";continue;}
    if(inList){html+="</ul>";inList=false;}
    if(b.t==="h1")html+="<h1>"+esc(b.text)+"</h1>";
    else if(b.t==="h2")html+="<h2>"+esc(b.text)+"</h2>";
    else html+="<p>"+esc(b.text)+"</p>";
  }
  if(inList)html+="</ul>";
  return html;
}
// HTML (Document Studio) → PDF réel, en préservant titres, paragraphes, listes et tableaux (aplatis).
async function pdfFromHtml(html){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const doc=await PDFDocument.create();
  const font=await doc.embedFont(StandardFonts.Helvetica);
  const bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=595,H=842,margin=54;let page=doc.addPage([W,H]);let y=H-margin;
  const cont=document.createElement("div");cont.innerHTML=html||"";
  const blocks=[];
  (function walk(node){
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){const tx=n.textContent.trim();if(tx&&node===cont)blocks.push({t:"p",text:tx});return;}
      if(n.nodeType!==1)return;const tag=n.tagName.toLowerCase();
      if(tag==="h1"||tag==="h2"||tag==="h3")blocks.push({t:tag,text:n.textContent.trim()});
      else if(tag==="p")blocks.push({t:"p",text:n.textContent.trim()});
      else if(tag==="blockquote")blocks.push({t:"quote",text:n.textContent.trim()});
      else if(tag==="ul"||tag==="ol"){[...n.children].forEach(li=>{if(li.tagName&&li.tagName.toLowerCase()==="li")blocks.push({t:"li",text:li.textContent.trim()});});}
      else if(tag==="table"){[...n.querySelectorAll("tr")].forEach(tr=>{const cells=[...tr.children].map(td=>td.textContent.trim());if(cells.join("").trim())blocks.push({t:"p",text:cells.join("   |   ")});});}
      else if(n.children&&n.children.length)walk(n);
      else if(n.textContent.trim())blocks.push({t:"p",text:n.textContent.trim()});
    });
  })(cont);
  if(!blocks.length)blocks.push({t:"p",text:cont.textContent.trim()||" "});
  const S={h1:{size:22,f:bold,gap:12,before:10},h2:{size:16,f:bold,gap:9,before:8},h3:{size:13,f:bold,gap:7,before:6},p:{size:11,f:font,gap:6,before:0},li:{size:11,f:font,gap:4,before:0,bullet:true},quote:{size:11,f:font,gap:6,before:4,indent:16}};
  const clean=t=>String(t||"")
    .replace(/[\u2018\u2019\u201A\u2032]/g,"'").replace(/[\u201C\u201D\u201E\u2033]/g,'"')
    .replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...").replace(/[\u2022\u25AA\u25CF\u25E6]/g,"-").replace(/\u00A0/g," ")
    .replace(/[^\x09\x0A\x0D\x20-\x7E\u00C0-\u00FF]/g," ");
  function draw(text,s){
    const size=s.size,fnt=s.f,lineH=size*1.42,indent=(s.indent||0)+(s.bullet?14:0),maxW=W-margin*2-indent;
    const words=clean((s.bullet?"- ":"")+text).split(/\s+/).filter(Boolean);
    const lines=[];let line="";
    for(const w of words){const test=line?line+" "+w:w;if(fnt.widthOfTextAtSize(test,size)>maxW){if(line)lines.push(line);line=w;}else line=test;}
    if(line)lines.push(line);
    y-=s.before;
    for(const ln of lines){if(y<margin+lineH){page=doc.addPage([W,H]);y=H-margin;}page.drawText(ln,{x:margin+indent,y,size,font:fnt,color:rgb(.12,.14,.18)});y-=lineH;}
    y-=s.gap;
  }
  for(const b of blocks){if(b.text)draw(b.text,S[b.t]||S.p);}
  return await doc.save();
}

function _sanitizeFilename(n){return String(n||"donnees").replace(/[^\wÀ-ÿ ._-]/g,"_").trim()||"donnees";}
function tableToCsv(table){

function _xmlEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function _colLetter(n){let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
async function buildXlsxBlob(table){
  const zip=new JSZip();

  const all=[table.columns,...table.rows];

  all.forEach((row,ri)=>{
    let cells="";

      const raw=row[ci];const ref=_colLetter(ci)+(ri+1);
      const norm=String(raw==null?"":raw).trim().replace(",",".");
      const isNum=ri>0&&/^-?(?:0|[1-9]\d*)(?:\.\d+)?$/.test(norm);
      if(isNum)cells+=`<c r="${ref}"><v>${norm}</v></c>`;

  zip.folder("_rels").file(".rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  const xl=zip.folder("xl");

  xl.folder("_rels").file("workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>');
  xl.folder("worksheets").file("sheet1.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`);
  return await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

let _tesseractPromise=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);

  _tesseractPromise=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.async=true;
    s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error("Le moteur OCR n’a pas pu être initialisé."));
    s.onerror=()=>{_tesseractPromise=null;reject(new Error("Impossible de charger le moteur OCR (vérifiez la connexion Internet)."));};

async function ocrPdfTab(t,onProgress){
  if(!t||!t.pdf)throw new Error("Aucun PDF à reconnaître.");

  for(let i=1;i<=t.pdf.numPages;i++){

function openSignaturePad(){
  const dl=dialog(`<h3>Créer une signature</h3><p>Dessinez votre signature ci-dessous.</p><canvas id="sigpad" width="380" height="150" style="width:100%;height:150px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;touch-action:none"></canvas><div class="row" style="margin-top:16px"><button class="btn ghost sm" data-a="clear">Effacer</button><button class="btn ghost sm" data-a="cancel">Annuler</button><button class="btn sm" data-a="ok">Ajouter</button></div>`);
  const cv=$("#sigpad",dl.root);const ctx=cv.getContext("2d");ctx.lineWidth=2.5;ctx.lineCap="round";ctx.strokeStyle="#111";let drawing=false,has=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=(e.touches?e.touches[0]:e);return {x:(p.clientX-r.left)*(cv.width/r.width),y:(p.clientY-r.top)*(cv.height/r.height)};};
  cv.onpointerdown=e=>{drawing=true;has=true;const q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);};
  cv.onpointermove=e=>{if(!drawing)return;const q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke();};
  window.addEventListener("pointerup",()=>drawing=false);
  dl.root.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;
    if(a.dataset.a==="clear"){ctx.clearRect(0,0,cv.width,cv.height);has=false;return;}
    if(a.dataset.a==="cancel"){dl.close();return;}
    if(a.dataset.a==="ok"){if(!has){toast("Dessinez d'abord votre signature.","warn");return;}addSig(cv.toDataURL("image/png"));dl.close();}
  };
}

    const dn=el("button","ico");dn.innerHTML="↓";dn.onclick=()=>{if(i<files.length-1){[files[i+1],files[i]]=[files[i],files[i+1]];draw();}};
    const rm=el("button","ico");rm.innerHTML="✕";rm.onclick=()=>{files.splice(i,1);draw();};
    rowc.append(up,dn,rm);c.appendChild(rowc);grid.appendChild(c);});}

async function renderOrganize(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const bar=el("div","actionbar");bar.innerHTML='<span class="info">Glissez pour réordonner. Pivotez ou supprimez des pages.</span><span class="sp"></span>';

  const order=[];for(let i=1;i<=t.pdf.numPages;i++)order.push({page:i,rot:0});
  async function draw(){grid.innerHTML="";for(let idx=0;idx<order.length;idx++){const o=order[idx];const p=await t.pdf.getPage(o.page);const vp=p.getViewport({scale:0.34,rotation:o.rot});
    const card=el("div");card.style.cssText="width:148px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow-sm)";card.draggable=true;

    const rr=el("button","ico");rr.innerHTML="⟳";rr.onclick=()=>{o.rot=(o.rot+90)%360;draw();};
    const dl=el("button","ico");dl.innerHTML="✕";dl.onclick=()=>{order.splice(idx,1);draw();};
    row.append(num,rl,rr,dl);card.appendChild(row);

function parseRanges(str,max){const out=[];(str||"").split(",").forEach(part=>{part=part.trim();if(!part)return;const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b){const z=a;a=b;b=z;}for(let i=a;i<=b;i++)if(i>=1&&i<=max)out.push(i);}else if(/^\d+$/.test(part)){const n=+part;if(n>=1&&n<=max)out.push(n);}});return[...new Set(out)];}

// Phase 20.5 — Traduit un code HTTP / message serveur en message clair pour l'utilisateur.
function humanizeError(status,serverMsg,ctx){
  const s=Number(status)||0;
  // Panne réseau : toujours un message clair (on ignore le texte technique du navigateur).
  if(s===0)return "Impossible de joindre le serveur Readix. Vérifiez votre connexion Internet, puis réessayez.";
  const raw=(serverMsg&&String(serverMsg).trim())||"";
  // Un message serveur déjà lisible est conservé tel quel (ex. « Quota IA mensuel atteint »).
  const looksRaw=!raw||/^erreur\s*\d+$/i.test(raw)||/^\d{3}$/.test(raw)||/^not found$/i.test(raw)||/^cannot (get|post)/i.test(raw);
  if(!looksRaw)return raw;
  switch(s){
    case 0:   return "Impossible de joindre le serveur Readix. Vérifiez votre connexion Internet, puis réessayez.";
    case 400: return "La demande est incomplète ou mal formée. Vérifiez les informations saisies.";
    case 401: return "Votre session a expiré. Reconnectez-vous pour continuer.";
    case 402: return "Cette fonction nécessite un abonnement supérieur (Pro ou Studio).";
    case 403: return "Vous n’avez pas l’autorisation d’effectuer cette action.";
    case 404: return "Cette fonction n’est pas disponible sur le serveur (moteur non publié ou route introuvable). Réessayez plus tard.";
    case 408: return "La demande a expiré. Réessayez.";
    case 413: return "Le document est trop volumineux pour être traité.";
    case 415: return "Ce format de fichier n’est pas pris en charge.";
    case 429: return "Quota IA mensuel atteint. Il se réinitialisera le mois prochain, ou passez à un plan supérieur.";
    case 500: return "Une erreur interne est survenue pendant le traitement. Réessayez.";
    case 502: return "Le service IA est momentanément indisponible. Réessayez dans un instant.";
    case 503: return "Le service Readix est momentanément indisponible (configuration ou maintenance). Réessayez dans un instant.";
    case 504: return "Le serveur a mis trop de temps à répondre. Réessayez.";
    default:  return "Impossible d’exécuter l’action (code "+s+"). Réessayez.";
  }
}
function makeApiError(status,serverMsg,ctx,code){
  const e=new Error(humanizeError(status,serverMsg,ctx));
  e.status=status;e.endpoint=ctx&&ctx.endpoint;e.method=ctx&&ctx.method;e.code=code||null;
  e.serverMessage=serverMsg||"";
  e.technical={status,endpoint:e.endpoint,method:e.method,code:e.code||undefined,serverMessage:serverMsg||undefined,at:new Date().toISOString()};
  try{console.error("[Readix API]",e.technical,"→",e.message);}catch(_){}
  return e;

async function api(path,body,method){
  const m=method||(body?"POST":"GET");
  const opt={method:m,headers:{"content-type":"application/json"}};
  const t=getToken();if(t)opt.headers.authorization="Bearer "+t;
  if(body)opt.body=JSON.stringify(body);
  let r;
  try{r=await fetch(API_BASE+path,opt);}
  catch(netErr){throw makeApiError(0,netErr&&netErr.message,{endpoint:path,method:m});}
  let data={};try{data=await r.json();}catch(e){}
  if(!r.ok){
    const serverMsg=(data&&(typeof data.error==="string"?data.error:(data.error&&data.error.message)))||data.message||"";
    const code=(data&&data.error&&data.error.code)||data.code||null;
    throw makeApiError(r.status,serverMsg,{endpoint:path,method:m},code);
  }
  return data;
}

<script id="readix-core">
/* ============================================================
   READIX — COMMON CORE (Phase 1)
   Façade additive au-dessus des systèmes DÉJÀ présents dans Readix.
   Ne crée aucun stockage, aucune navigation, aucun rail.
   Elle nomme et unifie l'existant : Project / Document / Context /
   Storage / Actions. Toutes les références aux fonctions de Readix
   sont résolues à l'exécution et protégées (typeof), pour ne jamais
   casser le socle si un symbole est absent.
   ============================================================ */
(function () {
  "use strict";
  var RX = (window.Readix = window.Readix || {});
  if (RX.core) return; // idempotent

  var has = function (name) { try { return typeof eval(name) !== "undefined"; } catch (e) { return false; } };
  var G = function (name) { try { return eval(name); } catch (e) { return undefined; } };

  RX._recent = RX._recent || [];

  /* ---------- 1.4 STORAGE ENGINE (adaptateur — AUCUN nouveau stockage) ---------- */
  var storage = {
    // Onglets/documents (magasin "tabs" existant)
    saveTab: function (id, state) { return has("idbSave") ? G("idbSave")(id, state) : null; },
    loadTab: function (id) { return has("idbLoad") ? G("idbLoad")(id) : null; },
    allTabs: function () { return has("idbAll") ? G("idbAll")() : Promise.resolve([]); },
    delTab: function (id) { return has("idbDel") ? G("idbDel")(id) : null; },
    // Projets (magasin "projects" existant + sync serveur best-effort déjà en place)
    saveProject: function (p) { return has("idbProjectSave") ? G("idbProjectSave")(p) : null; },
    allProjects: function () { return has("idbProjectAll") ? G("idbProjectAll")() : Promise.resolve([]); },
    delProject: function (id) { return has("idbProjectDel") ? G("idbProjectDel")(id) : null; },
    // Conversations Copilot (magasin "copilotChats" existant)
    saveChat: function (c) { return has("idbChatSave") ? G("idbChatSave")(c) : null; },
    allChats: function () { return has("idbChatAll") ? G("idbChatAll")() : Promise.resolve([]); },
    // Préférences légères du core (localStorage, préfixe rx: dédié)
    pref: function (key, val) {
      try {
        if (val === undefined) { var v = localStorage.getItem("rx:" + key); return v == null ? null : JSON.parse(v); }
        localStorage.setItem("rx:" + key, JSON.stringify(val)); return val;
      } catch (e) { return null; }
    }
  };

  /* ---------- 1.1 PROJECT ENGINE (schéma commun au-dessus de newProject/PROJECT_STATE) ---------- */
  var SCHEMA = ["id", "name", "description", "domain", "subDomain", "status", "settings",
    "skills", "tabs", "documents", "generatedObjects", "tasks", "history", "versions",
    "metadata", "createdAt", "updatedAt"];
  var projects = {
    schema: SCHEMA,
    normalize: function (p) {
      p = p || {}; var now = Date.now();
      if (!p.id) p.id = has("projectId") ? G("projectId")() : ("p" + now + Math.floor(Math.random() * 1e4));
      SCHEMA.forEach(function (k) {
        if (p[k] === undefined) {
          p[k] = (k === "createdAt" || k === "updatedAt") ? now
            : (k === "status") ? "active"
            : (["tabs", "documents", "generatedObjects", "tasks", "history", "versions", "skills"].indexOf(k) >= 0) ? []
            : (["settings", "metadata"].indexOf(k) >= 0) ? {}
            : (k === "name") ? "Nouveau projet" : "";
        }
      });
      return p;
    },
    create: function (opts) {
      var p = has("newProject") ? G("newProject")(opts || {}) : projects.normalize(opts || {});
      p = projects.normalize(p);
