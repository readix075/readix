function setEdMode(m){EDMODE=m;$$(".edmode[data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m===m));}
function toggleFmt(kind){if(!_sel||_sel.dataset.type!=="text")return;
  if(kind==="bold"){const on=_sel.dataset.bold==="1";_sel.dataset.bold=on?"":"1";_sel.style.fontWeight=on?"400":"700";}
  else if(kind==="italic"){const on=_sel.dataset.italic==="1";_sel.dataset.italic=on?"":"1";_sel.style.fontStyle=on?"normal":"italic";}
  else if(kind==="underline"){const on=_sel.dataset.underline==="1";_sel.dataset.underline=on?"":"1";_sel.style.textDecoration=on?"none":"underline";}
  markDirty();
}
async function pickFont(doc,fam,bold,ital,cache){const {StandardFonts}=PDFLib;const key=fam+(bold?"B":"")+(ital?"I":"");if(cache[key])return cache[key];
  const M={Helvetica:{"":StandardFonts.Helvetica,B:StandardFonts.HelveticaBold,I:StandardFonts.HelveticaOblique,BI:StandardFonts.HelveticaBoldOblique},
    Times:{"":StandardFonts.TimesRoman,B:StandardFonts.TimesRomanBold,I:StandardFonts.TimesRomanItalic,BI:StandardFonts.TimesRomanBoldItalic},
    Courier:{"":StandardFonts.Courier,B:StandardFonts.CourierBold,I:StandardFonts.CourierOblique,BI:StandardFonts.CourierBoldOblique}};
  const sf=(M[fam]||M.Helvetica)[(bold?"B":"")+(ital?"I":"")]||StandardFonts.Helvetica;
  const f=await doc.embedFont(sf);cache[key]=f;return f;
}
function addEl(layer,pg,type,x,y,opts){
  opts=opts||{};const it=el("div","movEl");it.dataset.type=type;
  it.style.left=Math.max(0,x)+"px";it.style.top=Math.max(0,y)+"px";
  if(type==="text"){it.classList.add("edtext");it.dataset.ph="Texte";it.dataset.color="#111111";it.dataset.size="14";it.dataset.font="Helvetica";
    it.style.color="#111111";it.style.caretColor="#111111";it.style.fontSize="14px";it.style.fontFamily=fontCss("Helvetica");it.textContent="";
    it.addEventListener("dblclick",()=>{it.setAttribute("contenteditable","true");it.focus();});
    it.addEventListener("blur",()=>{it.removeAttribute("contenteditable");});
  }
  else if(type==="image"){it.style.width="160px";it.style.height="120px";const im=el("img");im.src=opts.src;im.style.cssText="width:100%;height:100%;object-fit:contain;pointer-events:none;display:block";it.appendChild(im);it.dataset.src=opts.src;}
  else{it.dataset.color=EDCOLOR;const shp=el("div","edshape");
    if(type==="rect"){it.style.width="120px";it.style.height="70px";shp.style.cssText=`width:100%;height:100%;border:2px solid ${EDCOLOR};box-sizing:border-box;pointer-events:none`;}
    else if(type==="line"){it.style.width="120px";it.style.height="3px";shp.style.cssText=`width:100%;height:100%;background:${EDCOLOR};pointer-events:none`;}
    else if(type==="hl"){it.style.width="120px";it.style.height="20px";shp.style.cssText=`width:100%;height:100%;background:${EDCOLOR};opacity:.4;pointer-events:none`;}
    else if(type==="mask"||type==="redact"){it.style.width="120px";it.style.height="30px";const col=type==="redact"?"#000000":EDCOLOR;it.dataset.color=col;shp.style.cssText=`width:100%;height:100%;background:${col};pointer-events:none`;}
    it.appendChild(shp);}
  const del=el("button","movDel","✕");del.onpointerdown=e=>e.stopPropagation();del.onclick=e=>{e.stopPropagation();removeEl(it);};it.appendChild(del);
  layer.appendChild(it);makeMovable(it,pg,()=>markDirty());selectEl(it);markDirty();
  pushAction(activeTab(),{undo:()=>{if(_sel===it)_sel=null;it.remove();},redo:()=>layer.appendChild(it)});
  if(type==="text"){it.setAttribute("contenteditable","true");setTimeout(()=>it.focus(),0);}
  setEdMode("select");
}
function removeEl(it){const t=activeTab();const parent=it.parentNode;const next=it.nextSibling;it.remove();if(_sel===it)_sel=null;markDirty();pushAction(t,{undo:()=>parent.insertBefore(it,next),redo:()=>it.remove()});}
async function doSaveEdit(t){
  try{ toast("Génération du PDF…");
    const {PDFDocument,rgb,StandardFonts,degrees}=PDFLib;
    const doc=await PDFDocument.load(u8(t.bytes).slice(0));
    const fontCache={};
    const scale=1.5*(t.zoom||1);
    for(const it of $$(".flayer .movEl")){
      const pageNum=+it.parentNode.dataset.page;if(!pageNum)continue;
      const pg=doc.getPage(pageNum-1);const {height}=pg.getSize();
      const xPt=parseFloat(it.style.left)/scale,yTop=parseFloat(it.style.top)/scale,wPt=it.offsetWidth/scale,hPt=it.offsetHeight/scale,yPt=height-yTop-hPt;
      const type=it.dataset.type;
      try{
        if(type==="text"){const c=hexRgb(it.dataset.color);const s=(parseFloat(it.dataset.size)||14)/scale;
          const f=await pickFont(doc,it.dataset.font||"Helvetica",it.dataset.bold==="1",it.dataset.italic==="1",fontCache);
          const txt=it.textContent||"";pg.drawText(txt,{x:xPt+2/scale,y:height-yTop-s,size:s,font:f,color:rgb(c.r,c.g,c.b)});
          if(it.dataset.underline==="1"&&txt){let tw=0;try{tw=f.widthOfTextAtSize(txt,s);}catch(e){tw=txt.length*s*0.5;}pg.drawRectangle({x:xPt+2/scale,y:height-yTop-s-1,width:tw,height:Math.max(.6,s*0.06),color:rgb(c.r,c.g,c.b)});}}
        else if(type==="image"){const src=it.dataset.src;const im=/png/i.test(src.slice(0,20))?await doc.embedPng(src):await doc.embedJpg(src);pg.drawImage(im,{x:xPt,y:yPt,width:wPt,height:hPt});}
        else if(type==="rect"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,borderColor:rgb(c.r,c.g,c.b),borderWidth:1.5});}
        else if(type==="mask"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,color:rgb(c.r,c.g,c.b)});}
        else if(type==="hl"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,color:rgb(c.r,c.g,c.b),opacity:.4});}
        else if(type==="line"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:Math.max(1,hPt),color:rgb(c.r,c.g,c.b)});}
      }catch(e){}
    }
    const ok=await saveBytes(await doc.save(),(t.name||"document").replace(/\.pdf$/i,"")+"-modifie.pdf");
    if(ok){t.dirty=false;updateSaveDot();toast("PDF modifié enregistré.","ok");}
  }catch(e){toast("Erreur : "+e.message,"err");}
}

/* ---------- Organiser ---------- */
async function renderOrganize(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const bar=el("div","actionbar");bar.innerHTML='<span class="info">Glissez pour réordonner. Pivotez ou supprimez des pages.</span><span class="sp"></span>';
  const save=el("button","btn sm","Enregistrer");bar.append(save);stage.appendChild(bar);
  const grid=el("div");grid.style.cssText="display:flex;flex-wrap:wrap;gap:14px;padding:18px;max-width:950px;margin:0 auto";stage.appendChild(grid);
  const order=[];for(let i=1;i<=t.pdf.numPages;i++)order.push({page:i,rot:0});
  async function draw(){grid.innerHTML="";for(let idx=0;idx<order.length;idx++){const o=order[idx];const p=await t.pdf.getPage(o.page);const vp=p.getViewport({scale:0.34,rotation:o.rot});
    const card=el("div");card.style.cssText="width:148px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow-sm)";card.draggable=true;
    const cv=el("canvas");cv.width=vp.width;cv.height=vp.height;cv.style.cssText="width:100%;border-radius:6px;display:block;background:#fff";await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;card.appendChild(cv);
    const row=el("div");row.style.cssText="display:flex;gap:3px;justify-content:center;align-items:center;margin-top:6px";
    const num=el("span",null,(idx+1)+"");num.style.cssText="font-size:11px;font-weight:700;color:var(--brand);margin-right:4px";
    const rl=el("button","ico");rl.innerHTML="⟲";rl.onclick=()=>{o.rot=(o.rot+270)%360;draw();};
    const rr=el("button","ico");rr.innerHTML="⟳";rr.onclick=()=>{o.rot=(o.rot+90)%360;draw();};
    const dl=el("button","ico");dl.innerHTML="✕";dl.onclick=()=>{order.splice(idx,1);draw();};
    row.append(num,rl,rr,dl);card.appendChild(row);
    card.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",idx));
    card.addEventListener("dragover",e=>e.preventDefault());
    card.addEventListener("drop",e=>{e.preventDefault();const from=+e.dataTransfer.getData("text/plain");if(from===idx)return;const m=order.splice(from,1)[0];order.splice(idx,0,m);draw();});
    grid.appendChild(card);}}
  await draw();
  save.onclick=async()=>{if(!order.length){toast("Aucune page.","warn");return;}
    try{const {PDFDocument,degrees}=PDFLib;const src=await PDFDocument.load(u8(t.bytes).slice(0));const out=await PDFDocument.create();
      for(const o of order){const [cp]=await out.copyPages(src,[o.page-1]);if(o.rot)cp.setRotation(degrees((cp.getRotation().angle+o.rot)%360));out.addPage(cp);}
      await saveBytes(await out.save(),(t.name||"document").replace(/\.pdf$/i,"")+"-organise.pdf");toast("Enregistré.","ok");
    }catch(e){toast("Erreur : "+e.message,"err");}};
}

/* ---------- Diviser ---------- */
function parseRanges(str,max){const out=[];(str||"").split(",").forEach(part=>{part=part.trim();if(!part)return;const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b){const z=a;a=b;b=z;}for(let i=a;i<=b;i++)if(i>=1&&i<=max)out.push(i);}else if(/^\d+$/.test(part)){const n=+part;if(n>=1&&n<=max)out.push(n);}});return[...new Set(out)];}
function renderSplit(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const wrap=el("div");wrap.style.cssText="max-width:520px;margin:26px auto;padding:0 20px";
  wrap.innerHTML=`<div class="actionbar" style="flex-direction:column;align-items:stretch;gap:12px"><div class="info">Diviser « ${t.name} » — ${t.pdf.numPages} pages</div><label style="font-size:13px;color:var(--ink-soft)">Plages de pages (ex. 1-3, 5, 8-10)</label><input id="spR" class="rp-input" placeholder="1-3, 5" style="margin:0"><label style="font-size:13px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="spE"> Une page par fichier (ZIP)</label><button class="btn sm" id="spGo" style="align-self:flex-start">Diviser et enregistrer</button></div>`;
  stage.appendChild(wrap);
  $("#spGo",wrap).onclick=async()=>{try{const {PDFDocument}=PDFLib;const src=await PDFDocument.load(u8(t.bytes).slice(0));const N=src.getPageCount();
    if($("#spE",wrap).checked){const zip=new JSZip();for(let i=0;i<N;i++){const d=await PDFDocument.create();const [p]=await d.copyPages(src,[i]);d.addPage(p);zip.file(`page-${i+1}.pdf`,await d.save());}const blob=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(t.name||"doc").replace(/\.pdf$/i,"")+"-pages.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("ZIP généré.","ok");return;}
    const r=parseRanges($("#spR",wrap).value,N);if(!r.length){toast("Indiquez des pages valides.","warn");return;}
    const d=await PDFDocument.create();const cp=await d.copyPages(src,r.map(n=>n-1));cp.forEach(p=>d.addPage(p));
    await saveBytes(await d.save(),(t.name||"doc").replace(/\.pdf$/i,"")+"-extrait.pdf");toast("Extrait enregistré.","ok");
  }catch(e){toast("Erreur : "+e.message,"err");}};
}

/* ---------- Caviarder (zones noires aplaties) ---------- */
async function renderRedact(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const bar=el("div","actionbar");
  bar.innerHTML='<span class="info">Cliquez sur une page pour ajouter une zone noire, puis déplacez/redimensionnez-la. À l\'enregistrement, les zones sont aplaties (contenu masqué).</span><span class="sp"></span>';
  const save=el("button","btn sm","Enregistrer (caviardé)");bar.append(save);stage.appendChild(bar);
  const pages=el("div","pages");stage.appendChild(pages);const scale=1.5*(t.zoom||1);
  for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const {wrap}=await renderPageTo(p,scale,pages,"page");
    const layer=el("div","flayer");layer.style.pointerEvents="auto";layer.dataset.page=i;wrap.appendChild(layer);
    layer.addEventListener("pointerdown",e=>{if(e.target!==layer)return;const r=layer.getBoundingClientRect();
      const it=el("div","movEl");it.dataset.type="redact";it.dataset.color="#000000";
      it.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:140px;height:26px`;
      const shp=el("div","edshape");shp.style.cssText="width:100%;height:100%;background:#000;pointer-events:none";it.appendChild(shp);
      const del=el("button","movDel","✕");del.onpointerdown=ev=>ev.stopPropagation();del.onclick=ev=>{ev.stopPropagation();removeEl(it);};it.appendChild(del);
      layer.appendChild(it);makeMovable(it,wrap,()=>markDirty());selectEl(it);markDirty();
      pushAction(t,{undo:()=>it.remove(),redo:()=>layer.appendChild(it)});
    });
  }
  save.onclick=async()=>{try{const {PDFDocument,rgb}=PDFLib;const doc=await PDFDocument.load(u8(t.bytes).slice(0));
    for(const it of $$(".flayer .movEl")){const pn=+it.parentNode.dataset.page;if(!pn)continue;const pg=doc.getPage(pn-1);const {height}=pg.getSize();
      const x=parseFloat(it.style.left)/scale,yt=parseFloat(it.style.top)/scale,w=it.offsetWidth/scale,h=it.offsetHeight/scale;
      pg.drawRectangle({x,y:height-yt-h,width:w,height:h,color:rgb(0,0,0)});}
    const ok=await saveBytes(await doc.save(),(t.name||"doc").replace(/\.pdf$/i,"")+"-caviarde.pdf");if(ok){t.dirty=false;updateSaveDot();toast("PDF caviardé enregistré.","ok");}
  }catch(e){toast("Erreur : "+e.message,"err");}};
}

/* ---------- Extraire le texte ---------- */
async function renderExtract(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const wrap=el("div");wrap.style.cssText="max-width:820px;margin:20px auto;padding:0 20px";
  const bar=el("div","actionbar");bar.innerHTML='<span class="info">Texte extrait du document</span><span class="sp"></span>';
  const copy=el("button","btn ghost sm","Copier");const dl=el("button","btn sm","Télécharger .txt");bar.append(copy,dl);
  const ta=el("textarea");ta.style.cssText="width:100%;min-height:60vh;margin-top:14px;padding:16px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);font-family:'Inter';font-size:13.5px;line-height:1.6;resize:vertical";ta.value="Extraction…";
  wrap.append(bar,ta);stage.appendChild(wrap);
  let out="";for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const tc=await p.getTextContent();out+=tc.items.map(x=>x.str).join(" ")+"\n\n";}
  ta.value=out.trim()||"(Aucun texte — PDF probablement scanné.)";
  copy.onclick=()=>{ta.select();try{document.execCommand("copy");toast("Copié.","ok");}catch(e){}};
  dl.onclick=()=>{const b=new Blob([ta.value],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(t.name||"doc").replace(/\.pdf$/i,"")+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);};
}

/* ---------- Comparer (différences de texte) ---------- */
function renderCompare(t,stage){
  const wrap=el("div");wrap.style.cssText="max-width:940px;margin:20px auto;padding:0 20px";
  wrap.innerHTML='<div class="actionbar"><span class="info">Comparez deux PDF : les différences de texte sont mises en évidence.</span></div>';

const API_BASE="";
function getToken(){try{return localStorage.getItem("readix_token");}catch(e){return null;}}

// Phase 20.5 — Traduit un code HTTP / message serveur en message clair pour l'utilisateur.
function humanizeError(status,serverMsg,ctx){
  const s=Number(status)||0;
  // Panne réseau : toujours un message clair (on ignore le texte technique du navigateur).
  if(s===0)return "Impossible de joindre le serveur Readix. Vérifiez votre connexion Internet, puis réessayez.";
  const raw=(serverMsg&&String(serverMsg).trim())||"";
  // Un message serveur déjà lisible est conservé tel quel (ex. « Quota IA mensuel atteint »).
  const looksRaw=!raw||/^erreur\s*\d+$/i.test(raw)||/^\d{3}$/.test(raw)||/^not found$/i.test(raw)||/^cannot (get|post)/i.test(raw);
  if(!looksRaw)return raw;
  switch(s){
    case 0:   return "Impossible de joindre le serveur Readix. Vérifiez votre connexion Internet, puis réessayez.";
    case 400: return "La demande est incomplète ou mal formée. Vérifiez les informations saisies.";
    case 401: return "Votre session a expiré. Reconnectez-vous pour continuer.";
    case 402: return "Cette fonction nécessite un abonnement supérieur (Pro ou Studio).";
    case 403: return "Vous n’avez pas l’autorisation d’effectuer cette action.";
    case 404: return "Cette fonction n’est pas disponible sur le serveur (moteur non publié ou route introuvable). Réessayez plus tard.";
    case 408: return "La demande a expiré. Réessayez.";
    case 413: return "Le document est trop volumineux pour être traité.";
    case 415: return "Ce format de fichier n’est pas pris en charge.";
    case 429: return "Quota IA mensuel atteint. Il se réinitialisera le mois prochain, ou passez à un plan supérieur.";
    case 500: return "Une erreur interne est survenue pendant le traitement. Réessayez.";
    case 502: return "Le service IA est momentanément indisponible. Réessayez dans un instant.";
    case 503: return "Le service Readix est momentanément indisponible (configuration ou maintenance). Réessayez dans un instant.";
    case 504: return "Le serveur a mis trop de temps à répondre. Réessayez.";
    default:  return "Impossible d’exécuter l’action (code "+s+"). Réessayez.";
  }
}
function makeApiError(status,serverMsg,ctx,code){
  const e=new Error(humanizeError(status,serverMsg,ctx));
  e.status=status;e.endpoint=ctx&&ctx.endpoint;e.method=ctx&&ctx.method;e.code=code||null;
  e.serverMessage=serverMsg||"";
  e.technical={status,endpoint:e.endpoint,method:e.method,code:e.code||undefined,serverMessage:serverMsg||undefined,at:new Date().toISOString()};
  try{console.error("[Readix API]",e.technical,"→",e.message);}catch(_){}
  return e;
}
async function api(path,body,method){
  const m=method||(body?"POST":"GET");
  const opt={method:m,headers:{"content-type":"application/json"}};
  const t=getToken();if(t)opt.headers.authorization="Bearer "+t;
  if(body)opt.body=JSON.stringify(body);
  let r;
  try{r=await fetch(API_BASE+path,opt);}
  catch(netErr){throw makeApiError(0,netErr&&netErr.message,{endpoint:path,method:m});}
  let data={};try{data=await r.json();}catch(e){}
  if(!r.ok){
    const serverMsg=(data&&(typeof data.error==="string"?data.error:(data.error&&data.error.message)))||data.message||"";
    const code=(data&&data.error&&data.error.code)||data.code||null;
    throw makeApiError(r.status,serverMsg,{endpoint:path,method:m},code);
  }
  return data;
}

}
function openPricing(){
  const dl=dialog(`<h3>Abonnements Readix</h3><p>Choisissez un plan. Le tarif exact est celui configuré dans Stripe. Vous pourrez choisir la périodicité avant le paiement.</p>
  <div style="display:flex;gap:7px;margin:8px 0 12px"><button class="btn ghost sm" id="priceMonth">Mensuel</button><button class="btn ghost sm" id="priceYear">Annuel</button></div>
  <div class="price-grid">
    <div class="price-card"><h4>Gratuit</h4><div class="price">0</div><p>Outils PDF locaux et compte de base.</p><button class="btn ghost sm" disabled>Plan actuel</button></div>
    <div class="price-card"><h4>Standard</h4><div class="price">Selon Stripe</div><p>Fonctions avancées et usage étendu.</p><button class="btn sm" data-plan="standard">Choisir</button></div>
    <div class="price-card"><h4>Pro</h4><div class="price">Selon Stripe</div><p>Fonctions IA avec quota mensuel.</p><button class="btn sm" data-plan="pro">Choisir</button></div>
    <div class="price-card"><h4>Studio</h4><div class="price">Selon Stripe</div><p>Fonctions IA avancées et quota supérieur.</p><button class="btn sm" data-plan="studio">Choisir</button></div>
  </div>`);
  let period='month';
  const setPeriod=p=>{period=p;$('#priceMonth',dl.root).classList.toggle('on',p==='month');$('#priceYear',dl.root).classList.toggle('on',p==='year');};
  $('#priceMonth',dl.root).onclick=()=>setPeriod('month'); $('#priceYear',dl.root).onclick=()=>setPeriod('year'); setPeriod('month');
  $$('.price-card button[data-plan]',dl.root).forEach(b=>b.onclick=async()=>{try{if(!APP.user){dl.close();openAuth('login');return;}b.disabled=true;b.textContent='Ouverture…';const d=await api('/api/billing/checkout',{plan:b.dataset.plan,period});if(d.url)location.href=d.url;else throw new Error(d.error||'Checkout indisponible');}catch(e){b.disabled=false;b.textContent='Choisir';toast(e.message,'err');}});
}
async function restoreSession(){const t=getToken();if(!t)return;try{const d=await api("/api/me");if(d&&d.user){APP.user={name:d.user.name,email:d.user.email};APP.plan=d.user.plan||"free";updateAccount();}}catch(e){clearToken();}}
function openAuth(mode){
  mode=mode||"login";
  const dl=dialog(`<h3>${mode==="signup"?"Créer un compte":"Se connecter"}</h3>
    ${mode==="signup"?'<input id="auName" class="rp-input" placeholder="Nom complet" style="margin-bottom:10px">':''}
    <input id="auEmail" class="rp-input" type="email" placeholder="Adresse e-mail" style="margin-bottom:10px">
    <input id="auPass" class="rp-input" type="password" placeholder="Mot de passe" style="margin-bottom:6px">
    <div id="auErr" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px"></div>
    <div class="row"><button class="btn ghost sm" data-a="switch">${mode==="signup"?"J'ai déjà un compte":"Créer un compte"}</button><button class="btn sm" data-a="go">${mode==="signup"?"Créer mon compte":"Se connecter"}</button></div>`);
  const emailEl=$("#auEmail",dl.root);if(emailEl)setTimeout(()=>emailEl.focus(),50);
  dl.root.addEventListener("keydown",e=>{if(e.key==="Enter"){const g=dl.root.querySelector('[data-a="go"]');if(g)g.click();}});
  dl.root.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;
    if(b.dataset.a==="switch"){dl.close();openAuth(mode==="signup"?"login":"signup");return;}
    if(b.dataset.a==="go"){
      const email=($("#auEmail",dl.root).value||"").trim();const pass=$("#auPass",dl.root).value||"";
      const nameEl=$("#auName",dl.root);const name=nameEl?(nameEl.value||"").trim():"";
      const err=$("#auErr",dl.root);
      if(!email||!pass||(mode==="signup"&&!name)){err.textContent="Veuillez remplir tous les champs.";return;}
      b.disabled=true;err.textContent="";
      try{const path=mode==="signup"?"/api/signup":"/api/login";
        const d=await api(path,mode==="signup"?{name,email,password:pass}:{email,password:pass});
        setToken(d.token);APP.user={name:d.user.name,email:d.user.email};APP.plan=d.user.plan||"free";updateAccount();dl.close();
        COPILOT_STATE.loaded=false;COPILOT_STATE.remote=false;PROJECT_STATE.loaded=false;PROJECT_STATE.remote=false;if(AI_FLOAT_STATE.open&&AI_FLOAT_STATE.mode==="copilot")renderAIFloating();
        initProjectUI();
        toast("Bienvenue "+(d.user.name||d.user.email)+" !","ok");
      }catch(ex){err.textContent=ex.message;b.disabled=false;}
    }
  };
}
function logout(){clearToken();APP.user=null;APP.plan="free";COPILOT_STATE.loaded=false;COPILOT_STATE.remote=false;PROJECT_STATE.loaded=false;PROJECT_STATE.remote=false;PROJECT_STATE.projects=[];PROJECT_STATE.activeId=null;try{localStorage.removeItem("readix_active_project");}catch(e){}updateAccount();try{renderProjectMenu();updateProjectButton();ensureTabScope();}catch(e){}if(AI_FLOAT_STATE.open&&AI_FLOAT_STATE.mode==="copilot")renderAIFloating();toast("Vous êtes déconnecté.","ok");}
$("#umAuth").onclick=()=>{$("#acctMenu").classList.remove("open");openAuth("login");};
$("#umLogout").onclick=()=>{$("#acctMenu").classList.remove("open");logout();};
/* ---------- en-tête, thème, menus, init ---------- */
function updateHeader(){const t=activeTab();$("#docName").textContent=t&&t.pdf?t.name:"";updateSaveDot();
  $("#floatsig").classList.toggle("show",!!(t&&t.tool==="fillsign"&&t.pdf));}
$("#saveBtn").onclick=doSave;
$("#printBtn").onclick=()=>printActiveReadixDocument();
$("#brandHome").onclick=()=>openTool("view");
$("#themeBtn").onclick=()=>{const d=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",d);try{localStorage.setItem("readix_theme",d);}catch(e){}};
try{const th=localStorage.getItem("readix_theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
$("#railMini").onclick=()=>$("#lrail").classList.toggle("mini");
$("#mobMenu").onclick=()=>$("#lrail").classList.toggle("mobopen");
function fixMob(){$("#mobMenu").style.display=window.innerWidth<=860?"grid":"none";}
window.addEventListener("resize",fixMob);fixMob();

/* menus déroulants (Créer, Compte) */
function bindMenu(btn,menu){btn.onclick=e=>{e.stopPropagation();const open=menu.classList.contains("open");$$(".menu.open").forEach(m=>m.classList.remove("open"));if(!open)menu.classList.add("open");};}
bindMenu($("#createBtn"),$("#createMenu"));bindMenu($("#acctBtn"),$("#acctMenu"));
(function(){const pb=$("#projBtn"),pm=$("#projMenu");if(pb&&pm){pb.onclick=e=>{e.stopPropagation();const open=pm.classList.contains("open");$$(".menu.open").forEach(m=>m.classList.remove("open"));if(!open){renderProjectMenu();pm.classList.add("open");}};}})();
$('#umPricing').onclick=()=>{openPricing();};
$("#cbotFab").onclick=()=>toggleCopilotFloating();
$("#aiFloatClose").onclick=()=>closeAIFloating();
$("#aiFloatMin").onclick=()=>toggleAIMin();
$("#aiFloatMax").onclick=()=>toggleAIMax();
document.addEventListener("click",()=>$$(".menu.open").forEach(m=>m.classList.remove("open")));
window.addEventListener("resize",()=>{if(AI_FLOAT_STATE.open&&AI_FLOAT_GEO&&!AI_FLOAT_STATE.minimized&&!AI_FLOAT_STATE.maximized)applyAiGeo();});
document.addEventListener("click",e=>{$$(".ai10-plus-menu.open").forEach(m=>{if(!m.parentElement.contains(e.target))m.classList.remove("open");});});
document.addEventListener("click",e=>{$$(".ai10-chat-menu.open").forEach(m=>{if(!m.parentElement.contains(e.target))m.classList.remove("open");});});
$("#createMenu").onclick=e=>{const b=e.target.closest("[data-create]");if(!b)return;const a=b.dataset.create;
  if(a==="tab"){createTab();openTool("view");}
  else if(a==="doc"){createTab("Nouveau document.docx");openTool("docstudio");}
  else if(a==="blank"){makeBlank();}
  else if(a==="img2pdf"){createTab("Images → PDF");openTool("tolpdf");}
};
async function makeBlank(){try{const {PDFDocument}=PDFLib;const d=await PDFDocument.create();d.addPage([595,842]);const bytes=await d.save();createTab("Nouveau document.pdf");await openPdfBytes(bytes,"Nouveau document.pdf");openTool("editpdf"in{}?"view":"view");}catch(e){}}

/* compte (Phase 1 : local, le back-end arrive en Phase 6) */
updateAccount();
$("#langSel").onchange=e=>{APP.lang=e.target.value;};

/* palette de commande */
$("#cmdInput").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.toLowerCase();const t=TOOLS.find(x=>x.name.toLowerCase().includes(q));if(t)openTool(t.id);}});
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();$("#cmdInput").focus();}
  else if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();doSave();}
  else if(mod&&e.key.toLowerCase()==="o"){e.preventDefault();$("#hiddenFile").click();}
  else if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();printActiveReadixDocument();}
  else if(mod&&!e.shiftKey&&e.key.toLowerCase()==="z"){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editUndo();}}
  else if(mod&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editRedo();}}
});

/* ---------- init ---------- */
$("#rAi").onclick=()=>openAIFloating("__home");
(async function init(){
  createTab();switchTab(APP.active,false);
  try{await restoreSession();}catch(e){}
  try{await offerResume();}catch(e){}
  if(new URLSearchParams(location.search).get("pricing")==="1") setTimeout(openPricing,250);
  updateNavBtns();
  try{await initProjectUI();}catch(e){}
  await initCopilotHistory();
})();
</script>
