<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Readix Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --elevated:#FFFFFF;
  --ink:#0D1220; --ink-soft:#4A5468; --ink-faint:#8992A6;
  --line:#E3E7EF; --line-strong:#D2D8E4;
  --brand:#4F46E5; --brand-2:#6D5CF5; --brand-ink:#3A2FD6; --brand-soft:#ECEBFF; --brand-glow:rgba(79,70,229,.22);
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444; --danger-soft:#FEECEC;
  --field:#3B82F6; --field-bg:rgba(59,130,246,.14);
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(13,18,32,.06),0 1px 3px rgba(13,18,32,.05);
  --shadow:0 4px 12px rgba(13,18,32,.07),0 14px 34px rgba(13,18,32,.10);
  --shadow-lg:0 18px 40px rgba(13,18,32,.16),0 40px 80px rgba(13,18,32,.20);
  --ease:cubic-bezier(.2,.7,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(13,18,32,.08);
  --topbar:54px; --menubar:46px; --tabbar:40px;
}
:root[data-theme="dark"]{
  --bg:#0B0E16; --surface:#141926; --surface-2:#1B2130; --elevated:#1B2130;
  --ink:#EAEEF7; --ink-soft:#AAB3C6; --ink-faint:#6C7590;
  --line:#252C3C; --line-strong:#333B4E;
  --brand:#7C6DFF; --brand-2:#9385FF; --brand-ink:#A99EFF; --brand-soft:#20223A; --brand-glow:rgba(124,109,255,.30);
  --glass:rgba(20,25,38,.72); --glass-line:rgba(255,255,255,.07);
  --field:#5B9BFF; --field-bg:rgba(91,155,255,.16);
  --shadow:0 4px 12px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.grad-text{background:linear-gradient(120deg,var(--brand-2),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:content-box}
/* ===== Barre supérieure ===== */
.topbar{height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line);position:relative;z-index:60}
.brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;cursor:pointer;user-select:none}
.brand .logo{width:30px;height:30px;filter:drop-shadow(0 4px 10px var(--brand-glow))}
.brand .thin{color:var(--ink-faint);font-weight:500}
.ico{width:34px;height:34px;border:none;background:none;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft);transition:background .15s,color .15s}
.ico:hover{background:var(--surface-2);color:var(--ink)}
.ico:disabled{opacity:.35;cursor:default}
.ico svg{width:19px;height:19px}
.nav-arrows{display:flex;gap:2px}
.spring{flex:1}
.docname{font-size:13px;font-weight:600;color:var(--ink-soft);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-dot{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:5px}
.save-dot .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-dot.dirty .d{background:var(--warn)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;font-family:'Space Grotesk',sans-serif;border:none}
.btn{height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px var(--brand-glow);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{border-color:var(--brand);filter:none}
.btn.sm{height:32px;padding:0 13px;font-size:12.5px}
.btn svg{width:15px;height:15px}
/* menu créer */
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);min-width:210px;background:var(--elevated);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:80}
.menu.open{display:block;animation:pop .16s var(--ease-out)}
.menu.right{right:0}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:16px;height:16px;color:var(--ink-soft)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .um-head{padding:9px 11px 4px}
.um-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.um-email{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-badge{display:inline-block;margin:2px 11px 6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink)}
/* ===== Barre de menu (niveau 2) ===== */
.menubar{height:var(--menubar);display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:50}
.mtabs{display:flex;gap:2px}
.mtab{height:34px;padding:0 13px;border:none;background:none;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.mtab:hover{background:var(--surface-2);color:var(--ink)}
.mtab.on{background:var(--brand-soft);color:var(--brand-ink)}
.mtab svg{width:16px;height:16px}
.search{position:relative;flex:1;max-width:440px;margin:0 8px}
.search input{width:100%;height:34px;padding:0 12px 0 35px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);font-size:13px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-glow)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
.search .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px}
/* ===== Barre d'onglets ===== */
.tabbar{height:var(--tabbar);display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-x:auto}
.wtab{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;max-width:210px;flex:none}
.wtab.on{color:var(--ink);border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-glow)}
.wtab .nm{overflow:hidden;text-overflow:ellipsis}
.wtab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink-faint);font-size:13px}
.wtab .x:hover{background:var(--surface-2);color:var(--ink)}
.tab-new{width:30px;height:30px;border:1px dashed var(--line-strong);background:none;border-radius:9px;color:var(--ink-soft);display:grid;place-items:center;flex:none}
.tab-new:hover{border-color:var(--brand);color:var(--brand)}
/* ===== Corps : rails + document ===== */
.body{display:flex;height:calc(100vh - var(--topbar) - var(--menubar) - var(--tabbar))}
.lrail{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s var(--ease)}
.lrail-head{display:flex;align-items:center;padding:14px 16px 6px}
.lrail-head h2{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}
.lrail-head .ico{margin-left:auto;width:28px;height:28px}
.lrail-scroll{flex:1;overflow-y:auto;padding:2px 10px 12px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:12px 10px 5px}
.tool{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:none;background:none;border-radius:10px;text-align:left;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .14s}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.tool .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.tool.on .ic{background:var(--surface)}
.tool .ic svg{width:17px;height:17px;color:var(--brand)}
.tool .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrail.mini{width:62px}
.lrail.mini .lb,.lrail.mini .grp,.lrail.mini h2{display:none}
.lrail.mini .tool{justify-content:center;padding:8px 0}
/* zone document */
.stage{flex:1;position:relative;overflow:auto;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 82%, #000 4%))}
.stage.empty{display:grid;place-items:center}
.opener{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:20px;padding:48px 44px;text-align:center;max-width:460px;cursor:pointer;transition:.2s}
.opener:hover{border-color:var(--brand);background:var(--brand-soft)}
.opener .big{width:52px;height:52px;color:var(--brand);margin-bottom:16px}
.opener h3{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-bottom:7px}
.opener p{font-size:14px;color:var(--ink-soft);margin-bottom:20px;max-width:340px}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
.page{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:3px}
.page canvas{display:block;border-radius:3px;pointer-events:none}
/* couche champs (Remplir & Signer) */
.flayer{position:absolute;inset:0;pointer-events:none}
.field{position:absolute;box-sizing:border-box;border:1px solid var(--field);background:var(--field-bg);border-radius:2px;font-family:inherit;color:#0A2540;padding:0 3px;pointer-events:auto;outline:none;transition:background .12s}
.field:hover{background:color-mix(in srgb,var(--field) 30%, transparent)}
.field:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-glow);z-index:5}
textarea.field{resize:none;overflow:hidden;line-height:1.15}
.fcheck{position:absolute;box-sizing:border-box;pointer-events:auto;margin:0;accent-color:var(--brand);cursor:pointer;z-index:3}
/* barre d'action d'outil */
.actionbar{position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:14px auto 0;max-width:900px;box-shadow:var(--shadow-sm)}
.actionbar .info{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.actionbar .sp{flex:1}
/* ===== Rail droit ===== */
.rrail{width:52px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rrail .ico{width:38px;height:38px}
.rrail .ico.on{background:var(--brand-soft);color:var(--brand-ink)}
.rrail .ai{width:38px;height:38px;border:none;border-radius:11px;background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px var(--brand-glow);margin-bottom:4px}
.rrail .spring{flex:1}
.rzoom{display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.rzoom button{width:34px;height:30px;border:none;background:none;color:var(--ink-soft);font-size:16px}
.rzoom button:hover{background:var(--surface);color:var(--ink)}
.rzoom .z{font-size:10px;color:var(--ink-faint);font-weight:600;padding:2px 0}
/* panneau droit */
.rpanel{position:absolute;right:52px;top:0;bottom:0;width:246px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(13,18,32,.06);z-index:40;transform:translateX(105%);transition:transform .22s var(--ease);display:flex;flex-direction:column}
.rpanel.open{transform:none}
.rpanel-head{display:flex;align-items:center;padding:14px 14px 8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.rpanel-head .ico{margin-left:auto;width:28px;height:28px}
.rpanel-body{flex:1;overflow-y:auto;padding:8px 12px 16px}
.rp-empty{color:var(--ink-faint);font-size:13px;padding:20px 6px;text-align:center}
.thumb{position:relative;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff}
.thumb:hover{border-color:var(--brand)}
.thumb canvas{width:100%;display:block}
.thumb .n{position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;opacity:.85}
.rp-input{width:100%;height:34px;padding:0 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);font-size:13px;color:var(--ink);margin-bottom:10px}
.rp-input:focus{outline:none;border-color:var(--brand)}
.rp-res{padding:9px 11px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.rp-res:hover{background:var(--surface-2);color:var(--ink)}
/* ===== toasts + modales ===== */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:300}
.toast{background:var(--elevated);border:1px solid var(--line-strong);border-left:3px solid var(--brand);border-radius:11px;box-shadow:var(--shadow-lg);padding:12px 15px;font-size:13.5px;min-width:220px;max-width:340px;animation:slidein .2s var(--ease-out)}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(13,18,32,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:250;padding:20px}
.overlay.open{display:grid}
.dialog{background:var(--elevated);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px;max-width:420px;width:100%;animation:pop .2s var(--ease-out)}
.dialog h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--ink-soft);line-height:1.55;margin-bottom:20px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.spin{width:14px;height:14px;border:2px solid var(--brand-glow);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.floatsig{position:fixed;right:18px;bottom:86px;width:190px;background:var(--elevated);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;display:none}
.floatsig.show{display:block}
.floatsig h4{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:11px 12px 6px}
.floatsig .list{max-height:220px;overflow-y:auto;padding:0 10px}
.sigitem{position:relative;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;cursor:grab}
.sigitem img{width:100%;display:block;border-radius:9px}
.sigitem .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:12px}
.floatsig .add{margin:6px 10px 12px;width:calc(100% - 20px)}
/* éléments déplaçables (signature, édition) */
.movEl{position:absolute;box-sizing:border-box}
.movEl.selEl{outline:2px solid var(--brand);outline-offset:1px}
.movH{position:absolute;width:12px;height:12px;background:var(--brand);border:2px solid #fff;border-radius:50%;pointer-events:auto;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.3);display:none}
.movEl.selEl .movH{display:block}
.movEl:hover .movH{display:block}
.movDel{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border:2px solid #fff;background:var(--danger);color:#fff;border-radius:50%;font-size:11px;display:none;place-items:center;pointer-events:auto;z-index:11}
.movEl.selEl .movDel,.movEl:hover .movDel{display:grid}
/* barre d'édition (Modifier) */
.edbar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:14px auto 0;max-width:940px;box-shadow:var(--shadow-sm)}
.edmode{height:32px;padding:0 11px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.edmode:hover{color:var(--ink)}
.edmode.on{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand)}
.edmode svg{width:15px;height:15px}
.edbar .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.edbar select,.edbar .swrap{height:32px;border:1px solid var(--line-strong);border-radius:9px;font-size:12.5px;background:var(--surface-2);color:var(--ink)}
.edbar select{padding:0 6px}
.swatches{display:flex;gap:4px;align-items:center}
.swatch{width:20px;height:20px;border-radius:5px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.edbar input[type=color]{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:8px;background:none;padding:2px}
.edtext{outline:none;overflow:hidden;padding:2px 4px;min-width:30px;min-height:20px;cursor:move}
.edshape{width:100%;height:100%}
@media(max-width:860px){.lrail{position:fixed;left:0;top:calc(var(--topbar) + var(--menubar) + var(--tabbar));bottom:0;z-index:70;transform:translateX(-105%);box-shadow:var(--shadow-lg)}.lrail.mobopen{transform:none}.rrail{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <button class="ico mob-menu" id="mobMenu" title="Menu" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand" id="brandHome"><span class="logo"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5CF5"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)"/><path d="M11 23V9h6.2c2.7 0 4.3 1.5 4.3 3.9 0 1.8-.9 3.1-2.5 3.6l2.9 6.5h-3.1l-2.5-5.9h-2.5V23H11zm2.8-8.2h3c1.2 0 1.9-.6 1.9-1.7s-.7-1.7-1.9-1.7h-3v3.4z" fill="#fff"/></svg></span>Readix <span class="thin">Reader</span></div>
  <div class="nav-arrows">
    <button class="ico" id="navBack" title="Précédent" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};

/* ---------- toasts & dialogues ---------- */
function toast(msg,type){const t=el("div","toast"+(type?" "+type:""),msg);$("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(20px)";setTimeout(()=>t.remove(),250);},2600);}
function dialog(html){const o=$("#overlay"),d=$("#dialog");d.innerHTML=html;o.classList.add("open");return {close:()=>o.classList.remove("open"),root:d};}
function confirmSave(){
  return new Promise(res=>{
    const dl=dialog(`<h3>Enregistrer les modifications ?</h3><p>Votre document a été modifié. Voulez-vous enregistrer avant de continuer ?</p><div class="row"><button class="btn ghost sm" data-a="cancel">Annuler</button><button class="btn ghost sm" data-a="no">Ne pas enregistrer</button><button class="btn sm" data-a="yes">Enregistrer</button></div>`);
    dl.root.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;dl.close();res(a.dataset.a);};
  });
}

/* ---------- IndexedDB (autosave) ---------- */
let _db=null;
function idb(){return new Promise((res,rej)=>{ if(_db)return res(_db);
  const r=indexedDB.open("readix",1);
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("tabs"))db.createObjectStore("tabs",{keyPath:"id"});};
  r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);
});}
async function idbSave(id,state){try{const db=await idb();const tx=db.transaction("tabs","readwrite");tx.objectStore("tabs").put({id,...state,ts:Date.now()});}catch(e){}}
async function idbLoad(id){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("tabs").objectStore("tabs").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
async function idbAll(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("tabs").objectStore("tabs").getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}catch(e){return [];}}
async function idbDel(id){try{const db=await idb();db.transaction("tabs","readwrite").objectStore("tabs").delete(id);}catch(e){}}

/* ---------- état global ---------- */
const APP={ tabs:[], active:null, tool:"home", theme:"light", lang:"fr",
  user:null, plan:"free" };
function activeTab(){return APP.tabs.find(t=>t.id===APP.active)||null;}
function newTabObj(name){return {id:"t"+Date.now()+Math.floor(Math.random()*1e3),name:name||"Nouvel onglet",bytes:null,pdf:null,tool:"home",page:1,zoom:1,fields:[],sigs:[],dirty:false};}

/* ---------- helpers PDF ---------- */
async function readAB(file){return await file.arrayBuffer();}
function u8(ab){return ab instanceof Uint8Array?ab:new Uint8Array(ab);}
/* ---------- onglets ---------- */
function renderTabs(){
  const bar=$("#tabbar");bar.innerHTML="";
  APP.tabs.forEach(t=>{
    const w=el("div","wtab"+(t.id===APP.active?" on":""));
    w.append(el("span","nm",t.name));
    const x=el("span","x","✕");x.title="Fermer";
    x.onclick=e=>{e.stopPropagation();closeTab(t.id);};
    w.append(x);
    w.onclick=()=>switchTab(t.id);
    bar.appendChild(w);
  });
  const add=el("button","tab-new","+");add.title="Nouvel onglet";add.onclick=()=>{createTab();};
  bar.appendChild(add);
}
function createTab(name){const t=newTabObj(name);APP.tabs.push(t);switchTab(t.id,true);return t;}
function switchTab(id,push){
  APP.active=id;const t=activeTab();if(!t)return;
  APP.tool=t.tool||"home";
  renderTabs();renderTools();renderView();updateHeader();
  if(push!==false)pushHist();
}
async function closeTab(id){
  const t=APP.tabs.find(x=>x.id===id);if(!t)return;
  if(t.dirty){const a=await confirmSave();if(a==="cancel")return;if(a==="yes"){APP.active=id;await doSave();}}
  await idbDel(id);
  const i=APP.tabs.findIndex(x=>x.id===id);APP.tabs.splice(i,1);
  if(APP.active===id){APP.active=APP.tabs.length?APP.tabs[Math.max(0,i-1)].id:null;}
  if(!APP.tabs.length){createTab();}else{switchTab(APP.active);}
}
function markDirty(){const t=activeTab();if(!t)return;t.dirty=true;updateSaveDot();scheduleAutosave();}
function updateSaveDot(){const t=activeTab();const dot=$("#saveDot");if(!t||!t.bytes){dot.style.display="none";return;}dot.style.display="flex";dot.classList.toggle("dirty",!!t.dirty);$(".t",dot).textContent=t.dirty?"Non enregistré":"Enregistré";}

/* ---------- autosave ---------- */
let _asTimer=null;
function scheduleAutosave(){clearTimeout(_asTimer);_asTimer=setTimeout(autosave,900);}
async function autosave(){
  const t=activeTab();if(!t||!t.bytes)return;
  const fieldVals=t.fields?t.fields.map(f=>({name:f.name,type:f.type,val:f.el?(f.el.type==="checkbox"||f.el.type==="radio"?f.el.checked:f.el.value):null,ex:f.ex})):[];
  await idbSave(t.id,{name:t.name,tool:t.tool,page:t.page,zoom:t.zoom,bytes:Array.from(u8(t.bytes)),fieldVals});
  const dot=$("#saveDot");if(dot)$(".t",dot).textContent="Enregistré";
}
async function offerResume(){
  const all=await idbAll();if(!all.length)return;
  const dl=dialog(`<h3>Reprendre votre travail ?</h3><p>${all.length} document(s) de votre dernière session ont été retrouvés. Voulez-vous les rouvrir ?</p><div class="row"><button class="btn ghost sm" data-a="no">Ignorer</button><button class="btn sm" data-a="yes">Reprendre</button></div>`);
  dl.root.onclick=async e=>{const a=e.target.closest("[data-a]");if(!a)return;dl.close();
    if(a.dataset.a==="no"){for(const s of all)await idbDel(s.id);return;}
    for(const s of all){ try{
      const t=newTabObj(s.name);t.id=s.id;t.bytes=new Uint8Array(s.bytes);t.tool=s.tool||"home";
      t._resumeFields=s.fieldVals||[];
      APP.tabs.push(t);
    }catch(e){} }
    if(APP.tabs.length){switchTab(APP.tabs[APP.tabs.length-1].id);}
  };
}

/* ---------- historique interne (précédent/suivant) ---------- */
function pushHist(){try{history.pushState({tab:APP.active,tool:APP.tool},"","#"+(APP.tool||"home"));}catch(e){}updateNavBtns();}
window.addEventListener("popstate",e=>{const s=e.state;if(!s)return;if(s.tab&&APP.tabs.find(t=>t.id===s.tab)){APP.active=s.tab;const t=activeTab();if(t){APP.tool=s.tool||"home";t.tool=APP.tool;}renderTabs();renderTools();renderView();updateHeader();}updateNavBtns();});
function updateNavBtns(){/* les boutons ← → utilisent history.back/forward */}
$("#navBack").onclick=()=>history.back();
$("#navFwd").onclick=()=>history.forward();

/* ---------- protection perte de données ---------- */
window.addEventListener("beforeunload",e=>{if(APP.tabs.some(t=>t.dirty)){e.preventDefault();e.returnValue="";}});

/* ---------- enregistrement (pipeline unique) ---------- */
async function saveBytes(bytes,suggestedName){
  try{
    if(window.showSaveFilePicker){
      const h=await window.showSaveFilePicker({suggestedName,types:[{description:"PDF",accept:{"application/pdf":[".pdf"]}}]});
      const w=await h.createWritable();await w.write(bytes);await w.close();return true;
    }
  }catch(e){if(e&&e.name==="AbortError")return false;}
  const name=(prompt("Nom du fichier :",suggestedName)||suggestedName);
  const blob=new Blob([bytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name.endsWith(".pdf")?name:name+".pdf";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
async function doSave(){
  const t=activeTab();if(!t||!t.bytes){toast("Aucun document à enregistrer.","warn");return;}
  if(t.tool==="editpdf"){return doSaveEdit(t);}
  let out=u8(t.bytes);
  try{ if(t.tool==="fillsign") out=await fillsignExport(t); }catch(e){}
  const ok=await saveBytes(out,(t.name||"document").replace(/\.pdf$/i,"")+"-readix.pdf");
  if(ok){t.dirty=false;updateSaveDot();toast("Document enregistré.","ok");}
}
/* ---------- rendu net (haute résolution) ---------- */
async function renderPageTo(page,scale,container,cls){
  const dpr=Math.max(2,window.devicePixelRatio||1);
  const vp=page.getViewport({scale});
  const wrap=el("div",cls||"page");wrap.style.width=vp.width+"px";wrap.style.height=vp.height+"px";wrap.dataset.page=page.pageNumber;
  const cv=el("canvas");cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);cv.style.width=vp.width+"px";cv.style.height=vp.height+"px";
  const ctx=cv.getContext("2d",{alpha:false});ctx.scale(dpr,dpr);
  wrap.appendChild(cv);container.appendChild(wrap);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return {wrap,vp};
}

/* ---------- ouvrir un PDF dans l'onglet actif ---------- */
async function openPdfBytes(bytes,name){
  let t=activeTab();
  if(!t){t=createTab(name);} 
  t.bytes=u8(bytes);t.name=name||t.name;
  try{ t.pdf=await pdfjsLib.getDocument({data:u8(bytes).slice(0)}).promise; }catch(e){toast("PDF illisible.","err");return;}
  if(t.tool==="home")t.tool="view";
  APP.tool=t.tool;
  renderTabs();renderTools();renderView();updateHeader();
  scheduleAutosave();
}
$("#hiddenFile").onchange=async e=>{const f=e.target.files[0];if(f){await openPdfBytes(await readAB(f),f.name);}e.target.value="";};

/* ---------- vue centrale ---------- */
async function ensurePdf(t){ if(t&&t.bytes&&!t.pdf){ try{ t.pdf=await pdfjsLib.getDocument({data:u8(t.bytes).slice(0)}).promise; }catch(e){} } }
async function renderView(){
  const stage=$("#stage");stage.innerHTML="";stage.classList.remove("empty");
  const t=activeTab();
  if(t&&t.bytes&&!t.pdf){
    stage.classList.add("empty");
    const ld=el("div","opener");ld.style.cursor="default";ld.innerHTML='<div class="spin" style="width:26px;height:26px;border-width:3px"></div><h3 style="margin-top:14px">Chargement…</h3>';
    stage.appendChild(ld);
    await ensurePdf(t);
    stage.innerHTML="";stage.classList.remove("empty");
  }
  if(!t||!t.pdf){
    stage.classList.add("empty");
    const op=el("div","opener");
    op.innerHTML=`<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><h3>Ouvrez un document</h3><p>Glissez un PDF ici, ou cliquez pour le choisir. Tout se passe dans votre navigateur.</p><button class="btn">Ouvrir un PDF</button>`;
    op.onclick=()=>$("#hiddenFile").click();
    stage.appendChild(op);
    stage.ondragover=e=>e.preventDefault();
    stage.ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type==="application/pdf")await openPdfBytes(await readAB(f),f.name);};
    return;
  }
  if(t.tool==="fillsign"){ return renderFillSign(t,stage); }
  if(t.tool==="editpdf"){ return renderEditPdf(t,stage); }
  if(t.tool==="organize"){ return renderOrganize(t,stage); }
  if(t.tool==="split"){ return renderSplit(t,stage); }
  if(t.tool==="merge"){ return renderMerge(t,stage); }
  renderReader(t,stage); // Lecteur par défaut
}

async function renderReader(t,stage){
  const pages=el("div","pages");stage.appendChild(pages);
  const scale=1.4*(t.zoom||1);
  for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);await renderPageTo(p,scale,pages);}
  stage.onscroll=()=>trackPage(t,stage);
}
function trackPage(t,stage){let cur=1;$$(".page",stage).forEach(p=>{if(p.getBoundingClientRect().top<window.innerHeight*0.5)cur=+p.dataset.page;});t.page=cur;}

/* ---------- zoom ---------- */
function setZoom(d){const t=activeTab();if(!t||!t.pdf)return;t.zoom=Math.max(0.5,Math.min(2.4,(t.zoom||1)+d));$("#zVal").textContent=Math.round(t.zoom*100)+"%";renderView();}
$("#zIn").onclick=()=>setZoom(0.15);$("#zOut").onclick=()=>setZoom(-0.15);

/* ---------- rail droit (panneaux réels) ---------- */
let curPanel=null;
$$(".rrail .ico[data-panel]").forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel,b));
$("#rpClose").onclick=()=>{$("#rpanel").classList.remove("open");curPanel=null;$$(".rrail .ico").forEach(x=>x.classList.remove("on"));};
function togglePanel(name,btn){
  if(curPanel===name){$("#rpanel").classList.remove("open");curPanel=null;btn.classList.remove("on");return;}
  curPanel=name;$$(".rrail .ico").forEach(x=>x.classList.remove("on"));if(btn)btn.classList.add("on");
  $("#rpanel").classList.add("open");fillPanel(name);
}
async function fillPanel(name){
  const t=activeTab();const body=$("#rpBody");$("#rpTitle").textContent={thumbs:"Pages",outline:"Signets",search:"Recherche",info:"Informations"}[name]||"Panneau";
  body.innerHTML="";
  if(!t||!t.pdf){body.innerHTML='<p class="rp-empty">Ouvrez d\'abord un document.</p>';return;}
  if(name==="thumbs"){
    for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const vp=p.getViewport({scale:0.3});
      const th=el("div","thumb");const cv=el("canvas");cv.width=vp.width;cv.height=vp.height;
      await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      th.appendChild(cv);th.appendChild(el("span","n",i));th.onclick=()=>jumpToPage(i);body.appendChild(th);}
  } else if(name==="outline"){
    let ol=[];try{ol=await t.pdf.getOutline();}catch(e){}
    if(!ol||!ol.length){body.innerHTML='<p class="rp-empty">Aucun signet dans ce document.</p>';return;}
    ol.forEach(o=>{const r=el("div","rp-res",o.title);r.onclick=async()=>{try{const d=await t.pdf.getDestination(o.dest)||o.dest;const idx=await t.pdf.getPageIndex(Array.isArray(d)?d[0]:d);jumpToPage(idx+1);}catch(e){}};body.appendChild(r);});
  } else if(name==="search"){
    const inp=el("input","rp-input");inp.placeholder="Mot à trouver…";const res=el("div");body.append(inp,res);
    inp.oninput=async()=>{const q=inp.value.trim().toLowerCase();res.innerHTML="";if(!q)return;
      for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const txt=(await p.getTextContent()).items.map(x=>x.str).join(" ").toLowerCase();
        if(txt.includes(q)){const r=el("div","rp-res","Page "+i);r.onclick=()=>jumpToPage(i);res.appendChild(r);}}
      if(!res.children.length)res.innerHTML='<p class="rp-empty">Aucun résultat.</p>';};
    inp.focus();
  } else if(name==="info"){
    let meta={};try{meta=(await t.pdf.getMetadata()).info||{};}catch(e){}
    body.innerHTML=`<div class="rp-res" style="cursor:default">Pages : ${t.pdf.numPages}</div><div class="rp-res" style="cursor:default">Titre : ${meta.Title||"—"}</div><div class="rp-res" style="cursor:default">Auteur : ${meta.Author||"—"}</div><div class="rp-res" style="cursor:default">Producteur : ${meta.Producer||"—"}</div>`;
  }
}
function jumpToPage(i){const stage=$("#stage");const p=$$(".page,.fpage",stage).find(x=>+x.dataset.page===i);if(p)p.scrollIntoView({behavior:"smooth",block:"start"});}

/* ---------- Remplir & Signer : vrais champs AcroForm ---------- */
async function renderFillSign(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const bar=el("div","actionbar");const info=el("span","info");const sp=el("span","sp");
  const sign=el("button","btn ghost sm","✍ Signature");sign.onclick=()=>{ $("#floatsig").classList.add("show"); openSignaturePad(); };
  const save=el("button","btn sm","Enregistrer le PDF rempli");save.onclick=doSave;
  bar.append(info,sp,sign,save);stage.appendChild(bar);
  const pages=el("div","pages");stage.appendChild(pages);
  t.fields=[];let n=0;const scale=1.5*(t.zoom||1);
  for(let i=1;i<=t.pdf.numPages;i++){
    const p=await t.pdf.getPage(i);const {wrap,vp}=await renderPageTo(p,scale,pages,"page fpage");
    const layer=el("div","flayer");wrap.appendChild(layer);
    let anns=[];try{anns=await p.getAnnotations();}catch(e){}
    anns.forEach(a=>{ if(a.subtype!=="Widget")return; try{
      const r=vp.convertToViewportRectangle(a.rect);
      const left=Math.min(r[0],r[2]),top=Math.min(r[1],r[3]),w=Math.abs(r[2]-r[0]),h=Math.abs(r[3]-r[1]);
      if(a.fieldType==="Tx"){
        const inp=a.multiLine?el("textarea","field"):el("input","field");if(!a.multiLine)inp.type="text";
        Object.assign(inp.style,{left:left+"px",top:top+"px",width:Math.max(w,26)+"px",height:Math.max(h,15)+"px",fontSize:Math.max(9,Math.min(16,h*0.6))+"px"});
        if(a.fieldValue!=null)inp.value=a.fieldValue;if(a.readOnly)inp.disabled=true;
        inp.oninput=markDirty;layer.appendChild(inp);t.fields.push({name:a.fieldName,type:"text",el:inp});n++;
      } else if(a.fieldType==="Btn"){
        const ex=(a.exportValue||a.buttonValue||"Yes");const sz=Math.max(10,Math.min(w,h));
        if(a.radioButton){const rb=el("input","fcheck");rb.type="radio";rb.name="rg_"+i+"_"+a.fieldName;
          Object.assign(rb.style,{left:left+"px",top:top+"px",width:sz+"px",height:sz+"px"});
          if(a.fieldValue&&a.fieldValue===ex)rb.checked=true;rb.onchange=markDirty;
          layer.appendChild(rb);t.fields.push({name:a.fieldName,type:"radio",el:rb,ex});n++;
        } else if(!a.pushButton){const cb=el("input","fcheck");cb.type="checkbox";
          Object.assign(cb.style,{left:left+"px",top:top+"px",width:sz+"px",height:sz+"px"});
          if(a.fieldValue&&a.fieldValue!=="Off")cb.checked=true;cb.onchange=markDirty;
          layer.appendChild(cb);t.fields.push({name:a.fieldName,type:"check",el:cb});n++;}
      } else if(a.fieldType==="Ch"){
        const sc=el("select","field");Object.assign(sc.style,{left:left+"px",top:top+"px",width:w+"px",height:h+"px"});
        (a.options||[]).forEach(o=>{const op=el("option");op.value=o.exportValue!=null?o.exportValue:o.displayValue;op.textContent=o.displayValue;sc.appendChild(op);});
        if(a.fieldValue)sc.value=Array.isArray(a.fieldValue)?a.fieldValue[0]:a.fieldValue;sc.onchange=markDirty;
        layer.appendChild(sc);t.fields.push({name:a.fieldName,type:"choice",el:sc});n++;
      }
    }catch(e){} });
    // signatures déjà posées (reprise)
  }
  // reprise des valeurs autosave
  if(t._resumeFields){t._resumeFields.forEach(fv=>{const f=t.fields.find(x=>x.name===fv.name&&x.type===fv.type);if(f){if(f.el.type==="checkbox"||f.el.type==="radio")f.el.checked=fv.val;else f.el.value=fv.val||"";}});t._resumeFields=null;}
  info.textContent=n>0?("Champs détectés : "+n+" — cliquez pour remplir"):"Aucun champ de formulaire. (Un mode saisie libre viendra en Phase 2.)";
  $("#floatsig").classList.add("show");
}
async function fillsignExport(t){
  const {PDFDocument}=PDFLib;const doc=await PDFDocument.load(u8(t.bytes).slice(0));const form=doc.getForm();
  (t.fields||[]).forEach(f=>{try{
    if(f.type==="text")form.getTextField(f.name).setText(f.el.value||"");
    else if(f.type==="check"){const c=form.getCheckBox(f.name);f.el.checked?c.check():c.uncheck();}
    else if(f.type==="radio"){if(f.el.checked)form.getRadioGroup(f.name).select(f.ex);}
    else if(f.type==="choice"){try{form.getDropdown(f.name).select(f.el.value);}catch(e){form.getOptionList(f.name).select(f.el.value);}}
  }catch(e){}});
  // incruster les signatures posées
  for(const s of (t.sigs||[])){try{
    const png=await doc.embedPng(s.url);const pg=doc.getPage(s.page-1);const {height}=pg.getSize();
    pg.drawImage(png,{x:s.xPt,y:height-s.yPt-s.hPt,width:s.wPt,height:s.hPt});
  }catch(e){}}
  return await doc.save();
}
function renderOpenerInto(stage,t){stage.classList.add("empty");const op=el("div","opener");op.innerHTML='<h3>Ouvrez un formulaire</h3><p>Chargez un PDF pour le remplir et le signer.</p><button class="btn">Ouvrir un PDF</button>';op.onclick=()=>$("#hiddenFile").click();stage.appendChild(op);}

/* ---------- Signatures (palette flottante fixe) ---------- */
let SIGS=[];
$("#sigAdd").onclick=openSignaturePad;
function openSignaturePad(){
  const dl=dialog(`<h3>Créer une signature</h3><p>Dessinez votre signature ci-dessous.</p><canvas id="sigpad" width="380" height="150" style="width:100%;height:150px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;touch-action:none"></canvas><div class="row" style="margin-top:16px"><button class="btn ghost sm" data-a="clear">Effacer</button><button class="btn ghost sm" data-a="cancel">Annuler</button><button class="btn sm" data-a="ok">Ajouter</button></div>`);
  const cv=$("#sigpad",dl.root);const ctx=cv.getContext("2d");ctx.lineWidth=2.5;ctx.lineCap="round";ctx.strokeStyle="#111";let drawing=false,has=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=(e.touches?e.touches[0]:e);return {x:(p.clientX-r.left)*(cv.width/r.width),y:(p.clientY-r.top)*(cv.height/r.height)};};
  cv.onpointerdown=e=>{drawing=true;has=true;const q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);};
  cv.onpointermove=e=>{if(!drawing)return;const q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke();};
  window.addEventListener("pointerup",()=>drawing=false);
  dl.root.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;
    if(a.dataset.a==="clear"){ctx.clearRect(0,0,cv.width,cv.height);has=false;return;}
    if(a.dataset.a==="cancel"){dl.close();return;}
    if(a.dataset.a==="ok"){if(!has){toast("Dessinez d'abord votre signature.","warn");return;}addSig(cv.toDataURL("image/png"));dl.close();}
  };
}
function addSig(url){SIGS.push(url);renderSigList();$("#floatsig").classList.add("show");toast("Signature ajoutée — glissez-la sur le document.","ok");}
function renderSigList(){
  const list=$("#sigList");list.innerHTML="";
  SIGS.forEach((url,i)=>{const it=el("div","sigitem");it.draggable=true;
    it.innerHTML=`<img src="${url}"><button class="del">✕</button>`;
    $(".del",it).onclick=()=>{SIGS.splice(i,1);renderSigList();};
    it.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",url));
    it.addEventListener("dblclick",()=>placeSig(url));
    list.appendChild(it);});
}
function placeSig(url){
  const t=activeTab();if(!t||!t.pdf){toast("Ouvrez un document d'abord.","warn");return;}
  const stage=$("#stage");const pg=$$(".fpage,.page",stage)[Math.max(0,(t.page||1)-1)]||$(".fpage,.page",stage);
  if(!pg){toast("Passez en Remplir & Signer.","warn");return;}
  dropSigOnPage(url,pg,60,60);
}
/* glisser-déposer d'une signature sur une page */
document.addEventListener("dragover",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("text/plain"))e.preventDefault();});
document.addEventListener("drop",e=>{
  const url=e.dataTransfer?e.dataTransfer.getData("text/plain"):"";if(!url||!url.startsWith("data:image"))return;
  const pg=e.target.closest(".fpage,.page");if(!pg)return;e.preventDefault();
  const r=pg.getBoundingClientRect();dropSigOnPage(url,pg,e.clientX-r.left-70,e.clientY-r.top-25);
});
function dropSigOnPage(url,pg,x,y){
  const t=activeTab();let layer=$(".flayer",pg);if(!layer){layer=el("div","flayer");pg.appendChild(layer);}
  const item=el("div","movEl");
  item.style.cssText=`position:absolute;left:${Math.max(0,x)}px;top:${Math.max(0,y)}px;width:150px;height:56px;pointer-events:auto`;
  const img=el("img");img.src=url;img.style.cssText="width:100%;height:100%;object-fit:contain;pointer-events:none;display:block";item.appendChild(img);
  layer.appendChild(item);
  const rec={url,page:+pg.dataset.page,el:item};(t.sigs=t.sigs||[]).push(rec);
  const del=el("button","movDel","✕");del.onclick=e=>{e.stopPropagation();item.remove();const i=t.sigs.indexOf(rec);if(i>=0)t.sigs.splice(i,1);markDirty();};item.appendChild(del);
  makeMovable(item,pg,()=>{finalizeSig(rec,pg);});
  finalizeSig(rec,pg);markDirty();
}
function finalizeSig(rec,pg){
  const scale=1.5*(activeTab().zoom||1);
  rec.xPt=parseFloat(rec.el.style.left)/scale;rec.yPt=parseFloat(rec.el.style.top)/scale;
  rec.wPt=rec.el.offsetWidth/scale;rec.hPt=rec.el.offsetHeight/scale;markDirty();
}

/* ---------- Fusionner ---------- */
function renderMerge(t,stage){
  const bar=el("div","actionbar");bar.innerHTML='<span class="info">Ajoutez plusieurs PDF, réordonnez, puis fusionnez.</span><span class="sp"></span>';
  const add=el("button","btn ghost sm","+ Ajouter des PDF");const go=el("button","btn sm","Fusionner et enregistrer");
  bar.append(add,go);stage.appendChild(bar);
  const grid=el("div");grid.style.cssText="display:flex;flex-wrap:wrap;gap:14px;padding:20px;max-width:900px;margin:0 auto";stage.appendChild(grid);
  const files=[];
  const fi=el("input");fi.type="file";fi.accept="application/pdf";fi.multiple=true;fi.hidden=true;stage.appendChild(fi);
  add.onclick=()=>fi.click();
  fi.onchange=async()=>{for(const f of fi.files){const ab=await readAB(f);files.push({name:f.name,bytes:new Uint8Array(ab)});}fi.value="";draw();};
  function draw(){grid.innerHTML="";files.forEach((f,i)=>{const c=el("div");c.style.cssText="width:130px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--shadow-sm)";
    c.innerHTML=`<div style="font-size:26px;font-weight:700;color:var(--brand);font-family:'Space Grotesk'">${i+1}</div><div style="font-size:11.5px;color:var(--ink-soft);margin:6px 0;word-break:break-word">${f.name}</div>`;
    const rowc=el("div");rowc.style.cssText="display:flex;gap:5px;justify-content:center";
    const up=el("button","ico");up.innerHTML="↑";up.onclick=()=>{if(i>0){[files[i-1],files[i]]=[files[i],files[i-1]];draw();}};
    const dn=el("button","ico");dn.innerHTML="↓";dn.onclick=()=>{if(i<files.length-1){[files[i+1],files[i]]=[files[i],files[i+1]];draw();}};
    const rm=el("button","ico");rm.innerHTML="✕";rm.onclick=()=>{files.splice(i,1);draw();};
    rowc.append(up,dn,rm);c.appendChild(rowc);grid.appendChild(c);});}
  go.onclick=async()=>{ if(files.length<2){toast("Ajoutez au moins 2 PDF.","warn");return;}
    try{const {PDFDocument}=PDFLib;const out=await PDFDocument.create();
      for(const f of files){const src=await PDFDocument.load(f.bytes.slice(0));const cp=await out.copyPages(src,src.getPageIndices());cp.forEach(p=>out.addPage(p));}
      await saveBytes(await out.save(),"fusion-readix.pdf");toast("PDF fusionné.","ok");
    }catch(e){toast("Erreur : "+e.message,"err");}};
}

/* ---------- déplacement + redimensionnement (partagé) ---------- */
let _sel=null;
function selectEl(item){if(_sel&&_sel!==item)_sel.classList.remove("selEl");_sel=item;item.classList.add("selEl");}
function setGeo(it,g){it.style.left=g.left;it.style.top=g.top;if(g.width)it.style.width=g.width;if(g.height)it.style.height=g.height;}
function makeMovable(item,page,onchange){
  item.classList.add("movEl");
  [["nw",0,0],["ne",1,0],["sw",0,1],["se",1,1]].forEach(([n,rx,ry])=>{
    const h=el("div","movH");h.dataset.rx=rx;h.dataset.ry=ry;
    h.style[rx?"right":"left"]="-6px";h.style[ry?"bottom":"top"]="-6px";
    h.style.cursor=((rx===ry)?"nwse":"nesw")+"-resize";
    item.appendChild(h);
  });
  let mode=null,sx,sy,ox,oy,ow,oh,rxb,ryb,before;
  item.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("movDel"))return;
    selectEl(item);
    sx=e.clientX;sy=e.clientY;ox=parseFloat(item.style.left)||0;oy=parseFloat(item.style.top)||0;ow=item.offsetWidth;oh=item.offsetHeight;
    before={left:item.style.left,top:item.style.top,width:item.style.width||ow+"px",height:item.style.height||oh+"px"};
    const h=e.target.closest(".movH");
    if(h){mode="resize";rxb=+h.dataset.rx;ryb=+h.dataset.ry;}
    else if(item.getAttribute("contenteditable")==="true"&&!e.altKey){mode="edit";return;} /* laisse écrire */
    else mode="move";
    e.preventDefault();e.stopPropagation();
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  });
  function mv(e){const dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode==="move"){item.style.left=(ox+dx)+"px";item.style.top=(oy+dy)+"px";}
    else if(mode==="resize"){let w=rxb?ow+dx:ow-dx,h2=ryb?oh+dy:oh-dy;w=Math.max(24,w);h2=Math.max(12,h2);item.style.width=w+"px";item.style.height=h2+"px";if(!rxb)item.style.left=(ox+ow-w)+"px";if(!ryb)item.style.top=(oy+oh-h2)+"px";}
  }
  function up(){window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
    if(mode==="move"||mode==="resize"){const after={left:item.style.left,top:item.style.top,width:item.style.width,height:item.style.height};
      if(after.left!==before.left||after.top!==before.top||after.width!==before.width||after.height!==before.height){pushAction(activeTab(),{undo:()=>setGeo(item,before),redo:()=>setGeo(item,after)});}
    }
    mode=null;if(onchange)onchange();
  }
}
/* ---------- undo / redo ---------- */
function pushAction(t,act){if(!t)return;t.undo=t.undo||[];t.redo=[];t.undo.push(act);if(t.undo.length>120)t.undo.shift();}
function editUndo(){const t=activeTab();if(!t||!t.undo||!t.undo.length)return;const a=t.undo.pop();a.undo();(t.redo=t.redo||[]).push(a);markDirty();}
function editRedo(){const t=activeTab();if(!t||!t.redo||!t.redo.length)return;const a=t.redo.pop();a.redo();t.undo.push(a);markDirty();}

/* ---------- Modifier (éditeur) ---------- */
let EDMODE="select",EDCOLOR="#111111";
function fontCss(f){return {Helvetica:"'Helvetica Neue',Arial,sans-serif",Times:"'Times New Roman',serif",Courier:"'Courier New',monospace"}[f]||"sans-serif";}
function hexRgb(h){h=(h||"#000").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16)||0;return {r:((n>>16)&255)/255,g:((n>>8)&255)/255,b:(n&255)/255};}
function applyColorToSel(c){if(!_sel)return;if(_sel.dataset.type==="text"){_sel.style.color=c;_sel.dataset.color=c;}else{_sel.dataset.color=c;const s=$(".edshape",_sel);if(s){if(_sel.dataset.type==="rect")s.style.borderColor=c;else s.style.background=c;}}markDirty();}
async function renderEditPdf(t,stage){

  const modes=[["select","Sélection",'<path d="M5 3l7 17 2.5-7 7-2.5z"/>'],["text","Texte",'<path d="M5 6h14M12 6v13"/>'],["image","Image",'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M4 18l5-5 4 3 3-3 4 5"/>'],["rect","Rectangle",'<rect x="4" y="5" width="16" height="14" rx="1"/>'],["line","Ligne",'<path d="M4 20L20 4"/>'],["hl","Surligneur",'<path d="M6 16l8-8 4 4-8 8H6z"/><path d="M4 20h16"/>'],["mask","Masquer",'<rect x="4" y="6" width="16" height="12" rx="1"/>']];
  modes.forEach(([m,lbl,ic])=>{const b=el("button","edmode"+(EDMODE===m?" on":""));b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${lbl}`;b.onclick=()=>{EDMODE=m;$$(".edmode",bar).forEach(x=>x.classList.remove("on"));b.classList.add("on");};bar.appendChild(b);});
  bar.appendChild(el("span","sep"));
  const sw=el("div","swatches");["#111111","#ffffff","#EF4444","#F59E0B","#FACC15","#10B981","#3B82F6","#4F46E5","#EC4899"].forEach(c=>{const s=el("div","swatch"+(c===EDCOLOR?" on":""));s.style.background=c;if(c==="#ffffff")s.style.boxShadow="inset 0 0 0 1px var(--line-strong)";s.onclick=()=>{EDCOLOR=c;$$(".swatch",sw).forEach(x=>x.classList.remove("on"));s.classList.add("on");applyColorToSel(c);};sw.appendChild(s);});
  bar.appendChild(sw);
  const ci=el("input");ci.type="color";ci.value="#111111";ci.title="Plus de couleurs";ci.oninput=()=>{EDCOLOR=ci.value;applyColorToSel(ci.value);};bar.appendChild(ci);
  bar.appendChild(el("span","sep"));
  const font=el("select");["Helvetica","Times","Courier"].forEach(f=>{const o=el("option",null,f);o.value=f;font.appendChild(o);});font.onchange=()=>{if(_sel&&_sel.dataset.type==="text"){_sel.dataset.font=font.value;_sel.style.fontFamily=fontCss(font.value);markDirty();}};bar.appendChild(font);
  const size=el("select");[10,12,14,16,18,24,28,36,48].forEach(n=>{const o=el("option",null,n+"px");o.value=n;size.appendChild(o);});size.value="14";size.onchange=()=>{if(_sel&&_sel.dataset.type==="text"){_sel.dataset.size=size.value;_sel.style.fontSize=size.value+"px";markDirty();}};bar.appendChild(size);
  bar.appendChild(el("span","sep"));
  const ub=el("button","edmode");ub.innerHTML="↶";ub.title="Annuler";ub.onclick=editUndo;
  const rb=el("button","edmode");rb.innerHTML="↷";rb.title="Rétablir";rb.onclick=editRedo;bar.append(ub,rb);
  const sp=el("span","sp");sp.style.flex="1";bar.appendChild(sp);
  const saveB=el("button","btn sm","Enregistrer le PDF modifié");saveB.onclick=()=>doSaveEdit(t);bar.appendChild(saveB);
  stage.appendChild(bar);
  const pages=el("div","pages");stage.appendChild(pages);
  const scale=1.5*(t.zoom||1);
  const imgInput=el("input");imgInput.type="file";imgInput.accept="image/*";imgInput.hidden=true;stage.appendChild(imgInput);
  let pend=null;
  imgInput.onchange=()=>{const f=imgInput.files[0];if(f&&pend){const rd=new FileReader();rd.onload=()=>addEl(pend.layer,pend.pg,"image",pend.x,pend.y,{src:rd.result});rd.readAsDataURL(f);}imgInput.value="";};
  for(let i=1;i<=t.pdf.numPages;i++){const p=await t.pdf.getPage(i);const {wrap}=await renderPageTo(p,scale,pages,"page");
    const layer=el("div","flayer");layer.style.pointerEvents="auto";layer.dataset.page=i;wrap.appendChild(layer);
    layer.addEventListener("pointerdown",e=>{ if(e.target!==layer)return;
      const r=layer.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
      if(EDMODE==="select"){if(_sel){_sel.classList.remove("selEl");_sel=null;}return;}
      if(EDMODE==="image"){pend={layer,pg:wrap,x,y};imgInput.click();return;}
      addEl(layer,wrap,EDMODE,x,y);
    });
  }
}
function addEl(layer,pg,type,x,y,opts){
  opts=opts||{};const it=el("div","movEl");it.dataset.type=type;it.dataset.page=pg.querySelector(".flayer")?pg.querySelector(".flayer").dataset.page:layer.dataset.page;
  it.style.left=Math.max(0,x)+"px";it.style.top=Math.max(0,y)+"px";
  if(type==="text"){it.setAttribute("contenteditable","true");it.classList.add("edtext");it.dataset.color=EDCOLOR;it.dataset.size="14";it.dataset.font="Helvetica";
    it.style.minWidth="60px";it.style.color=EDCOLOR;it.style.fontSize="14px";it.style.fontFamily=fontCss("Helvetica");it.textContent=opts.text||"Texte";}
  else if(type==="image"){it.style.width="160px";it.style.height="120px";const im=el("img");im.src=opts.src;im.style.cssText="width:100%;height:100%;object-fit:contain;pointer-events:none;display:block";it.appendChild(im);it.dataset.src=opts.src;}
  else{it.dataset.color=EDCOLOR;const shp=el("div","edshape");
    if(type==="rect"){it.style.width="120px";it.style.height="70px";shp.style.cssText=`width:100%;height:100%;border:2px solid ${EDCOLOR};box-sizing:border-box;pointer-events:none`;}
    else if(type==="line"){it.style.width="120px";it.style.height="3px";shp.style.cssText=`width:100%;height:100%;background:${EDCOLOR};pointer-events:none`;}
    else if(type==="hl"){it.style.width="120px";it.style.height="20px";shp.style.cssText=`width:100%;height:100%;background:${EDCOLOR};opacity:.4;pointer-events:none`;}
    else if(type==="mask"){it.style.width="120px";it.style.height="30px";shp.style.cssText=`width:100%;height:100%;background:${EDCOLOR};pointer-events:none`;}
    it.appendChild(shp);}
  const del=el("button","movDel","✕");del.onmousedown=e=>e.stopPropagation();del.onclick=e=>{e.stopPropagation();removeEl(it);};it.appendChild(del);
  layer.appendChild(it);makeMovable(it,pg,()=>markDirty());selectEl(it);markDirty();
  pushAction(activeTab(),{undo:()=>it.remove(),redo:()=>layer.appendChild(it)});
  if(type==="text")setTimeout(()=>it.focus(),0);
}
function removeEl(it){const t=activeTab();const parent=it.parentNode;const next=it.nextSibling;it.remove();if(_sel===it)_sel=null;markDirty();pushAction(t,{undo:()=>parent.insertBefore(it,next),redo:()=>it.remove()});}
async function doSaveEdit(t){
  try{ toast("Génération du PDF…");
    const {PDFDocument,rgb,StandardFonts,degrees}=PDFLib;
    const doc=await PDFDocument.load(u8(t.bytes).slice(0));
    const font=await doc.embedFont(StandardFonts.Helvetica);
    const scale=1.5*(t.zoom||1);
    for(const it of $$(".flayer .movEl")){
      const pageNum=+it.parentNode.dataset.page;if(!pageNum)continue;
      const pg=doc.getPage(pageNum-1);const {height}=pg.getSize();
      const xPt=parseFloat(it.style.left)/scale,yTop=parseFloat(it.style.top)/scale,wPt=it.offsetWidth/scale,hPt=it.offsetHeight/scale,yPt=height-yTop-hPt;
      const type=it.dataset.type;
      try{
        if(type==="text"){const c=hexRgb(it.dataset.color);const s=(parseFloat(it.dataset.size)||14)/scale;pg.drawText(it.textContent||"",{x:xPt+2/scale,y:height-yTop-s,size:s,font,color:rgb(c.r,c.g,c.b)});}
        else if(type==="image"){const src=it.dataset.src;const im=/png/i.test(src.slice(0,20))?await doc.embedPng(src):await doc.embedJpg(src);pg.drawImage(im,{x:xPt,y:yPt,width:wPt,height:hPt});}
        else if(type==="rect"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,borderColor:rgb(c.r,c.g,c.b),borderWidth:1.5});}
        else if(type==="mask"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,color:rgb(c.r,c.g,c.b)});}
        else if(type==="hl"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:hPt,color:rgb(c.r,c.g,c.b),opacity:.4});}
        else if(type==="line"){const c=hexRgb(it.dataset.color);pg.drawRectangle({x:xPt,y:yPt,width:wPt,height:Math.max(1,hPt),color:rgb(c.r,c.g,c.b)});}
      }catch(e){}
    }
    const ok=await saveBytes(await doc.save(),(t.name||"document").replace(/\.pdf$/i,"")+"-modifie.pdf");
    if(ok){t.dirty=false;updateSaveDot();toast("PDF modifié enregistré.","ok");}
  }catch(e){toast("Erreur : "+e.message,"err");}
}

/* ---------- Organiser ---------- */
async function renderOrganize(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const bar=el("div","actionbar");bar.innerHTML='<span class="info">Glissez pour réordonner. Pivotez ou supprimez des pages.</span><span class="sp"></span>';
  const save=el("button","btn sm","Enregistrer");bar.append(save);stage.appendChild(bar);
  const grid=el("div");grid.style.cssText="display:flex;flex-wrap:wrap;gap:14px;padding:18px;max-width:950px;margin:0 auto";stage.appendChild(grid);
  const order=[];for(let i=1;i<=t.pdf.numPages;i++)order.push({page:i,rot:0});
  async function draw(){grid.innerHTML="";for(let idx=0;idx<order.length;idx++){const o=order[idx];const p=await t.pdf.getPage(o.page);const vp=p.getViewport({scale:0.34,rotation:o.rot});
    const card=el("div");card.style.cssText="width:148px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow-sm)";card.draggable=true;
    const cv=el("canvas");cv.width=vp.width;cv.height=vp.height;cv.style.cssText="width:100%;border-radius:6px;display:block;background:#fff";await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;card.appendChild(cv);
    const row=el("div");row.style.cssText="display:flex;gap:3px;justify-content:center;align-items:center;margin-top:6px";
    const num=el("span",null,(idx+1)+"");num.style.cssText="font-size:11px;font-weight:700;color:var(--brand);margin-right:4px";
    const rl=el("button","ico");rl.innerHTML="⟲";rl.onclick=()=>{o.rot=(o.rot+270)%360;draw();};
    const rr=el("button","ico");rr.innerHTML="⟳";rr.onclick=()=>{o.rot=(o.rot+90)%360;draw();};
    const dl=el("button","ico");dl.innerHTML="✕";dl.onclick=()=>{order.splice(idx,1);draw();};
    row.append(num,rl,rr,dl);card.appendChild(row);
    card.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",idx));
    card.addEventListener("dragover",e=>e.preventDefault());
    card.addEventListener("drop",e=>{e.preventDefault();const from=+e.dataTransfer.getData("text/plain");if(from===idx)return;const m=order.splice(from,1)[0];order.splice(idx,0,m);draw();});
    grid.appendChild(card);}}
  await draw();
  save.onclick=async()=>{if(!order.length){toast("Aucune page.","warn");return;}
    try{const {PDFDocument,degrees}=PDFLib;const src=await PDFDocument.load(u8(t.bytes).slice(0));const out=await PDFDocument.create();
      for(const o of order){const [cp]=await out.copyPages(src,[o.page-1]);if(o.rot)cp.setRotation(degrees((cp.getRotation().angle+o.rot)%360));out.addPage(cp);}
      await saveBytes(await out.save(),(t.name||"document").replace(/\.pdf$/i,"")+"-organise.pdf");toast("Enregistré.","ok");
    }catch(e){toast("Erreur : "+e.message,"err");}};
}

/* ---------- Diviser ---------- */
function parseRanges(str,max){const out=[];(str||"").split(",").forEach(part=>{part=part.trim();if(!part)return;const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b){const z=a;a=b;b=z;}for(let i=a;i<=b;i++)if(i>=1&&i<=max)out.push(i);}else if(/^\d+$/.test(part)){const n=+part;if(n>=1&&n<=max)out.push(n);}});return[...new Set(out)];}
function renderSplit(t,stage){
  if(!t.pdf){renderOpenerInto(stage,t);return;}
  const wrap=el("div");wrap.style.cssText="max-width:520px;margin:26px auto;padding:0 20px";
  wrap.innerHTML=`<div class="actionbar" style="flex-direction:column;align-items:stretch;gap:12px"><div class="info">Diviser « ${t.name} » — ${t.pdf.numPages} pages</div><label style="font-size:13px;color:var(--ink-soft)">Plages de pages (ex. 1-3, 5, 8-10)</label><input id="spR" class="rp-input" placeholder="1-3, 5" style="margin:0"><label style="font-size:13px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="spE"> Une page par fichier (ZIP)</label><button class="btn sm" id="spGo" style="align-self:flex-start">Diviser et enregistrer</button></div>`;
  stage.appendChild(wrap);
  $("#spGo",wrap).onclick=async()=>{try{const {PDFDocument}=PDFLib;const src=await PDFDocument.load(u8(t.bytes).slice(0));const N=src.getPageCount();
    if($("#spE",wrap).checked){const zip=new JSZip();for(let i=0;i<N;i++){const d=await PDFDocument.create();const [p]=await d.copyPages(src,[i]);d.addPage(p);zip.file(`page-${i+1}.pdf`,await d.save());}const blob=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(t.name||"doc").replace(/\.pdf$/i,"")+"-pages.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("ZIP généré.","ok");return;}
    const r=parseRanges($("#spR",wrap).value,N);if(!r.length){toast("Indiquez des pages valides.","warn");return;}
    const d=await PDFDocument.create();const cp=await d.copyPages(src,r.map(n=>n-1));cp.forEach(p=>d.addPage(p));
    await saveBytes(await d.save(),(t.name||"doc").replace(/\.pdf$/i,"")+"-extrait.pdf");toast("Extrait enregistré.","ok");
  }catch(e){toast("Erreur : "+e.message,"err");}};
}
/* ---------- en-tête, thème, menus, init ---------- */
function updateHeader(){const t=activeTab();$("#docName").textContent=t&&t.pdf?t.name:"";updateSaveDot();
  $("#floatsig").classList.toggle("show",!!(t&&t.tool==="fillsign"&&t.pdf));}
$("#saveBtn").onclick=doSave;
$("#printBtn").onclick=()=>window.print();
$("#brandHome").onclick=()=>openTool("view");
$("#themeBtn").onclick=()=>{const d=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",d);try{localStorage.setItem("readix_theme",d);}catch(e){}};
try{const th=localStorage.getItem("readix_theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
$("#railMini").onclick=()=>$("#lrail").classList.toggle("mini");
$("#mobMenu").onclick=()=>$("#lrail").classList.toggle("mobopen");
function fixMob(){$("#mobMenu").style.display=window.innerWidth<=860?"grid":"none";}
window.addEventListener("resize",fixMob);fixMob();

/* menus déroulants (Créer, Compte) */
function bindMenu(btn,menu){btn.onclick=e=>{e.stopPropagation();const open=menu.classList.contains("open");$$(".menu.open").forEach(m=>m.classList.remove("open"));if(!open)menu.classList.add("open");};}
bindMenu($("#createBtn"),$("#createMenu"));bindMenu($("#acctBtn"),$("#acctMenu"));
document.addEventListener("click",()=>$$(".menu.open").forEach(m=>m.classList.remove("open")));
$("#createMenu").onclick=e=>{const b=e.target.closest("[data-create]");if(!b)return;const a=b.dataset.create;
  if(a==="tab"){createTab();openTool("view");}
  else if(a==="blank"){makeBlank();}
  else if(a==="img2pdf"){toast("Images → PDF arrive en Phase 2.","warn");}
};
async function makeBlank(){try{const {PDFDocument}=PDFLib;const d=await PDFDocument.create();d.addPage([595,842]);const bytes=await d.save();createTab("Nouveau document.pdf");await openPdfBytes(bytes,"Nouveau document.pdf");openTool("editpdf"in{}?"view":"view");}catch(e){}}

/* compte (Phase 1 : local, le back-end arrive en Phase 6) */
$("#umAuth").onclick=()=>toast("Comptes & connexion : Phase 6 (back-end).","warn");
$("#langSel").onchange=e=>{APP.lang=e.target.value;};

/* palette de commande */
$("#cmdInput").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.toLowerCase();const t=TOOLS.find(x=>x.name.toLowerCase().includes(q));if(t)openTool(t.id);}});
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();$("#cmdInput").focus();}
  else if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();doSave();}
  else if(mod&&e.key.toLowerCase()==="o"){e.preventDefault();$("#hiddenFile").click();}
  else if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();window.print();}
  else if(mod&&!e.shiftKey&&e.key.toLowerCase()==="z"){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editUndo();}}
  else if(mod&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){const t=activeTab();if(t&&t.tool==="editpdf"){e.preventDefault();editRedo();}}
});

/* ---------- init ---------- */
$("#rAi").onclick=()=>toast("Assistant IA : Phase 8.","warn");
(async function init(){
  createTab();switchTab(APP.active,false);
  try{await offerResume();}catch(e){}
  history.replaceState({tab:APP.active,tool:APP.tool},"","#view");
})();
</script>
